<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Informes JC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d5c">
<!-- La página es pública (GitHub Pages no permite otra cosa), pero no tiene por qué ser
     encontrable: esto la saca de Google y de cualquier buscador que respete el estándar.
     Los datos siguen cerrados por el ingreso con Google y la planilla de Usuarios. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Informes JC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  :root {
    /* mismos valores que estilo_informes.py (el estándar de los informes) */
    --bg: #eef3f9; --card: #ffffff; --card-2: #e4edf6;
    --ink: #182430; --muted: #51667a; --tenue: #8ea0b3;
    --line: rgba(24,36,48,.10); --line-fuerte: rgba(24,36,48,.18);
    --brand: #1f3d5c; --brand-ink: #f3f8fd; --brand-label: #a9c4e0;
    --accent: #33587e; --accent-claro: #5b93c9;
    --ok: #0a7d0a; --ok-bg: #e3f4e0;
    --bad: #c23a3a; --bad-bg: #fbe4e1;
    --warn: #5b7699; --warn-bg: #dde7f0;
    --run: #33587e; --run-bg: #e4edf6;
    --shadow: 0 1px 2px rgba(24,36,48,.06), 0 1px 3px rgba(24,36,48,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1620; --card: #16222f; --card-2: #1d2d3f;
      --ink: #e7eef6; --muted: #9fb2c6; --tenue: #7d91a6;
      --line: rgba(233,240,247,.10); --line-fuerte: rgba(233,240,247,.20);
      --brand: #16293d; --brand-ink: #f3f8fd; --brand-label: #a9c4e0;
      --accent: #8fc6dc; --accent-claro: #5b93c9;
      --ok: #7ec47e; --ok-bg: #143018;
      --bad: #e8938d; --bad-bg: #3a1a18;
      --warn: #a9c4e0; --warn-bg: #1f3148;
      --run: #8fc6dc; --run-bg: #1d2d3f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* overflow-x: clip y no hidden: hidden convierte al body en contenedor de scroll.
     El encabezado va con position:fixed y no sticky (03/11/2026): sticky depende de que
     ningún ancestro tenga overflow y en el Safari del celular no quedaba fijo. */
  /* El navegador oculta lo que tiene [hidden] con display:none, pero cualquier regla
     de autor que declare display le gana. Como "nav button" y ".cajon button" son
     display:flex, el atributo hidden no ocultaba los botones de la barra ni del menú:
     se veían aunque la persona no tuviera el permiso. Esta regla lo restituye. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip;
    font: 15px/1.45 "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* En iOS, la barra del navegador al aparecer y desaparecer despega los elementos
     "fixed" y no siempre los vuelve a su lugar: la barra de abajo terminaba flotando en
     el medio. La solución es que la página no scrollee: scrollea solo el contenido, en
     un recuadro entre el encabezado y la barra. Así ninguno de los dos se puede mover. */
  /* Con el encabezado, el contenido y la barra los tres "fixed", al body no le queda
     nada en el flujo: no hay nada que scrollear. El overflow es por las dudas. */
  body.app { height: 100%; overflow: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 6; background: var(--brand); color: var(--brand-ink);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header .marca { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; overflow: hidden; }
  header .marca > div { min-width: 0; }
  header .logo { height: 26px; width: auto; display: block; flex: none; }
  .fecha { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--brand-label); line-height: 1.3;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hola { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em;
    color: var(--brand-ink); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .estado { font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 5px 11px; max-width: 45%;
    border-radius: 100px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; flex: none; }
  .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-label); }
  .recargar { flex: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    color: var(--brand-ink); font-size: 17px; line-height: 1; padding: 0; }
  .recargar:active { background: rgba(255,255,255,.22); }
  .recargar.girando { animation: giro .9s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .estado.on .punto { background: #8fe08f; box-shadow: 0 0 0 3px rgba(143,224,143,.22); }
  .estado.off .punto { background: #f0a0a0; }
  #estadoTxt { overflow: hidden; text-overflow: ellipsis; }
  /* el alto real del encabezado lo mide medirCabecera() y lo deja en --alto-cab */
  body.sin-barra main { padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important; }
  main { padding: calc(var(--alto-cab, 76px) + 14px) 16px calc(84px + env(safe-area-inset-bottom));
    max-width: 760px; margin: 0 auto; }
  /* Con la página quieta, main es el que scrollea y ocupa justo el hueco que queda
     libre. Los títulos pegajosos de adentro se pegan a su borde de arriba (top: 0),
     que ya es el borde de abajo del encabezado. */
  body.app main { position: fixed; top: var(--alto-cab, 76px); left: 0; right: 0;
    bottom: var(--alto-barra, 0px); overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 0 16px calc(18px + env(safe-area-inset-bottom)); }
  /* El respiro de arriba va adentro de la sección, no en main: si fuera padding de main,
     los títulos pegajosos se pegarían 14px más abajo y las filas asomarían por encima.
     El límite de ancho también se muda acá, porque main ahora ocupa todo el hueco. */
  body.app main > section { max-width: 760px; margin: 0 auto; padding-top: 14px; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px;
    font-size: 13.5px; margin-bottom: 12px; display: none; }
  .rubro { margin: 20px 2px 9px; font-size: 11.5px; font-weight: 800; color: var(--accent-claro);
    text-transform: uppercase; letter-spacing: .08em; }
  .rubro:first-child { margin-top: 4px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .inf { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    text-align: left; cursor: pointer; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start;
    min-height: 58px; transition: transform .08s; }
  .inf:active { transform: scale(.98); }
  .inf .ico { font-size: 20px; line-height: 1.2; }
  .inf .nom { font-weight: 600; font-size: 14px; }
  .inf.critico { border-left: 3px solid var(--bad); }
  .pedido { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 8px; box-shadow: var(--shadow); }
  .ped-top { display: flex; gap: 8px; align-items: baseline; }
  .ped-nom { font-weight: 600; flex: 1; }
  .ped-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .badge { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; border-radius: 100px;
    padding: 4px 10px; white-space: nowrap; border: 1px solid var(--line-fuerte); }
  .b-pendiente { background: var(--warn-bg); color: var(--warn); }
  .b-generando { background: var(--run-bg); color: var(--run); }
  .b-listo { background: var(--ok-bg); color: var(--ok); }
  .b-error, .b-cancelado { background: var(--bad-bg); color: var(--bad); }
  .hoy { border-radius: 14px; padding: 11px 14px; margin-bottom: 12px; display: flex;
    flex-direction: column; gap: 2px; border: 1px solid var(--line-fuerte); }
  .hoy-t { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
  .hoy-d { font-size: 12.5px; opacity: .9; }
  .hoy-bien { background: var(--ok-bg); color: var(--ok); }
  .hoy-espera { background: var(--warn-bg); color: var(--warn); }
  .hoy-mal { background: var(--bad-bg); color: var(--bad); }
  .ped-msg { font-size: 13.5px; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ped-acc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; letter-spacing: .01em; cursor: pointer;
    background: var(--accent); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.sec { background: var(--card); color: var(--accent); border: 1px solid var(--line-fuerte); }
  .btn.peligro { background: var(--bad); color: #fff; }
  .btn.arch { width: 100%; margin-top: 6px; gap: 10px; text-align: left;
    justify-content: space-between; align-items: baseline; }
  .arch-nom { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
  .arch-fecha { flex: none; font-size: 12px; font-weight: 500; color: var(--tenue);
    font-variant-numeric: tabular-nums; }
  .btn:disabled { opacity: .5; }
  .vacio { text-align: center; color: var(--muted); padding: 40px 10px; }
  /* ---- Actividad (admin): control de pedidos y fallas ---- */
  .act-res { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
  @media (max-width: 380px) { .act-res { grid-template-columns: repeat(2, 1fr); } }
  .act-caja { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 0; }
  .act-caja .n { font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; }
  .act-caja .l { font-size: 11px; color: var(--muted); text-align: center; }
  .act-caja.act-ok { background: var(--ok-bg); border-color: var(--ok); }
  .act-caja.act-ok .n, .act-caja.act-ok .l { color: var(--ok); }
  .act-caja.act-mal { background: var(--bad-bg); border-color: var(--bad); }
  .act-caja.act-mal .n, .act-caja.act-mal .l { color: var(--bad); }
  .act-caja.act-espera { background: var(--warn-bg); border-color: var(--warn); }
  .act-caja.act-espera .n, .act-caja.act-espera .l { color: var(--warn); }
  .act-per { display: flex; align-items: center; gap: 10px; padding: 9px 0;
    border-top: 1px solid var(--line); }
  .act-per:first-child { border-top: 0; }
  .act-per .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .act-per b { font-variant-numeric: tabular-nums; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 10px 2px 12px;
    color: var(--muted); font-size: 11.5px; line-height: 1.2; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; }
  nav button .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav button .i { font-size: 20px; }
  nav button.act { color: var(--accent); font-weight: 700; }
  nav button span.i { opacity: .85; }
  nav button.act span.i { opacity: 1; }
  .cont { position: absolute; top: 4px; left: calc(50% + 8px); background: var(--bad); color: #fff; font-size: 10.5px;
    border-radius: 99px; padding: 1px 6px; display: none; }
  .menu-b { flex: none; border: 0; background: rgba(255,255,255,.12); color: var(--brand-ink);
    border: 1px solid rgba(255,255,255,.18); border-radius: 10px; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .menu-b .rayas { display: flex; flex-direction: column; gap: 4px; }
  .menu-b .rayas i { display: block; width: 17px; height: 2px; border-radius: 2px; background: currentColor; }
  .menu-b .cont { top: -5px; left: auto; right: -5px; }
  /* Cajón lateral: entra desde la izquierda. Acá van las pantallas que no entran en la
     barra de abajo, y es donde se suman las que vengan. */
  .cajon { position: fixed; top: 0; bottom: 0; left: 0; width: min(78vw, 290px); z-index: 10;
    background: var(--card); border-right: 1px solid var(--line); box-shadow: 2px 0 18px rgba(10,15,25,.18);
    padding: calc(env(safe-area-inset-top) + 16px) 12px calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-104%); transition: transform .2s ease; display: flex; flex-direction: column; gap: 4px; }
  .cajon.abierto { transform: none; }
  .cajon-tit { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding: 2px 10px 10px; }
  .cajon button { border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px; padding: 13px 10px; border-radius: 10px;
    color: var(--text); font-size: 15px; font-weight: 600; position: relative; }
  .cajon button .i { font-size: 19px; }
  .cajon button .t { flex: 1; }
  .cajon button.act { background: var(--accent-bg, rgba(31,61,92,.08)); color: var(--accent); }
  .cajon button .cont { position: static; display: none; }
  /* Las categorías de Tableros, un escalón adentro: se ve que cuelgan de ahí. */
  .cajon button .fl { color: var(--muted); font-size: 11px; }
  .cajon button .fl::before { content: '\25B8'; }
  .cajon button.abierto .fl::before { content: '\25BE'; }
  /* una guía fina a la izquierda: se ve de un vistazo que cuelgan de Tableros */
  #subTableros { border-left: 2px solid var(--line); margin: 2px 0 2px 26px; }
  .cajon button.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
  .cajon button.sub.act { background: var(--accent-bg, rgba(31,61,92,.08)); color: var(--accent); }
  .cajon-pie { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
  .cajon-pie .btn { width: 100%; justify-content: center; }
  .velo { position: fixed; inset: 0; background: rgba(10,15,25,.45); z-index: 9; display: none; }
  .hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow: auto; transform: translateY(105%); transition: transform .2s ease;
    max-width: 760px; margin: 0 auto; }
  .hoja.abierta { transform: none; }
  .hoja h2 { margin: 0 0 4px; font-size: 18px; }
  .hoja .desc { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .peligro-box { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px;
    font-size: 13.5px; margin: 0 0 12px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 10px 0 5px; }
  input, textarea, select.bq-sel { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; }
  textarea { min-height: 76px; resize: vertical; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* ---- tablero de ventas ---- */

  /* ---- réplica exacta de la primera hoja del "Resumen de ventas mensual" ----
     Es el mismo CSS del informe, acotado a .repl para que no toque el resto de la app. */
  .repl{ --r-page:#eef3f9; --r-surface:#ffffff; --r-surface-2:#e4edf6; --r-text:#182430;
    --r-text-2:#51667a; --r-muted:#8ea0b3; --r-border:rgba(24,36,48,.10);
    --r-border-strong:rgba(24,36,48,.18); --r-s1:#5b93c9; --r-s2:#33587e; --r-s3:#8fc6dc;
    --r-good:#0a7d0a; --r-good-soft:#e3f4e0; --r-crit:#c23a3a; --r-crit-soft:#fbe4e1;
    --r-new:#5b7699; --r-new-soft:#dde7f0; --r-hero:#1f3d5c; --r-hero-fg:#f3f8fd;
    display:flex; flex-direction:column; gap:22px; color:var(--r-text); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .repl{
    --r-page:#0f1620; --r-surface:#1b2530; --r-surface-2:#212d3a; --r-text:#eef3f9;
    --r-text-2:#b7c6d6; --r-muted:#8296ab; --r-border:rgba(238,243,249,.10);
    --r-border-strong:rgba(238,243,249,.18); --r-s1:#7db8ea; --r-s2:#5085b3; --r-s3:#a8dced;
    --r-good:#3fc23f; --r-good-soft:#173a17; --r-crit:#e66767; --r-crit-soft:#3f2222;
    --r-new:#8fb2d6; --r-new-soft:#22384d; --r-hero:#14263b; } }
  .repl .num{ font-variant-numeric: tabular-nums; }
  .repl .masthead{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; padding-bottom:18px; border-bottom:2px solid var(--r-text); }
  .repl .masthead .eyebrow{ font-size:12.5px; font-weight:700; letter-spacing:.11em;
    text-transform:uppercase; color:var(--r-s1); margin:0 0 8px; }
  .repl .masthead h1{ font-size:clamp(22px,5.5vw,40px); font-weight:800; letter-spacing:-.01em;
    margin:0; line-height:1.05; }
  .repl .masthead .sub{ margin:8px 0 0; color:var(--r-text-2); font-size:14px; max-width:56ch;
    text-transform:none; letter-spacing:normal; font-weight:400; }
  .repl .masthead .meta{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .repl .r-badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:5px 11px; border-radius:100px; background:var(--r-surface-2);
    border:1px solid var(--r-border-strong); color:var(--r-text-2); }
  .repl .r-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--r-s1); }
  .repl .meta .range{ font-size:13px; color:var(--r-muted); }
  .repl .kpi-hero{ background:var(--r-hero); color:var(--r-hero-fg); border-radius:14px;
    padding:20px 22px; display:flex; flex-wrap:wrap; align-items:center;
    justify-content:space-between; gap:18px; }
  .repl .kpi-hero .label{ font-size:13px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:#a9c4e0; margin:0 0 8px; }
  .repl .kpi-hero .value{ font-size:clamp(30px,8vw,58px); font-weight:800; letter-spacing:-.015em;
    line-height:1; }
  .repl .kpi-hero .delta{ font-size:15px; font-weight:700; margin-top:10px; }
  .repl .kpi-hero .delta.up{ color:#8fe08f; } .repl .kpi-hero .delta.down{ color:#f0a0a0; }
  .repl .kpi-hero .delta .prev{ color:#a9c4e0; font-weight:500; }
  .repl .kpi-hero .split{ display:flex; gap:28px; }
  .repl .kpi-hero .plabel{ font-size:11px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:#a9c4e0; margin-bottom:4px; }
  .repl .kpi-hero .pvalue{ font-size:18px; font-weight:700; }
  .repl .r-kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .repl .r-kpi{ background:var(--r-surface); border:1px solid var(--r-border); border-radius:10px;
    padding:14px 16px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .repl .r-kpi .label{ font-size:11.5px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:var(--r-muted); }
  .repl .r-kpi .value{ font-size:21px; font-weight:700; letter-spacing:-.01em; }
  .repl .r-kpi .delta{ font-size:12.5px; font-weight:600; }
  .repl .r-kpi .delta.up{ color:var(--r-good); } .repl .r-kpi .delta.down{ color:var(--r-crit); }
  .repl .r-kpi .delta .prev{ color:var(--r-muted); font-weight:500; }

    border-top: 1px solid var(--line); padding-top: 10px; }
  .preg-resp.pensando { color: var(--muted); font-style: italic; border-top: 0; }
  .preg-resp.error { color: var(--bad); }
  .chks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; margin-top: 4px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 14px; font-weight: 400;
    color: var(--ink); margin: 0; cursor: pointer; }
  .chk input { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .sub { font-size: 11.5px; color: var(--accent-claro); margin: 16px 0 2px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .08em; }
  .acciones { display: flex; gap: 10px; margin-top: 18px; }
  .acciones .btn { flex: 1; justify-content: center; padding: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20;
    display: none; max-width: calc(100% - 32px); }
  @media (max-width: 400px) {
    header { gap: 6px; padding-inline: 12px; }
    header .logo { height: 22px; }
    .fecha { font-size: 10.5px; letter-spacing: .04em; }
    .hola { font-size: 13.5px; }
    .recargar { width: 30px; height: 30px; font-size: 15px; }
    main { padding-inline: 12px; }
    nav button { font-size: 10.5px; }
    nav button .i { font-size: 18px; }
  }
  @media (max-width: 365px) {
    .estado { padding: 6px; }
    #estadoTxt { display: none; }
    nav button { font-size: 9.8px; letter-spacing: -.01em; }
  }
  /* ingreso */
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #login .logo { width: 92px; height: 92px; border-radius: 22px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  #login .logo img { width: 52px; height: auto; display: block; }
  #login h2 { margin: 10px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent-claro); }
  #login p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; }
  #login .err { color: var(--bad); font-size: 14px; max-width: 340px; min-height: 20px; }

  /* Resultados de los procesos automáticos en Actividad (26/11/2026): el texto va
     completo y tal cual lo escribió el robot, con sus renglones y su alineación. */
  .act-auto-sum { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0;
    list-style: none; }
  .act-auto-sum::-webkit-details-marker { display: none; }
  .act-auto-sum::before { content: '▸ '; }
  details[open] > .act-auto-sum::before { content: '▾ '; }
  .act-auto { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.45;
    color: var(--ink); margin: 2px 0 4px; font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------- iOS: el zoom al tocar
     un campo (25/11/2026). En iPhone, si el campo tiene menos de 16 px, Safari agranda
     la pantalla solo al tocarlo —y en la app instalada no la vuelve a achicar nunca—:
     la app queda más grande y corrida. No se arregla con el viewport (iOS ignora
     maximum-scale y user-scalable desde hace años); la única forma es que los campos
     midan 16 px. Va solo en pantallas táctiles, así que en la notebook no cambia nada.
     Los tamaños de la app son 15 px: la diferencia no se nota, el zoom sí. */
  @media (pointer: coarse) {
    input, textarea, select, select.bq-sel, .preg-caja textarea { font-size: 16px; }
  }
</style>
</head>

<script>
var SESION = null;
var DATA = { informes: [], pedidos: [], robot: {}, usuario: {} };
var CLIENTES = null, ACTUAL = null, ELEGIDOS = [], timer = null, confirmando = false;
var VERSION_APP = '2026-11-26 · 9';   // se muestra en la pantalla de la cuenta
var AUTOS = null, USU = null, EDIT = null, PREGS = [], timerPreg = null;
var HILO = '';        // la charla que sigue lo que se escriba; vacío = empieza una nueva
var ADENTRO = false;  // la app ya está abierta: no volver a elegir pantalla de arranque
var TAB_AUTO = 'informes';     // sub-pestaña de Automáticos: 'informes', 'buscar' u 'horarios' (admin)

// El encabezado es position:fixed, así que el contenido necesita saber cuánto mide para
// no quedar tapado. Se mide de verdad (cambia con la muesca del celular y con la fuente).
/** Mide el encabezado y la barra de abajo: entre los dos definen el hueco que ocupa el
 *  contenido, que es el único que scrollea. Se vuelve a medir al rotar o cambiar el tamaño. */
function medirCabecera() {
  var c = $('cab'), b = $('barra'), r = document.documentElement.style;
  if (c && !c.hidden && c.offsetHeight) r.setProperty('--alto-cab', c.offsetHeight + 'px');
  r.setProperty('--alto-barra', (b && !b.hidden && b.offsetHeight ? b.offsetHeight : 0) + 'px');
}
window.addEventListener('resize', medirCabecera);
window.addEventListener('orientationchange', function () { setTimeout(medirCabecera, 250); });
// El contenido (main) está fijo entre --alto-cab y --alto-barra, y hasta acá esas dos medidas
// solo se recalculaban con resize, orientationchange, al cargar las tipografías y al entrar.
// Pero el encabezado y la barra cambian de alto sin que haya resize: el relleno de arriba
// depende de env(safe-area-inset-top) (cambia en la app instalada y con la barra del navegador),
// y la barra de abajo se esconde y se vuelve a mostrar al cambiar de pantalla. Cuando pasa eso,
// la medida queda vieja y el contenido se ve corrido: tapado por el encabezado o con un hueco.
// Mirando el tamaño real de los dos elementos se vuelve a medir solo, sin tener que acordarse
// de llamarlo en cada lugar que los toca.
// Se mira la caja de borde a propósito: lo que cambia es el relleno, y la caja de contenido
// —la que mira por defecto— no se mueve con eso. Probado: con la caja de contenido el
// desfase de 24 px seguía igual; con la caja de borde queda en 0.
if (window.ResizeObserver) {
  var obsAlto = new ResizeObserver(function () { medirCabecera(); });
  ['cab', 'barra'].forEach(function (id) {
    var e = $(id); if (!e) return;
    try { obsAlto.observe(e, { box: 'border-box' }); } catch (x) { obsAlto.observe(e); }
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(medirCabecera);

// Lo otro que corre la app en el celular es el teclado: aunque la página no scrollea
// (body overflow:hidden), iOS la mueve igual para dejar ver el campo, y al cerrarse el
// teclado no siempre la devuelve. Queda el encabezado tapado o con un hueco. Cuando no
// hay ningún campo con el foco, se la vuelve a poner en su lugar y se mide de nuevo.
document.addEventListener('focusout', function () {
  setTimeout(function () {
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;   // saltó a otro campo
    window.scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
    medirCabecera();
  }, 150);
});
// El teclado tampoco dispara "resize" de la ventana en iOS, pero sí cambia el viewport
// visual: es el único aviso de que el hueco de la pantalla cambió.
if (window.visualViewport) window.visualViewport.addEventListener('resize', medirCabecera);

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 3600); }
function pintarFecha() {
  var d = new Date();
  $('fecha').textContent =
    d.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: 'short' })
     .replace('.', '') + ' · ' +
    d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
pintarFecha();
setInterval(pintarFecha, 20000);

function hora(ms) { if (!ms) return ''; var d = new Date(ms), h = new Date();
  var hm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === h.toDateString() ? hm : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' + hm; }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function deIso(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
// informes que piden confirmación: conciliar cheques y las órdenes al robot (clave __)
function critico(i) { return !!i.confirmar || String(i.clave).indexOf('__') === 0; }

// ---------------------------------------------------------------- servidor
function api(accion, extra) {
  var cuerpo = { accion: accion, sesion: SESION };
  for (var k in (extra || {})) cuerpo[k] = extra[k];
  // sin headers propios: así el pedido no necesita permiso previo del navegador
  return fetch(CONFIG.servidor, { method: 'POST', redirect: 'follow', body: JSON.stringify(cuerpo) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.error) {
        if (d.error === 'sesion_invalida') { salir('Tu sesión venció. Entrá de nuevo.'); }
        throw new Error(d.error);
      }
      return d;
    });
}

// ---------------------------------------------------------------- ingreso
function iniciarGoogle() {
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(iniciarGoogle, 300); return; }
  google.accounts.id.initialize({ client_id: CONFIG.client_id, callback: conCredencial, auto_select: true });
  google.accounts.id.renderButton($('botonGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with',
                                                      shape: 'pill', locale: 'es' });
}
function conCredencial(resp) {
  $('loginErr').textContent = '';
  if (window.IMP) IMP.login(resp.credential);      // misma identidad de Google para la base de Importaciones
  fetch(CONFIG.servidor, { method: 'POST', redirect: 'follow',
                           body: JSON.stringify({ accion: 'entrar', id_token: resp.credential }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) { $('loginErr').textContent = d.error; return; }
      SESION = d.sesion;
      try { localStorage.setItem('sesion', SESION); } catch (e) {}
      // Google entra solo (auto_select) y tarda uno o dos segundos más que la sesión
      // guardada. Si la app YA está abierta, esto llega tarde: alcanza con quedarse con la
      // sesión nueva. Volver a entrar acá era lo que te devolvía a Principal justo después
      // de tocar otro acceso directo, porque entrarApp termina en pantallaDeArranque.
      if (ADENTRO) return;
      entrarApp(d);
    })
    .catch(function () { $('loginErr').textContent = 'No pude conectarme. Revisá internet y probá de nuevo.'; });
}
function salir(msg) {
  SESION = null; ADENTRO = false; clearTimeout(timer);
  try { localStorage.removeItem('sesion'); } catch (e) {}
  if (window.IMP) IMP.salir();
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  $('login').style.display = 'flex';
  cerrarTodo();
  document.body.classList.remove('app');     // la pantalla de ingreso sí scrollea normal
  $('cab').hidden = $('cuerpo').hidden = $('barra').hidden = true;
  $('loginErr').textContent = msg || '';
}
function menuCuenta() {
  var h = '<h2>' + esc(DATA.usuario.nombre || '') + '</h2>' +
          '<div class="ped-sub">' + esc(DATA.usuario.email || '') + '</div>' +
          '<div class="sub">Avisos en este teléfono</div>' +
          '<div class="ped-msg" id="avEstado">' + esc(textoAvisos()) + '</div>' +
          '<div class="ped-sub" id="avDatos">' + esc(datosAvisos()) + '</div>' +
          '<div class="acciones">' +
          '<button class="btn" onclick="pedirAvisos()">' +
          (puedeActivarAvisos() ? 'Activar avisos' : 'Revincular este teléfono') + '</button>' +
          '<button class="btn sec" onclick="probarAviso(this)">Probar aviso</button></div>' +
          '<div class="acciones" style="margin-top:18px">' +
          '<button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
          '<button class="btn sec" onclick="cerrarHoja();salir()">Cerrar sesión</button></div>' +
          '<div class="ped-sub" style="margin-top:14px">Versión ' + esc(VERSION_APP) +
          ' · tableros: ' + esc((DATA.tableros || ['(no los manda el servidor)']).join(', ')) + '</div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
}

/** Por qué los avisos andan o no, en castellano. Sirve para no adivinar. */
function textoAvisos() {
  if (!DATA.push) return 'El servidor todavía no tiene cargado el App ID de OneSignal. ' +
                         'Se carga en la planilla: Robot 3C › Cargar las notificaciones.';
  if (!('serviceWorker' in navigator) || !('Notification' in window))
    return 'Este navegador no admite avisos. En iPhone hay que abrir la app desde el ícono ' +
           'de la pantalla de inicio, no desde Safari.';
  if (!window.OneSignal || !OneSignal.Notifications)
    return 'El servicio de avisos no terminó de cargar. Cerrá la app y volvé a abrirla; ' +
           'si sigue igual, puede estar bloqueado el acceso a onesignal.com.';
  if (Notification.permission === 'denied')
    return 'Bloqueaste los avisos para este sitio. Hay que habilitarlos a mano en los ' +
           'ajustes del navegador o del teléfono y volver a entrar.';
  if (!OneSignal.Notifications.permission) return 'Todavía no activaste los avisos en este teléfono.';
  return 'Activados. Si no llega ninguno, probá con el botón de acá abajo.';
}
/** Lo que el teléfono tiene registrado. Si falta el mail, el servidor no sabe a quién mandarle. */
function datosAvisos() {
  try {
    if (!window.OneSignal || !OneSignal.User) return '';
    var sub = OneSignal.User.PushSubscription || {};
    return 'Suscripción: ' + (sub.id ? String(sub.id).slice(0, 8) : 'sin registrar') +
           ' · mail vinculado: ' + (OneSignal.User.externalId ? 'sí' : 'NO') +
           ' · activa: ' + (sub.optedIn ? 'sí' : 'no');
  } catch (e) { return ''; }
}
function puedeActivarAvisos() {
  if (!DATA.push || !window.OneSignal || !OneSignal.Notifications) return false;
  if (!('Notification' in window) || Notification.permission === 'denied') return false;
  return !OneSignal.Notifications.permission;
}
function probarAviso(b) {
  b.disabled = true; b.textContent = 'Mandando…';
  var poner = function (t) { if ($('avEstado')) $('avEstado').textContent = t; };
  poner('Mandando…');
  api('probar_aviso').then(function (d) {
    poner(d.ok ? 'Mandado a ' + (d.destinatarios != null ? d.destinatarios : 1) +
                 ' teléfono(s). Si no llega, revisá que la app tenga permiso de notificaciones ' +
                 'en los ajustes del teléfono.'
               : (d.error || 'No se pudo mandar.'));
  }).catch(function (e) { poner('Error del servidor: ' + (e.message || e)); })
    .then(function () { b.disabled = false; b.textContent = 'Probar aviso'; });
}

function entrarApp(d) {
  var primeraVez = !ADENTRO;
  ADENTRO = true;
  DATA = d;
  $('login').style.display = 'none';
  document.body.classList.add('app');        // de acá en más scrollea el contenido, no la página
  $('cab').hidden = $('cuerpo').hidden = $('barra').hidden = false;
  medirCabecera();
  $('hola').textContent = 'Hola, ' + d.usuario.nombre;
  $('tAuto').hidden = !(d.hay_automaticos || d.hay_tareas);
  acomodarTableros(d);
  $('tPreguntar').hidden = !d.puede_preguntar;
  $('tUsuarios').hidden = $('tActividad').hidden = d.usuario.rol !== 'admin';
  acomodarBarra();
  pintarEstado(); pintarInformes(); pintarPedidos(); programar();
  // La pantalla de arranque se elige UNA sola vez por apertura. Si entrarApp se vuelve a
  // llamar (Google que entra solo, una sesión renovada), mover la pantalla sacaría a la
  // persona de donde estaba.
  if (primeraVez) pantallaDeArranque(d);
  if (window.IMP) IMP.iniciar();
  prepararAvisos(d.push, d.usuario.email);
}

/**
 * Con qué pantalla se abre la app. Quien tenga habilitado "Resumen de vta" (la réplica
 * del Informe de vtas diarias) arranca ahí; si no lo tiene pero tiene algún otro tablero,
 * arranca en el primero que le toque; y quien no tenga ninguno sigue abriendo en Pedir,
 * como antes. Los permisos los decide el servidor en d.tableros, así que acá no hay nada
 * que configurar: alcanza con habilitarle el tablero a la persona en Usuarios.
 */
function pantallaDeArranque(d) {
  if (!d.hay_tablero) return;                       // sin tableros: queda Pedir
  var suyos = d.tableros || VISTAS_TAB.map(function (v) { return v[0]; });
  var elegido = suyos.indexOf('dia') >= 0
    ? 'dia'
    : (VISTAS_TAB.map(function (v) { return v[0]; })
                 .filter(function (v) { return suyos.indexOf(v) >= 0; })[0] || '');
  if (!elegido) return;
  if (elegido === 'dia') return irPrincipal();     // el tablero de ventas es la pantalla de inicio
  TAB_VISTA = elegido;
  verGrupo(grupoDe(elegido));         // cada tablero abre por la puerta de su grupo
}

/**
 * Notificaciones al celular. El App ID lo manda el servidor, así que si todavía no
 * está cargado en la planilla esto no hace nada y la app funciona igual.
 * El service worker de OneSignal vive en push/ para no chocar con el nuestro.
 */
var AVISOS_LISTO = false;
function prepararAvisos(appId, email) {
  if (!appId || AVISOS_LISTO || !('serviceWorker' in navigator)) return;
  AVISOS_LISTO = true;
  var s = document.createElement('script');
  s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  s.defer = true;
  document.head.appendChild(s);
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function (OneSignal) {
    OneSignal.init({ appId: appId,
                     serviceWorkerPath: 'push/OneSignalSDKWorker.js',
                     serviceWorkerParam: { scope: location.pathname.replace(/[^/]*$/, '') + 'push/' } })
      .then(function () { return OneSignal.login(String(email).toLowerCase()); })
      .catch(function () { /* sin avisos, la app anda igual */ });
  });
}

/** Pide permiso para los avisos. Se llama desde el menú de la cuenta. */
function pedirAvisos() {
  if (!window.OneSignal || !OneSignal.Notifications) {
    if ($('avEstado')) $('avEstado').textContent = 'El servicio de avisos no cargó todavía.';
    return;
  }
  if ($('avEstado')) $('avEstado').textContent = 'Pidiendo permiso…';
  OneSignal.Notifications.requestPermission()
    .then(function () {
      if (!OneSignal.Notifications.permission) { toast('Avisos rechazados'); return null; }
      return OneSignal.User.PushSubscription.optIn()
        .then(function () { return OneSignal.login(String(DATA.usuario.email).toLowerCase()); });
    })
    .then(function () {
      if ($('avEstado')) $('avEstado').textContent = textoAvisos();
      if ($('avDatos')) $('avDatos').textContent = datosAvisos();
    })
    .catch(function (e) {
      if ($('avEstado')) $('avEstado').textContent =
        'No pude activar los avisos: ' + (e && e.message ? e.message : e);
    });
}

function arrancar() {
  try { SESION = localStorage.getItem('sesion'); } catch (e) {}
  iniciarGoogle();
  if (!SESION) return;
  api('inicio').then(entrarApp).catch(function (e) {
    if (String(e.message) !== 'sesion_invalida') $('loginErr').textContent = e.message || '';
  });
}

// ---------------------------------------------------------------- refresco
function programar() {
  clearTimeout(timer);
  if (!SESION) return;
  var activos = DATA.pedidos.some(function (p) { return p.estado === 'pendiente' || p.estado === 'generando'; });
  timer = setTimeout(refrescar, document.hidden ? 60000 : (activos ? 6000 : 25000));
}
function refrescar() {
  if (!SESION) return;
  api('refrescar').then(function (d) {
    var antes = {}; DATA.pedidos.forEach(function (p) { antes[p.id] = p.estado; });
    DATA.robot = d.robot; DATA.pedidos = d.pedidos;
    d.pedidos.forEach(function (p) {
      if (antes[p.id] && antes[p.id] !== p.estado && (p.estado === 'listo' || p.estado === 'error'))
        toast((p.estado === 'listo' ? '✅ Listo: ' : '⚠️ Falló: ') + p.informe);
    });
    pintarEstado(); pintarPedidos();
  }).catch(function () {}).then(programar);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });

function actualizar() {
  var b = $('bRecargar');
  b.classList.add('girando');
  buscarVersion();                              // ¿hay una versión nueva publicada?
  var tareas = [api('refrescar').then(function (d) {
    DATA.robot = d.robot; DATA.pedidos = d.pedidos; pintarEstado(); pintarPedidos(); programar();
  })];
  if (!$('vAuto').hidden) { tareas.push(api('automaticos', { fresco: 1 }).then(function (d) {
    AUTOS = d.informes; if (TAB_AUTO === 'informes') pintarAutomaticos();
    try { localStorage.setItem(claveAutos(), JSON.stringify(AUTOS)); } catch (e) { /* no es grave */ }
  })); }
  if (!$('vPreguntar').hidden) tareas.push(api('preguntas').then(function (d) {
    PREGS = d.preguntas; pintarPreguntas();
  }));
  if (!$('vUsuarios').hidden) tareas.push(api('usuarios').then(function (d) { USU = d; pintarUsuarios(); }));
  if (!$('vPedir').hidden) tareas.push(api('inicio').then(function (d) {
    DATA.informes = d.informes; $('tAuto').hidden = !(d.hay_automaticos || d.hay_tareas);
    acomodarTableros(d);
    $('tPreguntar').hidden = !d.puede_preguntar; acomodarBarra(); pintarInformes();
  }));
  CLIENTES = null;                              // la lista de clientes se vuelve a pedir
  Promise.all(tareas).then(function () { toast('Actualizado'); })
    .catch(function (e) { toast(e.message || 'No pude actualizar.'); })
    .then(function () { setTimeout(function () { b.classList.remove('girando'); }, 400); });
}

function buscarVersion() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistration) return;
  navigator.serviceWorker.getRegistration().then(function (reg) { if (reg) reg.update(); })
    .catch(function () {});
}

// ---------------------------------------------------------------- pintar
function pintarEstado() {
  var r = DATA.robot || {}, e = $('estado'), t = $('estadoTxt'), av = $('aviso');
  e.className = 'estado ' + (r.en_linea ? 'on' : 'off');
  if (r.en_linea) {
    t.textContent = r.ocupado ? 'Trabajando' : 'Conectado';
    av.style.display = 'none';
  } else {
    t.textContent = 'Sin conexión';
    av.innerHTML = '⚠️ La notebook no responde' + (r.ultimo ? ' desde ' + esc(hora(r.ultimo)) : '') +
      '. Podés dejar el pedido igual: se genera cuando vuelva.';
    av.style.display = 'block';
  }
}

/** Lo del rubro Robot no es un informe: son órdenes para la notebook. Vive en Comandos. */
function esComando(i) { return (i.rubro || '') === 'Robot'; }

/* El orden de los comandos lo fija la app, no el catálogo que manda la notebook: así se
   cambia sin reiniciar el bot, y un comando nuevo que todavía no esté en esta lista cae al
   final en vez de desaparecer. Van de lo más usado a lo más fuerte. */
var ORDEN_COMANDOS = ['__cancelar', '__reiniciar', '__reiniciar_forzar', '__abrir_claude',
                      '__reiniciar_pc', '__cancelar_reinicio'];

function botonInforme(i) {
  return '<button class="inf' + (critico(i) ? ' critico' : '') + '" onclick="abrir(\'' + esc(i.clave) + '\')">' +
    '<span class="ico">' + esc(i.dibujo || '📄') + '</span><span class="nom">' + esc(i.nombre) + '</span></button>';
}

function pintarInformes() {
  var porRubro = {}, orden = [];
  DATA.informes.filter(function (i) { return !esComando(i); }).forEach(function (i) {
    var r = i.rubro || 'Otros';
    if (!porRubro[r]) { porRubro[r] = []; orden.push(r); }
    porRubro[r].push(i);
  });
  $('vPedir').innerHTML = orden.length
    ? orden.map(function (r) {
        return '<div class="rubro">' + esc(r) + '</div><div class="grilla">' +
               porRubro[r].map(botonInforme).join('') + '</div>';
      }).join('')
    : '<div class="vacio">Todavía no hay informes habilitados para vos.</div>';
  pintarComandos();
}

function pintarComandos() {
  var cs = DATA.informes.filter(esComando).slice().sort(function (a, b) {
    var ia = ORDEN_COMANDOS.indexOf(a.clave), ib = ORDEN_COMANDOS.indexOf(b.clave);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  $('tComandos').hidden = !cs.length;
  if (!cs.length) { $('vComandos').innerHTML = ''; return; }
  // sin título de rubro: la pantalla ya se llama Comandos y son todos del mismo grupo
  $('vComandos').innerHTML =
    '<div class="ped-sub" style="margin:2px 0 12px">Órdenes para la notebook. No generan ningún informe.</div>' +
    '<div class="grilla">' + cs.map(botonInforme).join('') + '</div>';
}

function pintarPedidos() {
  var p = DATA.pedidos, activos = p.filter(function (x) { return x.estado === 'pendiente' || x.estado === 'generando'; }).length;
  // el contador va en "Mis informes" (dentro del cajón) y repetido sobre el botón del menú,
  // porque si no, con el cajón cerrado no habría forma de enterarse de que algo terminó
  [$('cont'), $('contMenu')].forEach(function (c) {
    if (!c) return;
    c.textContent = activos;
    c.style.display = activos ? 'block' : 'none';
  });
  if (!p.length) { $('vMios').innerHTML = '<div class="vacio">Acá aparecen los informes que pidas.</div>'; return; }
  var nombres = { pendiente: 'En cola', generando: 'Generando…', listo: 'Listo', error: 'Error', cancelado: 'Cancelado' };
  $('vMios').innerHTML = p.map(function (x) {
    var acc = x.archivos.map(function (a, n) {
      var xl = /\.xlsx?$/i.test(a.nombre);
      return '<button class="btn" onclick="bajar(\'' + esc(x.id) + '\',' + n + ',this)">' +
        (xl ? '📊 Abrir Excel' : '📄 Abrir PDF') + '</button>';
    }).join('');
    if (x.estado === 'pendiente') acc += '<button class="btn sec" onclick="cancelar(\'' + esc(x.id) + '\')">Cancelar</button>';
    if (x.estado === 'listo' || x.estado === 'error') acc += '<button class="btn sec" onclick="repetir(\'' + esc(x.id) + '\')">↻ Repetir</button>';
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' + esc(x.informe) + '</span>' +
      '<span class="badge b-' + esc(x.estado) + '">' + (nombres[x.estado] || esc(x.estado)) + '</span></div>' +
      '<div class="ped-sub">' + esc(hora(x.creado)) + (x.detalle ? ' · ' + esc(x.detalle) : '') + '</div>' +
      (x.mensaje ? '<div class="ped-msg">' + esc(x.mensaje) + '</div>' : '') +
      (acc ? '<div class="ped-acc">' + acc + '</div>' : '') + '</div>';
  }).join('');
}

var VISTAS = { pedir: ['vPedir', 'tPedir'], auto: ['vAuto', 'tAuto'], tablero: ['vTablero', 'tVentas'],
               preguntar: ['vPreguntar', 'tPreguntar'],
               mios: ['vMios', 'tMios'], usuarios: ['vUsuarios', 'tUsuarios'],
               comandos: ['vComandos', 'tComandos'],
               actividad: ['vActividad', 'tActividad'],
               import: ['vImport', 'tImport'],
               principal: ['vPrincipal', 'tPrincipal'] };
/** Qué tableros ve esta persona: el completo va al cajón, y Hoy y Resumen de vta tienen
 *  atajo abajo, pero solo si los tiene habilitados. Un servidor viejo no manda la lista
 *  de tableros; en ese caso se asume que los tiene todos, como hace vistasMias(). */
function acomodarTableros(d) {
  var tabs = d.tableros || ['hoy', 'dia', 'proy', 'mes', 'bancos'];
  $('tPrincipal').hidden = !d.hay_tablero || tabs.indexOf('dia') < 0;
  GRUPOS_TAB.forEach(function (g) {
    var b = $(g.boton);
    if (b) {
      b.hidden = !d.hay_tablero || !tabs.some(function (v) { return g.vistas.indexOf(v) >= 0; });
    }
  });
  // Cada categoría del cajón aparece solo si la persona tiene alguno de sus tableros, y
  // "Tableros" solo si le queda alguna categoría. Misma regla que los accesos de abajo.
  var hayCat = !!$('tPrincipal') && !$('tPrincipal').hidden;
  if ($('sPrincipal')) $('sPrincipal').hidden = !hayCat;
  GRUPOS_TAB.forEach(function (g) {
    var sb = $(g.sub), b = $(g.boton);
    if (sb && b) { sb.hidden = b.hidden; if (!b.hidden) hayCat = true; }
  });
  $('tTableroMas').hidden = !hayCat;
  if ($('tTableroMas').hidden) desplegarTableros(false);
}

/** Si a esta persona no le toca ninguna de las pantallas de abajo, la barra se saca
 *  entera: una franja vacía al pie se ve como un error. Todo sigue a mano en el cajón. */
function acomodarBarra() {
  var hay = ['tPrincipal', 'tVentas', 'tFinanzas', 'tCtaCte', 'tPreguntar']
    .some(function (b) { return $(b) && !$(b).hidden; });
  $('barra').hidden = !hay;
  document.body.classList.toggle('sin-barra', !hay);
  medirCabecera();     // la altura de la barra define dónde termina el contenido
}

/** Lleva el contenido al principio. Ahora el que scrollea es main, no la página. */
function alPrincipio() {
  var m = $('cuerpo');
  if (m && m.scrollTo) m.scrollTo(0, 0); else if (m) m.scrollTop = 0;
  window.scrollTo(0, 0);       // por si algún navegador viejo sigue scrolleando la página
}

function abrirCajon() {
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('cajon').className = 'cajon abierto'; });
}
function cerrarCajon() {
  $('cajon').className = 'cajon';
  if ($('hoja').className.indexOf('abierta') < 0) $('velo').style.display = 'none';
}
/** El velo tapa tanto el cajón como la hoja de abajo: al tocarlo se cierra lo que haya. */
function cerrarTodo() { cerrarCajon(); cerrarHoja(); }

/**
 * Hay tres puertas al mismo tablero, y cada una trae sus propias sub-pestañas:
 *   - "Ventas", abajo: Hoy y Resumen de vta;
 *   - "Finanzas", abajo: Bancos, MP, Cheques a ingresar y Cheques emitidos;
 *   - "Tableros", en el cajón: todos los que tenga, sin filtrar.
 * TAB_GRUPO es la que decide cuáles se dibujan.
 */
function verGrupo(g) {
  TAB_GRUPO = g || 'ventas';
  var hay = vistasMias().map(function (v) { return v[0]; });
  if (hay.indexOf(TAB_VISTA) < 0) TAB_VISTA = hay[0] || 'hoy';
  ver('tablero');
}

/** "Principal": el informe de ventas diarias (la réplica del PDF). Es la misma vista que
 *  Tablero › Resumen de vta, pero con entrada propia arriba del menú, que es como se
 *  entra todos los días. Aparece solo para quien tenga ese tablero habilitado. */
function irPrincipal() { ver('principal'); cargarPrincipal(); }

// ---------------------------------------------------------------- Principal (dashboard)
// Réplica literal de la hoja del PDF "Ventas diarias" que arma la notebook todas las
// noches. Se dibuja con los mismos datos del panel que usa "Resumen de vta", pero
// mostrando sólo lo que está en el PDF: nada agregado, nada reordenado.
function cargarPrincipal() {
  if (!PANEL) {
    try {
      var g = localStorage.getItem('panel_' + ((DATA.usuario && DATA.usuario.email) || ''));
      if (g) PANEL = JSON.parse(g);
    } catch (e) { /* sin guardado: se espera al servidor */ }
  }
  if (PANEL) pintarPrincipal(true);
  else $('vPrincipal').innerHTML = '<div class="vacio">Buscando el informe…</div>';
  api('panel').then(function (d) {
    if (!d.panel) {
      if (!PANEL) $('vPrincipal').innerHTML = '<div class="vacio">El informe todavía no se armó. ' +
        'En la planilla: Robot 3C › Rearmar el panel del informe diario.</div>';
      return;
    }
    PANEL = d.panel;
    guardarLocal('panel_', PANEL);
    pintarPrincipal();
  }).catch(function (e) {
    if (!PANEL) $('vPrincipal').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

/** Principal = la réplica literal del PDF "Ventas diarias": las mismas cinco piezas de la
 *  hoja (encabezado, total general, los dos acumulados, lo de ayer y el total cobrado) y
 *  nada más. Los cortes por sucursal, canales y cobros no están en el PDF, así que no van
 *  acá: siguen enteros en Tablero › Resumen de vta, que se dibuja con pintarPanel(). */
function pintarPrincipal(guardado) {
  var p = PANEL;
  if (!p) { $('vPrincipal').innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  var dia = (p.al || '').split(' ')[0];
  var rango = sinAnio(p.periodo).replace(' al ', '–');
  var ayerMay = (p.ayer.general || 0) - (p.ayer.minorista || 0);
  var h = '<div class="repl">';

  // ---- encabezado: las tres líneas de arriba del PDF, sin chapitas ni texto extra
  h += '<div class="masthead"><div>' +
    '<p class="eyebrow">Informe diario de ventas</p>' +
    '<h1>Ventas del ' + esc(enLetras(p.fecha)) + '</h1>' +
    '<p class="sub">Acumulado ' + esc(rango) + ' vs. mismo período ' +
      esc(anioDe(p.periodoAnt)) + '</p></div></div>';

  // ---- total general acumulado (el recuadro azul)
  h += '<div class="kpi-hero"><div>' +
    '<p class="label">Total general acumulado</p>' +
    '<div class="value num">' + pesos(p.general.a) + '</div>' +
    '<div class="delta ' + (p.general.a >= p.general.b ? 'up' : 'down') + '">' +
      flecha(p.general.a, p.general.b) + ' <span class="prev">vs ' + pesos(p.general.b) +
      '</span></div></div></div>';

  // ---- minorista y mayorista acumulados, uno al lado del otro
  function acum(lab, x) {
    var ok = x.a >= x.b;
    return '<div class="pdf-card"><div class="label">' + lab + '</div>' +
      '<div class="value num">' + pesos(x.a) + '</div>' +
      '<div class="delta ' + (ok ? 'up' : 'down') + '">' +
      (x.b ? (ok ? '+' : '') + pc(x.a, x.b) + '% <span class="prev">vs ' + pesos(x.b) + '</span>'
           : '<span class="prev">Sin dato ' + esc(anioDe(p.periodoAnt)) + '</span>') +
      '</div></div>';
  }
  h += '<div class="pdf-duo">' + acum('Minorista acum.', p.minorista) +
       acum('Mayorista acum.', p.mayorista) + '</div>';

  // ---- ventas de ayer
  h += '<div class="pdf-card pdf-ayer"><h2>Ventas de ayer</h2>' +
    '<div class="fecha">' + esc(p.fecha) + '</div>' +
    '<div class="pdf-row"><span class="name">Minorista</span><b class="num">' +
      pesos(p.ayer.minorista || 0) + '</b></div>' +
    '<div class="pdf-row"><span class="name">Mayorista</span><b class="num">' +
      pesos(ayerMay) + '</b></div>' +
    '<div class="pdf-row tot"><span class="name">Total general</span><b class="num">' +
      pesos(p.ayer.general || 0) + '</b></div></div>';

  // ---- total cobrado del día
  if (p.cobros && p.cobros.total) {
    h += '<div class="pdf-card pdf-cob"><span class="name">Total cobrado del día ' +
      '(Min. + May.)</span><b class="num">' + pesos(p.cobros.total) + '</b></div>';
  }

  h += '<div class="pie"><span>Fuente: exports del sistema de gestión, procesados y congelados el ' +
    esc(dia) + ' · hoja "' + esc(String(p.fecha || '').replace(/\//g, '-')) +
    '" del Informe de Ventas.</span></div></div>';

  $('vPrincipal').innerHTML = barraSello('principal', p.al, false, "rearmarAhora('dia')") +
    avisoAtraso(p.fecha) +
    (guardado ? '<div class="ped-sub" style="margin:-4px 0 10px">Mostrando lo último que viste · ' +
      'buscando novedades…</div>' : '') + h;
}


/* "Tableros" no lleva a ninguna pantalla: abre y cierra sus categorías. Es el criterio que
   fijó Ana el 24/11/2026: todo tablero nuevo entra en una categoría, y las categorías se
   despliegan acá. Así la lista no crece a lo ancho (la barra de pestañas se quedaba corta)
   sino a lo largo, que es donde hay lugar. */
function desplegarTableros(abrir) {
  var b = $('tTableroMas'), c = $('subTableros');
  if (!b || !c) return;
  var queda = abrir === undefined ? c.hidden : !!abrir;
  c.hidden = !queda;
  b.classList.toggle('abierto', queda);
}

/** Pinta la puerta por la que se entró. */
function marcarTablero() {
  var dentro = !$('vTablero').hidden;
  GRUPOS_TAB.forEach(function (g) {
    var b = $(g.boton);
    if (b) b.className = (dentro && TAB_GRUPO === g.clave) ? 'act' : '';
  });
  // En el cajón se marca la categoría, no "Tableros": es la que dice dónde estás parado.
  var enPrincipal = !$('vPrincipal').hidden;
  GRUPOS_TAB.forEach(function (g) {
    var sb = $(g.sub);
    if (sb) sb.className = 'sub' + ((dentro && TAB_GRUPO === g.clave) ? ' act' : '');
  });
  var sp = $('sPrincipal');
  if (sp) sp.className = 'sub' + (enPrincipal ? ' act' : '');
  var m = $('tTableroMas');
  if (m) m.className = '';
  if (dentro || enPrincipal) desplegarTableros(true);
}

function ver(v) {
  cerrarCajon();
  for (var k in VISTAS) {
    // con red: si alguna vez falta un id, se pierde el marcado de ese botón pero no se
    // cae la navegación entera por un TypeError
    var sec = $(VISTAS[k][0]), bot = $(VISTAS[k][1]);
    if (sec) sec.hidden = k !== v;
    if (bot) bot.className = k === v ? 'act' : '';
  }
  marcarTablero();
  if (v === 'auto') cargarAutomaticos();
  if (v === 'tablero') cargarTablero();
  if (v === 'preguntar') { pintarPreguntas(); cargarPreguntas(); }
  if (v === 'usuarios') cargarUsuarios();
  if (v === 'actividad') cargarActividad();
  if (v === 'import' && window.IMP) IMP.abrir();
  alPrincipio();
}

// ---------------------------------------------------------------- automáticos
function fechaCorta(ms) {
  var d = new Date(ms);
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' · ' +
         d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function claveAutos() {
  return 'autos_' + ((DATA.usuario && DATA.usuario.email) || '');
}
function cargarAutomaticos() {
  if (TAB_AUTO === 'horarios' && DATA.hay_tareas) return cargarTareas();
  if (TAB_AUTO === 'buscar') return pintarBuscar();
  // Pedirle la lista al servidor tarda (recorre las carpetas de Drive). Mientras tanto se
  // muestra lo último que se vio, guardado en el celular, y cuando llega lo nuevo se
  // repinta. Así la pantalla abre al toque en vez de quedar en blanco. (03/11/2026)
  if (!AUTOS) {
    try {
      var g = localStorage.getItem(claveAutos());
      if (g) AUTOS = JSON.parse(g);
    } catch (e) { /* sin guardado: se espera al servidor */ }
  }
  if (AUTOS && AUTOS.length) pintarAutomaticos(true);
  else $('vAuto').innerHTML = '<div class="vacio">Buscando lo último…</div>';
  api('automaticos').then(function (d) {
    AUTOS = d.informes;
    try { localStorage.setItem(claveAutos(), JSON.stringify(AUTOS)); } catch (e) { /* no es grave */ }
    if (TAB_AUTO === 'informes') pintarAutomaticos();   // si ya pasó a Buscar, no la pisa
  }).catch(function (e) {
    if (TAB_AUTO !== 'informes') return;
    if (!(AUTOS && AUTOS.length)) {
      $('vAuto').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>';
    }
  });
}

// ---------------------------------------------------------------- horarios (admin)
// Las tareas programadas de Windows que generan los informes. La lista la manda la
// notebook al arrancar y cada 30 minutos; acá solo se dibuja. Cambiar una hora es un
// pedido más de la cola: la notebook es la única que puede tocar el Programador de
// tareas. Los nombres de las tareas tienen la hora adentro ("0700", "00hs") y quedan
// desactualizados, así que se muestra el nombre lindo y la hora real de Windows.
var TAREAS = null;

function claveTareas() { return 'tareas_' + ((DATA.usuario && DATA.usuario.email) || ''); }

function tabsAuto() {

// ---------------------------------------------------------------- buscar (25/11/2026)
// Los informes automáticos de un día, aunque ya no estén entre los últimos de la lista.
// Se elige el informe (o todos) y la fecha; el servidor busca en la carpeta de cada uno.
var BUSQ = { clave: '', fecha: '', res: null, cargando: false };

function pintarBuscar() {
  if (!AUTOS) {
    try { var g = localStorage.getItem(claveAutos()); if (g) AUTOS = JSON.parse(g); } catch (e) { /* sigue */ }
  }

    api('automaticos').then(function (d) {

    }).catch(function (e) { $('vAuto').innerHTML = tabsAuto() + '<div class="vacio">' + esc(e.message || e) + '</div>'; });

    '<span class="chip" onclick="bqDia(2)">Anteayer</span><span class="chip" onclick="bqDia(7)">Hace una semana</span>' +
    '<span class="chip" onclick="bqDia(30)">Hace un mes</span></div>' +
    '<button class="btn" id="bqBtn" style="width:100%;margin-top:12px" onclick="buscarAutos()">' +
    (BUSQ.cargando ? 'Buscando…' : 'Buscar') + '</button></div>' +
    '<div id="bqRes">' + resultadosBuscar() + '</div>';
  if (BUSQ.cargando) $('bqBtn').disabled = true;
}

function bqDia(n) {
  BUSQ.fecha = iso(new Date(Date.now() - n * 86400000));
  var f = $('bqFecha'); if (f) f.value = BUSQ.fecha;
}

function fechaLarga(ymd) {
  var p = String(ymd || '').split('-');
  if (p.length !== 3) return ymd;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function resultadosBuscar() {
  var r = BUSQ.res;
  if (!r) return '<div class="ped-sub" style="padding:4px 2px">Elegí el informe y la fecha, y tocá Buscar.</div>';
  var con = r.informes.filter(function (a) { return a.archivos.length; });
  var cab = '<div class="ped-sub" style="margin:4px 2px 10px">Informes del ' + esc(fechaLarga(r.fecha)) + '</div>';
  if (!con.length) {
    return cab + '<div class="vacio">No encontré informes de ese día ni de los 7 días de alrededor.</div>';
  }
  var sin = r.informes.filter(function (a) { return !a.archivos.length; }).map(function (a) { return a.nombre; });
  return cab + con.map(function (a) {
    var nota = a.cercanos ? '<div class="ped-sub" style="margin:2px 0 6px">De ese día no hay; el más cercano es del ' +
      esc(fechaLarga(a.archivos[0].dia)) + '.</div>' : '';
    var arch = a.archivos.map(function (f) {
      return '<button class="btn sec arch" onclick="bajarAuto(\'' + esc(a.clave) + '\',\'' +
        esc(f.fid) + '\',this)"><span class="arch-nom">' + esc(f.titulo || f.nombre) + '</span>' +
        '<span class="arch-fecha">' + esc(fechaCorta(f.fecha)) + '</span></button>';
    }).join('');
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' +
      esc(a.dibujo || '📄') + ' ' + esc(a.nombre) + '</span>' +
      (a.cercanos ? '<span class="badge b-pendiente">Cercano</span>' : '') + '</div>' + nota + arch + '</div>';
  }).join('') + (sin.length && r.informes.length > 1 ?
    '<div class="ped-sub" style="margin:6px 2px">Sin nada en esas fechas: ' + esc(sin.join(' · ')) + '</div>' : '');
}

function buscarAutos() {
  var f = $('bqFecha'), s = $('bqInf');
  if (f) BUSQ.fecha = f.value;
  if (s) BUSQ.clave = s.value;
  if (!BUSQ.fecha) { toast('Elegí una fecha.'); return; }

function verAuto(v) { TAB_AUTO = v; cargarAutomaticos(); alPrincipio(); }

function cargarTareas() {

    if (!TAREAS) $('vAuto').innerHTML = tabsAuto() + '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

/** Lo que devuelve Windows en LastTaskResult, en castellano. */
function resultadoTarea(r) {
  if (r === 0) return ['b-listo', 'Terminó bien'];
  if (r === 267009) return ['b-generando', 'Corriendo ahora'];
  if (r === 267011) return ['b-pendiente', 'Todavía no corrió'];
  if (r === 267014) return ['b-cancelado', 'Se canceló'];
  if (r === null || r === undefined) return ['', ''];
  return ['b-error', 'Terminó con error (' + r + ')'];
}

/** "Todos los días a las 03:00", "El día 1 de cada mes a las 01:00", etc. */
function cuandoCorre(t) {
  if (t.tipo === 'al_iniciar') return 'Cada vez que se inicia sesión en la notebook';
  if (t.tipo === 'al_prender') return 'Cada vez que se enciende la notebook';
  if (!t.hora) return 'Sin hora fija';
  if (t.tipo === 'diaria') {
    return (t.intervalo > 1 ? 'Cada ' + t.intervalo + ' días' : 'Todos los días') + ' a las ' + t.hora;
  }
  if (t.tipo === 'mensual') {
    var d = (t.dias || []).join(', ');
    return (d ? 'El día ' + d + ' de cada mes' : 'Una vez por mes') + ' a las ' + t.hora;
  }
  if (t.tipo === 'semanal') {
    return 'Los ' + (t.dias || []).join(', ') + ' a las ' + t.hora;
  }
  return 'A las ' + t.hora;
}

function proximaLinda(txt) {
  if (!txt) return '';
  var p = txt.split(' ');                       // "2026-11-14 00:00:00"
  if (p.length < 2) return txt;
  var f = p[0].split('-'), hhmm = p[1].slice(0, 5);
  var d = new Date(+f[0], +f[1] - 1, +f[2]);
  var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  var dias = Math.round((d - hoy) / 86400000);
  if (dias === 0) return 'hoy a las ' + hhmm;
  if (dias === 1) return 'mañana a las ' + hhmm;
  return f[2] + '/' + f[1] + ' a las ' + hhmm;
}

/**
 * Avisa cuando dos tareas diarias arrancan muy cerca. No es un error: el robot tiene un
 * candado y la segunda espera su turno. Pero conviene saberlo antes de apretar algo.
 */
function avisoJuntas(lista) {
  var conHora = lista.filter(function (t) { return t.tipo === 'diaria' && t.hora; })
                     .sort(function (a, b) { return a.hora < b.hora ? -1 : 1; });
  var pares = [];
  for (var i = 1; i < conHora.length; i++) {
    var m = function (h) { return +h.slice(0, 2) * 60 + +h.slice(3, 5); };
    if (m(conHora[i].hora) - m(conHora[i - 1].hora) <= 30) {
      pares.push((conHora[i - 1].lindo || conHora[i - 1].nombre) + ' y ' +
                 (conHora[i].lindo || conHora[i].nombre));
    }
  }
  if (!pares.length) return '';
  return '<div class="ped-sub" style="margin:-2px 0 12px">' + esc(pares.join(' · ')) +
         ' arrancan con menos de media hora de diferencia. No se pisan: el robot atiende ' +
         'de a uno y la segunda espera, pero puede salir más tarde de lo previsto.</div>';
}

function pintarTareas(guardado) {
  var d = TAREAS || {}, lista = d.tareas || [];
  if (!lista.length) {
    $('vAuto').innerHTML = tabsAuto() + '<div class="vacio">La notebook todavía no mandó la lista ' +
      'de procesos. Aparece cuando el robot se conecta.</div>';
    return;
  }
  var cab = '';
  if (guardado) cab = '<div class="ped-sub" style="margin:-4px 0 10px">Mostrando lo último que viste…</div>';
  else if (d.vieja) cab = '<div class="ped-sub" style="margin:-4px 0 10px">Leído el ' +
    esc(fechaCorta(d.hecho)) + '. La notebook hace rato que no se conecta, así que estos ' +
    'horarios pueden no ser los de ahora.</div>';
  else if (d.hecho) cab = '<div class="ped-sub" style="margin:-4px 0 10px">Leído de la notebook el ' +
    esc(fechaCorta(d.hecho)) + '.</div>';

  $('vAuto').innerHTML = tabsAuto() + cab + avisoJuntas(lista) + lista.map(function (t) {
    var res = resultadoTarea(t.resultado);
    var marca = res[1] ? '<span class="badge ' + res[0] + '">' + esc(res[1]) + '</span>' : '';
    var filas = '<div class="ped-sub">' + esc(cuandoCorre(t)) + '</div>';
    if (t.proxima) filas += '<div class="ped-sub">Próxima vez: ' + esc(proximaLinda(t.proxima)) + '</div>';
    if (t.ultima) filas += '<div class="ped-sub">Última vez: ' + esc(proximaLinda(t.ultima)) + '</div>';
    var boton = t.editable
      ? '<div class="ped-acc"><button class="btn sec" onclick="editarHora(\'' +
        esc(t.nombre).replace(/'/g, '&#39;') + '\')">Cambiar la hora</button></div>'
      : '';
    return '<div class="pedido">' +
             '<div class="ped-top"><span class="ped-nom">' +
               esc(t.lindo || t.nombre.replace(/^Robot 3C - /, '')) + '</span>' + marca + '</div>' +
             filas +
             '<div class="ped-sub" style="opacity:.55">' + esc(t.nombre) + '</div>' +
             boton +
           '</div>';
  }).join('');
}

function editarHora(nombre) {
  var t = ((TAREAS || {}).tareas || []).filter(function (x) { return x.nombre === nombre; })[0];
  if (!t) return;
  var aviso = t.historial === false
    ? '<div class="ped-sub" style="margin-top:10px">Windows no deja cambiarle la hora a una tarea ' +
      'mensual sin volver a crearla, así que el historial de corridas va a arrancar de cero. ' +
      'La programación (día del mes) no se toca.</div>'
    : '';
  $('hoja').innerHTML =
    '<h2>' + esc(t.lindo || t.nombre) + '</h2>' +
    '<div class="ped-sub">' + esc(cuandoCorre(t)) + '</div>' +
    '<div class="sub">Nueva hora</div>' +
    '<input id="horaNueva" type="time" value="' + esc(t.hora || '') + '" ' +
      'style="font-size:1.4rem;padding:10px;width:100%;box-sizing:border-box">' +
    aviso +
    '<div class="acciones" style="margin-top:18px">' +
      '<button class="btn" onclick="guardarHora(\'' + esc(nombre).replace(/'/g, '&#39;') + '\',this)">Cambiar</button>' +
      '<button class="btn sec" onclick="cerrarHoja()">Cancelar</button>' +
    '</div>';
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
}

function guardarHora(nombre, boton) {
  var hora = ($('horaNueva') || {}).value || '';
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(hora)) { toast('Poné una hora válida.'); return; }
  boton.disabled = true; boton.textContent = 'Mandando…';
  api('horario', { tarea: nombre, hora: hora }).then(function () {
    cerrarHoja();
    toast('Pedido mandado. La notebook lo aplica en unos segundos.');
    setTimeout(function () { TAREAS = null; if (TAB_AUTO === 'horarios') cargarTareas(); }, 12000);
  }).catch(function (e) {
    boton.disabled = false; boton.textContent = 'Cambiar';
    toast(e.message || 'No pude mandar el cambio.');
  });
}

// ---------------------------------------------------------------- tablero de ventas
// Los números salen de tablero_ventas.json, que el servidor rearma todas las noches del
// libro "Vtas diarias por local por mes". Acá no se pide nada a 3C: solo se dibuja.
var TAB = null, TAB_MES = -1, TAB_LOCAL = -1;   // -1 en local = todos los locales juntos
var PANEL = null, TAB_VISTA = 'hoy';           // arranca en 'hoy' (ventas de hoy); 'dia' = ayer, 'proy', 'mes'
/** Qué tableros muestra el atajo "Tablero" de abajo. Está al revés a propósito: en vez de
 *  nombrar los rápidos, se nombran los dos que NO lo son. Así, cuando se agrega un tablero
 *  nuevo, aparece solo en el acceso directo y no hay que acordarse de anotarlo acá.
 *  Proyección y Por local se consultan de vez en cuando: siguen en "Más tableros". */
/** Los grupos del acceso directo de abajo: un botón cada uno, con sus sub-pestañas.
 *  Un tablero que no figure en ningún grupo cae en "Más tableros", el del cajón, que es
 *  el cajón de sastre de lo que se mira de vez en cuando (hoy, Proyección y Por local).
 *  Para que un tablero nuevo aparezca abajo hay que agregarlo al grupo que corresponda:
 *  no se puede adivinar si es de ventas o de finanzas. */
var GRUPOS_TAB = [
  { clave: 'ventas',   boton: 'tVentas',   sub: 'sVentas',   vistas: ['hoy', 'dia', 'proy', 'mes'] },
  { clave: 'finanzas', boton: 'tFinanzas', sub: 'sFinanzas', vistas: ['bancos', 'mp', 'cheques', 'emitidos'] },
  { clave: 'ctacte',   boton: 'tCtaCte',   sub: 'sCtaCte',   vistas: ['clientes', 'proveedores'] }
];
var TAB_GRUPO = 'ventas';            // por qué puerta se entró: 'ventas', 'finanzas' o 'mas'

function grupoDe(v) {
  for (var i = 0; i < GRUPOS_TAB.length; i++) {
    if (GRUPOS_TAB[i].vistas.indexOf(v) >= 0) return GRUPOS_TAB[i].clave;
  }
  return 'mas';
}
/** Las vistas de un grupo; null para 'mas', que es "todo lo que no está en un grupo". */
function vistasDelGrupo(g) {
  for (var i = 0; i < GRUPOS_TAB.length; i++) {
    if (GRUPOS_TAB[i].clave === g) return GRUPOS_TAB[i].vistas;
  }
  return null;
}

function guita(n) {
  var s = Math.round(Math.abs(n)).toString();
  var o = '';
  for (var i = 0; i < s.length; i++) {
    o += s.charAt(i);
    var faltan = s.length - 1 - i;
    if (faltan > 0 && faltan % 3 === 0) o += '.';
  }
  return (n < 0 ? '-$' : '$') + o;
}
function corta(n) {                      // $12,3 M — para que entre en el celular
  var a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(1).replace('.', ',') + ' M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + ' k';
  return guita(n);
}
function porc(a, b) { return b ? (a / b - 1) * 100 : 0; }
function signo(p) { return (p >= 0 ? '+' : '') + p.toFixed(1).replace('.', ',') + '%'; }
// Si el año anterior es 0 (un local que todavía no existía, o que estuvo cerrado todo el
// período) no hay nada contra qué comparar: un "+0,0%" verde ahí miente.
function dif(a, b) { return b ? signo(porc(a, b)) : (a ? 'nuevo' : '—'); }
function claseDif(a, b) { return !b ? '' : (a >= b ? 'sube' : 'baja'); }

function verVista(v) { TAB_VISTA = v; cargarTablero(); marcarTablero(); alPrincipio(); }

function guardarLocal(prefijo, obj) {
  try {
    localStorage.setItem(prefijo + ((DATA.usuario && DATA.usuario.email) || ''), JSON.stringify(obj));
  } catch (e) { /* no es grave */ }
}

/** Rehace el tablero en el momento, sin esperar a que lo haga solo. Sirve cuando el
 *  informe llegó tarde (04/11/2026: el Excel apareció recién a las 06:38). */
function rearmarAhora(cual) {
  // Antes salía de la pestaña; ahora lo dice quien llama, porque Principal también lo usa
  // y no es una pestaña del tablero.
  cual = cual || (TAB_VISTA === 'dia' ? 'dia' : 'proy');
  var b = $('bRearmar') || { };
  api('rearmar', { cual: cual }).then(function (d) {
    if (cual === 'dia' && d.panel) {
      PANEL = d.panel; guardarLocal('panel_', PANEL); pintarPanel(); toast('Tablero al día');
    } else if (cual === 'proy' && d.tablero) {
      TAB = d.tablero; TAB_MES = -1; TAB_VIG = TAB.pct; guardarLocal('tablero_', TAB); pintarTablero();
      toast('Tablero al día');
    } else {
      b.disabled = false; b.textContent = '↻ Buscar el informe nuevo';
      toast('No encontré un informe nuevo');
    }
  }).catch(function (e) {
    b.disabled = false; b.textContent = '↻ Buscar el informe nuevo';
    toast(e.message || e);
  });
}

var VISTAS_TAB = [['hoy', 'Hoy'], ['dia', 'Resumen de vta'], ['proy', 'Proyección'], ['mes', 'Por local'],
                  ['bancos', 'Bancos'], ['mp', 'MP'], ['cheques', 'Cheques a ingresar'],
                  ['emitidos', 'Cheques emitidos'],
                  ['clientes', 'Clientes'], ['proveedores', 'Proveedores']];
/** Los tableros que esta persona puede ver (los decide el servidor; un servidor viejo no manda la lista). */
/** Las sub-pestañas que le tocan a esta persona Y entran por la puerta que usó: Ventas
 *  muestra Hoy y Resumen de vta; Finanzas, Bancos, MP y los dos de cheques; "Tableros"
 *  (el del cajón), todos. */
function vistasMias() {
  var ok = (DATA && DATA.tableros) || VISTAS_TAB.map(function (v) { return v[0]; });
  var tiene = VISTAS_TAB.filter(function (v) { return ok.indexOf(v[0]) >= 0; });
  var del = vistasDelGrupo(TAB_GRUPO);
  // "Tableros", la entrada del cajón, ya no es "lo que sobra": muestra TODOS los tableros
  // que tenga la persona (pedido de Ana, 23/11/2026). Las puertas de abajo —Ventas,
  // Finanzas, Cta Cte— siguen siendo atajos a su propio subconjunto.
  var mias = del ? tiene.filter(function (v) { return del.indexOf(v[0]) >= 0; }) : tiene;
  // si por esa puerta no le toca ninguna, se le muestran las que tenga: mejor eso que
  // una pantalla sin ninguna pestaña
  return mias.length ? mias : tiene;
}
/* La activa puede quedar fuera de la parte visible de la fila (con diez tableros pasa
   seguido). Esto la trae a la vista. Se agenda acá y no en cada lugar que dibuja, porque
   todos llaman a tabsVista() justo antes de escribir el HTML: para cuando corre el cuadro
   siguiente, la fila ya está en pantalla. */
function verLaActiva() {
  requestAnimationFrame(function () {
    var f = document.querySelector('.cual-tab'), b = f && f.querySelector('button.act');
    if (!b) return;
    var izq = b.offsetLeft - (f.clientWidth - b.offsetWidth) / 2;
    f.scrollTo({ left: Math.max(0, izq), behavior: 'smooth' });
  });
}

function tabsVista() {
  var mias = vistasMias();
  if (mias.length < 2) return '';
  verLaActiva();
  return '<div class="cual-tab">' + mias.map(function (v) {
    return '<button class="' + (TAB_VISTA === v[0] ? 'act' : '') + '" onclick="verVista(\'' + v[0] + '\')">' +
           v[1] + '</button>';
  }).join('') + '</div>';
}

function cargarPanel() {
  if (!PANEL) {
    try {
      var g = localStorage.getItem('panel_' + ((DATA.usuario && DATA.usuario.email) || ''));
      if (g) PANEL = JSON.parse(g);
    } catch (e) { /* sin guardado */ }
  }
  if (PANEL) pintarPanel(true);
  else $('vTablero').innerHTML = tabsVista() + '<div class="vacio">Buscando el informe…</div>';
  api('panel').then(function (d) {
    if (!d.panel) {
      if (!PANEL) $('vTablero').innerHTML = tabsVista() + '<div class="vacio">El panel todavía no se armó. ' +
        'En la planilla: Robot 3C › Rearmar el panel del informe diario.</div>';
      return;
    }
    PANEL = d.panel;
    guardarLocal('panel_', PANEL);
    if (TAB_VISTA === 'dia') pintarPanel();
  }).catch(function (e) {
    if (!PANEL) $('vTablero').innerHTML = tabsVista() + '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

/** Réplica de la primera hoja del "Resumen de ventas mensual", con el mismo armado
 *  y los mismos textos que el PDF que genera el informe diario. */
var MESES_NOMBRE = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                    'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
/* "$ 8.190.890", como en el informe. El espacio entre el signo y el número es un espacio
   duro ( ): con el espacio común, en una celda angosta el renglón se cortaba ahí y el
   "$" quedaba solo arriba del número. Pasaba en las dos tablas y también en las tarjetas. */
function pesos(n) {
  var s = Math.round(Math.abs(n)).toString(), o = '';
  for (var i = 0; i < s.length; i++) {
    o += s.charAt(i);
    var f = s.length - 1 - i;
    if (f > 0 && f % 3 === 0) o += '.';
  }
  return (n < 0 ? '-$ ' : '$ ') + o;
}
function pc(a, b) { return ((a / b - 1) * 100).toFixed(1).replace('.', ','); }
function flecha(a, b) { return (a >= b ? '▲ +' : '▼ ') + pc(a, b) + '%'; }
function enLetras(f) {                      // "02/11/2026" -> "2 de noviembre de 2026"
  var m = String(f || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? Number(m[1]) + ' de ' + MESES_NOMBRE[Number(m[2]) - 1] + ' de ' + m[3] : (f || '');
}
function sinAnio(r) { return String(r || '').replace(/\/\d{4} al /, ' al '); }
function anioDe(r) { var m = String(r || '').match(/(\d{4})\s*$/); return m ? m[1] : ''; }

/** Si el informe que estamos mostrando no es el de ayer, decirlo: es la diferencia entre
 *  mirar un número viejo sin darse cuenta y saber que todavía no llegó. */
function avisoAtraso(fechaTxt) {
  var m = String(fechaTxt || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return '';
  var dato = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  var ayer = new Date();
  ayer.setHours(0, 0, 0, 0);
  ayer.setDate(ayer.getDate() - 1);
  var dias = Math.round((ayer - dato) / 86400000);
  if (dias <= 0) return '';
  return '<div class="atrasado">Este informe es del ' + esc(fechaTxt) + '. Todavía no llegó el de ' +
    (dias === 1 ? 'ayer' : 'los últimos ' + dias + ' días') +
    ': el proceso de la notebook puede estar demorado.</div>';
}

function pintarPanel(guardado, donde) {

  var dia = (p.al || '').split(' ')[0];
  var h = '<div class="repl">';

  h += '<div class="r-kpis">' +
