        p.minorista.a >= p.minorista.b ? 'up' : 'down') +
    kpi('Total mayorista acumulado', pesos(p.mayorista.a),
        p.mayorista.b ? flecha(p.mayorista.a, p.mayorista.b) + ' <span class="prev">vs ' +
          pesos(p.mayorista.b) + '</span>' : 'Sin dato ' + anioDe(p.periodoAnt),
        p.mayorista.a >= p.mayorista.b ? 'up' : 'down') +
    kpi('Ventas de ayer (minorista)', pesos(p.ayer.minorista || 0), esc(p.fecha), 'up') +
    kpi('Ventas de ayer (mayorista)', pesos(ayerMay), esc(p.fecha), 'up') +
    '</div>';

  // ---- ventas por sucursal
  var suc = p.sucursales.slice().sort(function (x, y) { return y.a - x.a; });
  var tope = 0;

  var filas = suc.map(function (s) {

        '<div class="bar-track"><div class="bar-fill s1" style="width:' +
          (tope ? (100 * s.a / tope).toFixed(1) : 0) + '%"></div></div>' +
        '<div class="bar-track"><div class="bar-fill s2" style="width:' +
          (tope ? (100 * s.b / tope).toFixed(1) : 0) + '%"></div></div>' +

  }).join('');
  var aAnio = anioDe(p.periodo), bAnio = anioDe(p.periodoAnt);
  h += '<section><div class="section-head"><h2>Ventas por sucursal — acumulado del mes</h2>' +

    (p.minorista.a >= p.minorista.b ? '+' : '') + pc(p.minorista.a, p.minorista.b) +

  // ---- mayorista y canales
  var canales = p.canales.map(function (c) {
    // "Sin dato 2025" en la columna de variación le fijaba el ancho a toda la columna y

    var v = !c.b ? '<td class="new" title="Sin dato de ' + bAnio + '">—</td>'

  h += '<section><div class="section-head"><h2>Mayorista y canales — acumulado del mes</h2>' +
    '<span class="note">vs. mismo período ' + bAnio + '</span></div>' +
    '<div class="tabla-ancha"><table class="plain">' +
    '<thead><tr><th>Canal</th><th>' + aAnio + '</th><th>' + bAnio +
    '</th><th>Var.</th></tr></thead><tbody>' + canales +
    '<tr class="total"><td class="name">Total mayorista</td><td class="num">' + pesos(p.mayorista.a) +
      '</td><td class="num">' + pesos(p.mayorista.b) + '</td><td class="num">' +
      (p.mayorista.b ? (p.mayorista.a >= p.mayorista.b ? '+' : '') + pc(p.mayorista.a, p.mayorista.b) + '%' : '—') +
      '</td></tr>' +
    '<tr class="extra"><td class="name">Total cobrado mayorista</td><td class="num">' +
      pesos(p.mayorista.cobrado || 0) + '</td><td></td><td></td></tr>' +
    '<tr class="extra"><td class="name">Diferencia (cobrado − facturado)</td>' +
      '<td class="num ' + ((p.mayorista.dif || 0) < 0 ? 'diff-neg' : 'diff-pos') + '">' +
      pesos(p.mayorista.dif || 0) + '</td><td></td><td></td></tr>' +
    '</tbody></table></div></section>';

  // ---- cobros de ayer

      }).join('') + '</div></div>';

  if (c.total) {
    h += '<section><div class="section-head"><h2>Cobros de ayer</h2>' +
      '<span class="note">' + esc(p.fecha) + '</span></div>' +
      mezcla('Minorista', c.minorista) + mezcla('Mayorista', c.mayorista) +

  // ---- ventas de ayer por sucursal
  if (p.ayer.sucursales && p.ayer.sucursales.length) {

        return '<tr><td class="name">' + esc(s.n) + '</td>' +
          '<td class="num">' + pesos(s.v) + '</td>' +

    h += '<section><div class="section-head"><h2>Ventas de ayer por sucursal</h2>' +
      '<span class="note">' + esc(p.fecha) + ' · minorista · importes en $ · caja: ' +

      '</th><th>Art. mes</th><th>Ticket prom.</th><th>Caja</th>' +
      '</tr></thead><tbody>' + fa +
      '<tr class="total"><td class="name">Total minorista</td><td class="num">' +
      pesos(p.ayer.minorista || 0) + '</td><td></td><td></td><td></td></tr>' +
      '</tbody></table></div></section>';
  }

  h += '<div class="pie"><span>Fuente: exports del sistema de gestión, procesados y congelados el ' +
    esc(dia) + ' · hoja "' + esc(String(p.fecha || '').replace(/\//g, '-')) +

  $(sec).innerHTML = tabs + barraSello('dia', p.al, false, "rearmarAhora('dia')") +
    avisoAtraso(p.fecha) +
    (guardado ? '<div class="ped-sub" style="margin:-4px 0 10px">Mostrando lo último que viste · ' +
      'buscando novedades…</div>' : '') + h;
  encajarTablas(sec);
}

/* Las tablas tienen que entrar enteras en el ancho que haya, y cuánto miden depende de la
   tipografía que terminó usando el aparato: con Archivo (la de la app) son más anchas que
   con la letra de respaldo. Por eso el tamaño no se puede calcular de antemano: se mide
   acá, en la pantalla de la persona, y se achica lo justo hasta que entre.
   Se vuelve a correr cuando termina de cargar la tipografía y al girar el teléfono. */
function encajarTablas(donde) {
  var sec = typeof donde === 'string' ? $(donde) : donde;
  if (!sec) return;
  var envs = sec.querySelectorAll('.tabla-ancha');
  for (var i = 0; i < envs.length; i++) {
    var env = envs[i], t = env.querySelector('table');
    if (!t) continue;
    t.style.fontSize = '';                                   // arrancar del tamaño del CSS
    var hay = env.clientWidth;
    if (!hay) {                     // la sección todavía no se ve: medir no sirve, se reintenta
      setTimeout(function (s) { return function () { encajarTablas(s); }; }(sec), 80);
      return;
    }
    var px = parseFloat(getComputedStyle(t).fontSize) || 11.5, piso = 8.5;
    if (t.scrollWidth <= hay) continue;                      // ya entra
    // primer tiro por regla de tres, y después unos pasos finos: el ancho no baja
    // proporcional al tamaño porque los espacios entre columnas son fijos
    px = Math.max(piso, px * hay / t.scrollWidth);
    t.style.fontSize = px.toFixed(2) + 'px';
    for (var v = 0; v < 8 && t.scrollWidth > hay && px > piso; v++) {
      px = Math.max(piso, px - 0.25);
      t.style.fontSize = px.toFixed(2) + 'px';
    }
  }
}

/** Reacomoda lo que esté a la vista: el tablero y la pantalla principal. */

function cargarTablero() {
  var mias = vistasMias().map(function (v) { return v[0]; });
  if (mias.length && mias.indexOf(TAB_VISTA) < 0) TAB_VISTA = mias[0];
  if (TAB_VISTA === 'dia') return cargarPanel();
  if (TAB_VISTA === 'mes') return cargarMes();
  if (TAB_VISTA === 'hoy') return cargarHoy();
  if (TAB_VISTA === 'bancos') return cargarBancos();
  if (TAB_VISTA === 'mp') return cargarMp();
  if (TAB_VISTA === 'cheques') return cargarCheques();
  if (TAB_VISTA === 'emitidos') return cargarTabEmitidos();
  if (TAB_VISTA === 'clientes') return cargarTabClientes();
  if (TAB_VISTA === 'proveedores') return cargarTabProveedores();

  }
  if (TAB) pintarTablero(true);
  else $('vTablero').innerHTML = '<div class="vacio">Buscando los números…</div>';
  api('tablero').then(function (d) {

  });

// ------------------------------------------------- los tableros que vienen en un iframe
/* Tres tableros (Hoy, Por local y Bancos) llegan como HTML armado por la notebook y se
   muestran en un iframe aislado. El iframe tenía alto fijo (una pantalla), y eso dejaba
   DOS zonas que scrollean, una adentro de la otra: en el celular el dedo movía la de
   adentro y la de afuera no se enteraba, así que a veces no se podía seguir bajando.

   Ahora el iframe se estira hasta el alto de su contenido y scrollea una sola cosa, la
   pantalla. El alto lo dice el propio contenido: se le agrega un script que se lo manda
   al padre con postMessage. Si ese mensaje no llega —script bloqueado, contenido raro—
   queda el alto fijo del CSS, que es como venía funcionando. */

// El medidor que se le agrega al HTML del tablero. Avisa al cargar, al cambiar de tamaño
// y dos veces más por si algo del contenido acomoda la página después.
/* Ojo con cómo se mide: documentElement.scrollHeight nunca baja del alto de la ventana del
   iframe, así que con un tablero corto devolvía "una pantalla" y quedaba un hueco abajo. Se
   mide el body y, por si el tablero usa html,body{height:100%}, también hasta dónde llega
   el último hijo. */
var MEDIDOR_ALTO =
  '<scr' + 'ipt>(function(){function m(){var d=document,b=d.body;if(!b)return;' +
  'var a=Math.max(b.scrollHeight,b.offsetHeight),y=(d.documentElement.scrollTop||b.scrollTop||0),i,r;' +
  'for(i=0;i<b.children.length;i++){r=b.children[i].getBoundingClientRect();' +
  'if(r.bottom+y>a)a=r.bottom+y;}' +
  'try{parent.postMessage({tablero:"alto",alto:Math.ceil(a)+8},"*");}catch(e){}}' +
  'if(document.readyState==="complete")m();else addEventListener("load",m);' +
  'addEventListener("resize",m);setTimeout(m,400);setTimeout(m,1500);})();</scr' + 'ipt>';

var IFRAMES_TAB = ['fMes', 'fBancos', 'fHoy', 'fMp', 'fCheques'];

/** Carga el HTML en el iframe con el medidor puesto. */
// Cuándo recibió el servidor cada tablero. Lo anota él, no la notebook: el campo "al" que
// manda cada tablero significa cosas distintas (en Bancos la fecha del informe, en Cheques el
// texto de los listados), así que no sirve para saber si lo que se está viendo es de hoy.
var PUBLICADO = {};
var CLAVE_DE_IFRAME = { fMes: 'mes', fBancos: 'bancos', fMp: 'mp', fCheques: 'cheques', fHoy: 'hoy' };

function _dmy(d) {
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
}

function selloTexto(pub) {
  if (!pub) return null;
  var p = String(pub).split(' '), dia = p[0] || '', hora = p[1] || '';
  var hoy = new Date(), ayer = new Date(hoy.getTime() - 86400000);
  if (dia === _dmy(hoy)) return { txt: 'Actualizado hoy ' + hora, viejo: false };
  // "Ayer" se muestra en tono normal a propósito: Cheques sale a la tarde y Bancos a media
  // mañana, así que a primera hora lo normal es tener el de ayer. Se avisa de dos días.
  if (dia === _dmy(ayer)) return { txt: 'Actualizado ayer ' + hora, viejo: false };
  return { txt: 'Actualizado el ' + dia + ' ' + hora, viejo: true };
}

/* El mismo sello, pero para las pantallas que se dibujan acá y no vienen en un iframe:
   Principal, Resumen de vta y Proyección. Criterio de Ana (24/11/2026): todos los tableros
   muestran cuándo se actualizaron, con el mismo cartel y en el mismo lugar, arriba a la
   izquierda. Las tres traen la fecha con hora en su campo "al". */
function selloHtml(pub) {
  var s = selloTexto(pub);
  return s ? '<div class="sello-tab' + (s.viejo ? ' viejo' : '') + '">' + esc(s.txt) + '</div>' : '';
}

function ponerSello(f, id) {
  var clave = CLAVE_DE_IFRAME[id] || (id.indexOf('fTab_') === 0 ? id.slice(5) : '');
  var s = selloTexto(PUBLICADO[clave]);
  if (!s) return;
  var div = document.createElement('div');
  div.className = 'sello-tab' + (s.viejo ? ' viejo' : '');
  div.textContent = s.txt;
  f.parentNode.insertBefore(div, f);
}

function meterTablero(id, html) {
  var f = $(id);
  if (!f) return;
  // El sello ya no va suelto arriba del iframe: ahora viaja en la barra, con el botón al
  // lado. ponerSello() queda para los tableros que todavía no tienen barra propia.
  if (!f.parentNode.querySelector('.hoy-barra')) ponerSello(f, id);
  f.style.height = ''; f.style.minHeight = '';   // hasta que el contenido diga el suyo, el del CSS
  f.srcdoc = html + MEDIDOR_ALTO;
}

/* El iframe va sin allow-same-origin, así que su origen es "null" y no sirve para
   identificarlo: se compara contra el contentWindow de los nuestros, que es lo que no se
   puede falsificar desde otra ventana. Del mensaje se usa un solo número, y acotado. */
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.tablero !== 'alto') return;
  for (var i = 0; i < IFRAMES_TAB.length; i++) {
    var f = $(IFRAMES_TAB[i]);
    if (f && e.source === f.contentWindow) {
      var alto = Number(d.alto) || 0;
      if (alto < 60 || alto > 30000) return;     // un alto absurdo no se toca
      f.style.height = alto + 'px';
      f.style.minHeight = '0';                   // si el contenido es corto, no dejar hueco
      return;
    }
  }
});

/* Clientes y Proveedores salen de las mismas fuentes que los botones del bot (la API de

   Como ya son cinco tableros iguales en todo salvo el nombre, estos dos van por una sola
   función en vez de repetir el bloque. Bancos, MP y Cheques podrían pasar por acá también;
   se dejaron como estaban para no tocar algo que ya anda. */
var HTML_TAB = {};        // clave -> { html, al } de lo último que se vio
var ESPERA_TAB = {};      // clave -> { html, desde, t } mientras se espera al robot

/* Tableros que llevan botón "Actualizar ahora" adentro. El de Cheques emitidos no se
   conforma con lo que ya está en Drive: baja un Libro Banco nuevo de 3C y rearma todo lo
   que sale de él, así que tarda varios minutos y la espera es larga a propósito. */
/* Un botón Actualizar igual en todos los tableros, arriba a la derecha y en el mismo
   renglón que el sello (criterio de Ana, 24/11/2026). Cada uno sigue haciendo lo suyo:
   acá solo se unifica cómo se ve y dónde está.

   pesado: hace trabajar al robot varios minutos (casi siempre entrando a 3C), así que pide
   el permiso "actualizar" que se asigna por persona en Usuarios. Los livianos rearman con
   lo que ya está en disco y los puede usar cualquiera que tenga el tablero.
   minutos: cuánto se espera antes de devolver el botón si no llega nada. */
var CON_BOTON = {
  bancos:      { pesado: true, espera: 'Bajando el Libro Banco y rearmando, tarda varios minutos', minutos: 25 },
  mp:          { pesado: true, espera: 'Bajando el Libro Banco y rearmando, tarda varios minutos', minutos: 25 },
  emitidos:    { pesado: true, espera: 'Bajando el Libro Banco y rearmando, tarda varios minutos', minutos: 25 },
  clientes:    { pesado: true, espera: 'Pidiéndole los saldos a 3C', minutos: 10 },
  proveedores: { pesado: true, espera: 'Bajando el Excel de Acreedores de 3C, tarda unos minutos', minutos: 20 },
  cheques:     { pesado: false, espera: 'Rearmando con el último PDF', minutos: 8 }
};

/** ¿Esta persona puede apretar el Actualizar de este tablero? */
function puedeActualizar(clave) {
  var c = CON_BOTON[clave];
  if (!c) return false;
  // El rol también vale: si la app se publica antes que el Code.gs nuevo, el servidor
  // todavía no manda puede_actualizar y el admin se quedaría sin botones.
  // El servidor manda puede_actualizar al lado de usuario, no adentro: se miran los dos.
  return !c.pesado || !!(DATA.puede_actualizar ||
    (DATA.usuario && (DATA.usuario.puede_actualizar || DATA.usuario.rol === 'admin')));
}

/** El renglón de arriba de todo tablero: cuándo se actualizó, a la izquierda; el botón, a
 *  la derecha. Se usa en los diez, para que estén todos iguales. */
function barraSello(clave, pub, enEspera, alToque) {
  var hay = clave && (CON_BOTON[clave] ? puedeActualizar(clave) : !!alToque);
  var c = CON_BOTON[clave] || {};
  var esRearmar = !!alToque && alToque.indexOf('rearmarAhora') === 0;
  var btn = !hay ? '' :
    '<button' + (esRearmar ? ' id="bRearmar"' : '') +
    ' onclick="' + (alToque || ("actualizarTab('" + clave + "')")) + '"' +
    (enEspera ? ' disabled' : '') + '>' +
    (enEspera ? 'Actualizando…' : 'Actualizar ahora') + '</button>';
  var izq = selloHtml(pub) || (enEspera && c.espera ? '<span>' + esc(c.espera) + '</span>' : '<span></span>');
  return (izq || btn) ? '<div class="hoy-barra">' + izq + btn + '</div>' : '';
}

function barraTablero(clave) {
  return barraSello(clave, (HTML_TAB[clave] || {}).pub || PUBLICADO[clave], !!ESPERA_TAB[clave]);
}

function actualizarTab(clave) {
  var c = CON_BOTON[clave];
  if (!c || ESPERA_TAB[clave]) return;
  api('actualizar_tablero', { cual: clave }).then(function (d) {
    if (d && d.pedidos) DATA.pedidos = d.pedidos;
    var e = ESPERA_TAB[clave] = { html: HTML_TAB[clave] ? HTML_TAB[clave].html : '', desde: Date.now() };
    e.t = setInterval(function () {
      // Corta sola: si a los N minutos no llegó, algo falló y el botón tiene que volver.
      if (Date.now() - e.desde > c.minutos * 60000) {
        terminarEsperaTab(clave);
        if (TAB_VISTA === clave) cargarTablero();
        return;
      }
      if (TAB_VISTA === clave) cargarTablero();
    }, 20000);
    if (TAB_VISTA === clave) cargarTablero();
  }).catch(function (e) { toast(e.message || e); });
}

function terminarEsperaTab(clave) {
  if (ESPERA_TAB[clave] && ESPERA_TAB[clave].t) clearInterval(ESPERA_TAB[clave].t);
  delete ESPERA_TAB[clave];
}

/** Suma de un día: todos los locales, o el elegido. Devuelve null si ese día no corrió. */
function diaTotal(dia, cual, campo) {
  var v = dia[campo];
  if (!v) return null;
  if (cual >= 0) return v[cual];
  var s = 0;
  for (var i = 0; i < v.length; i++) s += v[i];
  return s;
}

function mesTablero() {
  if (!TAB || !TAB.meses.length) return null;
  if (TAB_MES < 0 || TAB_MES >= TAB.meses.length) {
    TAB_MES = 0;                                   // el último mes con datos cargados
    for (var i = TAB.meses.length - 1; i >= 0; i--) {
      var m = TAB.meses[i], hay = false;
      for (var j = 0; j < m.dias.length; j++) if (m.dias[j].a) hay = true;
      if (hay) { TAB_MES = i; break; }
    }
  }
  return TAB.meses[TAB_MES];
}

function verMes(i) { TAB_MES = i; pintarTablero(); alPrincipio(); }
function verLocal(i) { TAB_LOCAL = i; pintarTablero(); }

function pintarTablero(guardado) {
  var m = mesTablero();
  if (!m) { $('vTablero').innerHTML = '<div class="vacio">No hay datos todavía.</div>'; return; }
  var loc = TAB.locales, cual = TAB_LOCAL;

  // ---- acumulados: solo los días que ya corrieron, para comparar peras con peras
  var actual = 0, base = 0, baseMes = 0, dias = 0, corridos = [];
  for (var i = 0; i < m.dias.length; i++) {
    var d = m.dias[i];
    baseMes += diaTotal(d, cual, 'b') || 0;
    if (d.a) {
      actual += diaTotal(d, cual, 'a'); base += diaTotal(d, cual, 'b') || 0;
      dias++; corridos.push(d);
    }
  }
  var proy = base * (1 + TAB.pct);
  var proyMes = baseMes * (1 + TAB.pct);

  var titulo = '<div class="tit-tablero">Ventas Minoristas · Proyección</div>';
  var chips = '<div class="meses">' + TAB.meses.map(function (x, i) {
    return '<button class="mes-chip' + (i === TAB_MES ? ' act' : '') + '" onclick="verMes(' + i + ')">' +
           esc(x.titulo.charAt(0).toUpperCase() + x.titulo.slice(1)) + '</button>';
  }).join('') + '</div>';

  var filtro = '<div class="filtro-local">' +
    '<button class="chip' + (cual < 0 ? ' act' : '') + '" onclick="verLocal(-1)">Todos</button>' +
    loc.map(function (n, i) {
      return '<button class="chip' + (i === cual ? ' act' : '') + '" onclick="verLocal(' + i + ')">' +
             esc(n) + '</button>';
    }).join('') + '</div>';

  var kpis = '<div class="kpis" style="margin-top:10px">' +
    '<div class="kpi"><div class="r">Venta</div><div class="v">' + corta(actual) + '</div>' +
      '<div class="d" style="color:var(--muted)">' + dias + (dias === 1 ? ' día' : ' días') + '</div></div>' +
    '<div class="kpi"><div class="r">Año anterior</div><div class="v">' + corta(base) + '</div>' +
      '<div class="d ' + claseDif(actual, base) + '">' + dif(actual, base) + '</div></div>' +
    '<div class="kpi"><div class="r">Proyectado</div><div class="v">' + corta(proy) + '</div>' +
      '<div class="d ' + claseDif(actual, proy) + '">' + dif(actual, proy) + '</div></div>' +
    '</div>';

  var cerrado = dias >= m.dias.length;
  var pie = '<div class="ped-sub" style="margin:0 0 10px">' +
    (cerrado ? 'Mes completo.' : 'Van ' + dias + ' de ' + m.dias.length + ' días. ' +
      'Si sigue así, el mes cierra cerca de ' + corta(baseMes * (base ? actual / base : 1)) +
      ' (proyectado ' + corta(proyMes) + ').') +
    ' · Libro al ' + esc(TAB.al) + (guardado ? ' · buscando novedades…' : '') + '</div>';

  $('vTablero').innerHTML = tabsVista() + barraSello('proy', TAB.al, false, "rearmarAhora('proy')") +
    titulo + chips + filtro + pie + mandoPct() +
    grafLocales(m) + kpis + tablaDias(m, corridos);
  // el mes elegido suele ser el último: centrarlo en la tira, sin tocar el scroll de la página
  var tira = $('vTablero').querySelector('.meses');
  var elegido = tira && tira.querySelector('.mes-chip.act');
  if (tira && elegido) {   // con rectángulos: offsetLeft se mide contra otro contenedor
    var rt = tira.getBoundingClientRect(), re = elegido.getBoundingClientRect();
    tira.scrollLeft += (re.left - rt.left) - (rt.width - re.width) / 2;
  }
}

/** El % de incremento con el que se proyecta la venta.
 *  El − / + es solo para mirar en pantalla ("¿y si fuera 15%?"): no cambia nada.
 *  Para que valga en todos los informes, el administrador toca "Fijar": eso le pide al
 *  robot que lo escriba en el libro (Parámetros!B3) y rearme el informe del día. */
var TAB_VIG = null, FIJAR_OK = false;
function pctTxt(f) { return (f * 100).toFixed(1).replace('.', ',').replace(',0', ''); }
function mandoPct() {
  var pct = pctTxt(TAB.pct);
  var admin = DATA.usuario && DATA.usuario.rol === 'admin';
  if (TAB_VIG === null) TAB_VIG = TAB.pct;
  if (!admin) return '<div class="proy">Proyección: <b>+' + pct + '%</b> sobre el año anterior</div>';
  var h = '<div class="proy">Proyección sobre el año anterior:' +
    '<button onclick="cambiarPct(-1)" aria-label="Bajar">−</button>' +
    '<b>+' + pct + '%</b>' +
    '<button onclick="cambiarPct(1)" aria-label="Subir">+</button></div>';
  if (Math.abs(TAB.pct - TAB_VIG) > 1e-9) {
    h += '<div class="proy-fijar"><span>Vigente en los informes: +' + pctTxt(TAB_VIG) + '%. ' +
         'Lo de arriba es solo una prueba en pantalla.</span>' +
         '<button onclick="fijarPct()">' + (FIJAR_OK ? 'Tocá de nuevo para confirmar' :
         'Fijar +' + pct + '% en todos los informes') + '</button>' +
         '<button class="volver" onclick="volverPct()">Volver a +' + pctTxt(TAB_VIG) + '%</button></div>';
  }
  return h;
}
function cambiarPct(d) {
  var n = Math.round(TAB.pct * 100) + d;
  if (n < -100 || n > 500) return;
  TAB.pct = n / 100;
  FIJAR_OK = false;
  pintarTablero();
}
function volverPct() { TAB.pct = TAB_VIG; FIJAR_OK = false; pintarTablero(); }
function fijarPct() {
  if (!FIJAR_OK) { FIJAR_OK = true; pintarTablero(); return; }
  FIJAR_OK = false;
  var n = Math.round(TAB.pct * 1000) / 10;
  api('pedir', { clave: 'proyeccion', datos: String(n).replace('.', ','), detalle: n + '%' }).then(function (d) {
    if (d && d.pedidos) { DATA.pedidos = d.pedidos; }
    toast('Listo: el robot fija el ' + String(n).replace('.', ',') + '% y rearma el informe. ' +
          'Te aviso cuando termine (lo ves en Mis informes).');
    pintarTablero();
  }).catch(function (e) { toast(e.message || e); pintarTablero(); });
}

/** Barras horizontales: cada local, lo que vendió contra el mismo período del año anterior. */
function grafLocales(m) {
  var loc = TAB.locales, filas = [], tope = 0;
  for (var i = 0; i < loc.length; i++) {
    var a = 0, b = 0;
    for (var j = 0; j < m.dias.length; j++) {
      if (!m.dias[j].a) continue;
      a += m.dias[j].a[i]; b += m.dias[j].b[i];
    }
    filas.push({ n: loc[i], a: a, b: b });
    tope = Math.max(tope, a, b);
  }
  if (!tope) return '';
  filas.sort(function (x, y) { return y.a - x.a; });
  var ALTO = 30, ancho = 360, xBar = 0, anchoBar = 360;
  var s = '<svg viewBox="0 0 ' + ancho + ' ' + (filas.length * ALTO) + '" role="img" aria-label="Venta por local">';
  filas.forEach(function (f, i) {
    var y = i * ALTO;
    var cl = claseDif(f.a, f.b);
    // primero se lee: nombre - importe - porcentaje; la barra va abajo, fina
    s += '<text x="0" y="' + (y + 10) + '" font-size="11.5" font-weight="700" fill="var(--ink)">' +
         esc(f.n) + '</text>';
    s += '<text x="212" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" font-weight="700" ' +
         'fill="var(--ink)">' + corta(f.a) + '</text>';
    s += '<text x="292" y="' + (y + 10) + '" text-anchor="end" font-size="11" ' +
         'fill="var(--muted)">' + (f.b ? corta(f.b) : '—') + '</text>';
    s += '<text x="' + ancho + '" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" ' +
         'font-weight="800" fill="' + (cl === 'sube' ? 'var(--ok)' : cl === 'baja' ? 'var(--bad)' :
         'var(--muted)') + '">' + dif(f.a, f.b) + '</text>';
    var la = anchoBar * (f.a / tope), lb = anchoBar * (f.b / tope);
    s += '<rect x="' + xBar + '" y="' + (y + 15) + '" width="' + Math.max(la, 1) +
         '" height="6" rx="3" fill="var(--accent)"/>';
    s += '<rect x="' + xBar + '" y="' + (y + 23) + '" width="' + Math.max(lb, 1) +
         '" height="3" rx="1.5" fill="var(--line-fuerte)"/>';
  });
  s += '</svg>';
  return '<div class="graf"><h4>Por local</h4>' +
    '<div class="ped-sub">Este año · año anterior · diferencia. Mismos días del año anterior.</div>' + s +
    '<div class="leyenda"><span><i style="background:var(--accent)"></i>Este año</span>' +
    '<span><i style="background:var(--line-fuerte)"></i>Año anterior</span></div></div>';
}

function tablaDias(m, corridos) {
  if (!corridos.length) return '';
  var cual = TAB_LOCAL;
  var f = corridos.slice().reverse().map(function (d) {
    var a = diaTotal(d, cual, 'a');
    var b = diaTotal(d, cual, 'b') || 0;
    var pr = b * (1 + TAB.pct);
    return '<tr><td>' + d.d + '</td>' +
      '<td class="num">' + guita(a) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(pr) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(b) + '</td>' +
      '<td class="num ' + claseDif(a, pr) + '">' + dif(a, pr) + '</td></tr>';
  }).join('');
  return '<div class="graf"><h4>Día por día</h4>' +
    '<div class="ped-sub">El porcentaje compara la venta contra lo proyectado.</div>' +
    '<table class="tdias"><tr><th>Día</th><th>Venta</th><th>Proyect.</th>' +
    '<th>Año ant.</th><th>Dif.</th></tr>' + f + '</table></div>';
}

var ETIQUETA_ESTADO = { ok: ['b-listo', 'Llegó hoy'], esperando: ['b-pendiente', 'Pendiente'],
                        falta: ['b-error', 'No llegó'] };

/** Resumen de arriba: qué informes de hoy llegaron y cuáles no. */
function resumenHoy() {
  var faltan = [], esperando = [], llegaron = 0, control = 0;
  AUTOS.forEach(function (a) {
    if (!a.estado || a.estado === 'na') return;
    control++;
    if (a.estado === 'ok') llegaron++;
    else if (a.estado === 'falta') faltan.push(a.nombre);
    else esperando.push(a.nombre);
  });
  if (!control) return '';
  var clase = faltan.length ? 'hoy-mal' : (esperando.length ? 'hoy-espera' : 'hoy-bien');
  var titulo = faltan.length ? 'Falta el informe de hoy'
             : (esperando.length ? 'Al día, con informes pendientes' : 'Todos los informes de hoy llegaron');
  var detalle = faltan.length ? faltan.join(' · ')
              : (esperando.length ? 'Todavía no corrió: ' + esperando.join(' · ')
                                  : llegaron + ' de ' + control);
  return '<div class="hoy ' + clase + '"><span class="hoy-t">' + esc(titulo) + '</span>' +
         '<span class="hoy-d">' + esc(detalle) + '</span></div>';
}

function pintarAutomaticos(guardado) {
  if (!AUTOS || !AUTOS.length) {
    $('vAuto').innerHTML = tabsAuto() + '<div class="vacio">No tenés informes automáticos habilitados.</div>'; return;
  }
  var aviso = guardado ? '<div class="ped-sub" style="margin:-4px 0 10px">Mostrando lo último que viste · buscando novedades…</div>' : '';
  $('vAuto').innerHTML = tabsAuto() + resumenHoy() + aviso + AUTOS.map(function (a) {
    var arch = a.archivos.length ? a.archivos.map(function (f) {
      return '<button class="btn sec arch" onclick="bajarAuto(\'' + esc(a.clave) + '\',\'' +
        esc(f.fid) + '\',this)"><span class="arch-nom">' + esc(f.titulo || f.nombre) + '</span>' +
        '<span class="arch-fecha">' + esc(fechaCorta(f.fecha)) + '</span></button>';
    }).join('') : '<div class="ped-sub">Todavía no llegó ninguno.</div>';
    var e = ETIQUETA_ESTADO[a.estado];
    var marca = e ? '<span class="badge ' + e[0] + '">' + e[1] + '</span>' : '';
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' +
      esc(a.dibujo || '📄') + ' ' + esc(a.nombre) + '</span>' + marca + '</div>' + arch + '</div>';
  }).join('');
}
function bajarAuto(clave, fid, boton) {
  var txt = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Abriendo…';
  api('archivo_auto', { clave: clave, fid: fid }).then(function (a) { guardarArchivo(a); })
    .catch(function (e) { toast(e.message || 'No pude abrir el archivo.'); })
    .then(function () { boton.disabled = false; boton.innerHTML = txt; });
}

// ---------------------------------------------------------------- preguntar
var EJEMPLOS = ['¿Cuánto me debe Bustorf?', '¿Qué locales vendieron más este mes?',
                '¿Cuánto vendimos ayer?', '¿Qué cheques tengo que ingresar esta semana?'];

function pintarPreguntas() {
  // El cuadro de escribir se arma UNA sola vez y después no se toca. Antes esta función
  // rehacía toda la pantalla, y como las preguntas se refrescan cada 4 segundos mientras hay
  // una sin responder, el texto a medio escribir se borraba solo cada pocos segundos.
  if (!$('fPreg')) {
    $('vPreguntar').innerHTML = '<div class="preg-caja">' +
      '<textarea id="fPreg" rows="2" placeholder="Preguntá sobre ventas, clientes, saldos o stock…" ' +
      'oninput="autoAlto(this)" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();enviarPregunta();}"></textarea>' +
      '<button class="btn" id="bPreg" onclick="enviarPregunta()">Preguntar</button></div>' +
      '<div class="preg-seguir" id="pregSeguir" hidden></div>' +
      '<div id="pregLista"></div>';
  }
  pintarSeguir();
  var h = '';
  if (!PREGS.length) {
    h += '<div class="rubro">Para probar</div><div class="chips">' +
      EJEMPLOS.map(function (e) {
        return '<span class="chip" onclick="ponerPregunta(this)">' + esc(e) + '</span>';
      }).join('') + '</div>';
  }
  h += charlas().map(function (ch) {
    var vueltas = ch.vueltas.map(function (p) {
      var cuerpo;
      if (p.estado === 'listo') cuerpo = '<div class="preg-resp">' + esc(p.respuesta) + '</div>';
      else if (p.estado === 'error') cuerpo = '<div class="preg-resp error">' + esc(p.respuesta ||
        'No pude responder.') + '</div>';
      else cuerpo = '<div class="preg-resp pensando">Pensando…</div>';
      return '<div class="vuelta"><div class="ped-top"><span class="ped-nom">' + esc(p.pregunta) + '</span>' +
        '<span class="arch-fecha">' + esc(fechaCorta(p.creado)) + '</span></div>' + cuerpo + '</div>';
    }).join('');
    var pie = ch.hilo === HILO
      ? '<div class="preg-pie activo">Lo que escribas sigue esta charla</div>'
      : '<div class="preg-pie"><button class="chip" onclick="seguirCharla(\'' + esc(ch.hilo) +
        '\')">Seguir esta charla</button></div>';
    return '<div class="pedido charla">' + vueltas + pie + '</div>';
  }).join('');
  $('pregLista').innerHTML = h;
}

/** Las preguntas agrupadas por charla: la más nueva arriba, y adentro en orden de ida y vuelta.
 *  PREGS viene de la más nueva a la más vieja; las preguntas viejas no tienen hilo y el
 *  servidor les devuelve su propio id, así que cada una queda como una charla de una vuelta. */
function charlas() {
  var por = {}, orden = [];
  PREGS.forEach(function (p) {
    var k = p.hilo || p.id;
    if (!por[k]) { por[k] = { hilo: k, vueltas: [] }; orden.push(por[k]); }
    por[k].vueltas.unshift(p);           // dentro de la charla, de la más vieja a la más nueva
  });
  return orden;
}

function pintarSeguir() {
  var e = $('pregSeguir');
  if (!e) return;
  var ch = HILO && charlas().filter(function (c) { return c.hilo === HILO; })[0];
  if (!ch) { e.hidden = true; e.innerHTML = ''; return; }
  e.hidden = false;
  e.innerHTML = 'Seguís la charla de <b>' + esc(ch.vueltas[0].pregunta.slice(0, 40)) +
    (ch.vueltas[0].pregunta.length > 40 ? '…' : '') + '</b>' +
    ' <button class="chip" onclick="nuevaCharla()">Empezar una nueva</button>';
}

function seguirCharla(h) { HILO = h; pintarPreguntas(); if ($('fPreg')) $('fPreg').focus(); }
function nuevaCharla() { HILO = ''; pintarPreguntas(); if ($('fPreg')) $('fPreg').focus(); }

function autoAlto(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 150) + 'px'; }
function ponerPregunta(c) { $('fPreg').value = c.textContent; $('fPreg').focus(); }

function cargarPreguntas() {
  api('preguntas').then(function (d) {
    PREGS = d.preguntas; pintarPreguntas(); programarPreguntas();
  }).catch(function () {});
}
function programarPreguntas() {
  clearTimeout(timerPreg);
  if ($('vPreguntar').hidden) return;
  var activa = PREGS.some(function (p) { return p.estado === 'pendiente' || p.estado === 'pensando'; });
  timerPreg = setTimeout(cargarPreguntas, activa ? 4000 : 30000);
}
function enviarPregunta() {
  var t = ($('fPreg').value || '').trim();
  if (!t) return;
  var b = $('bPreg');
  b.disabled = true; b.textContent = 'Enviando…';
  api('preguntar', { pregunta: t, hilo: HILO }).then(function (d) {
    // La recién enviada es la primera de la lista: su hilo es el que sigue la charla.
    HILO = (d.preguntas && d.preguntas[0] && d.preguntas[0].hilo) || HILO;
    // Antes el cuadro se limpiaba solo porque pintarPreguntas() rehacía toda la pantalla.
    // Ahora el cuadro se conserva (para no pisar lo que se escribe), así que se limpia acá.
    var c = $('fPreg');
    if (c) { c.value = ''; c.style.height = ''; autoAlto(c); }
    b.disabled = false; b.textContent = 'Preguntar';
    PREGS = d.preguntas; pintarPreguntas(); programarPreguntas();
    // le avisa al servidor que arranque ya; si contesta la notebook, no hace nada
    api('pensar').catch(function () {});
    if (!d.robot.en_linea && !d.nube) toast('La notebook no responde: contesta cuando vuelva.');
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Preguntar'; toast(e.message || e);
  });
}

function cuantos(txt, total) {

}
function pintarUsuarios() {

function casillas(lista, permitidos, prefijo) {

    return '<label class="chk"><input type="checkbox" class="' + prefijo + '" value="' + esc(i.clave) + '"' +
      (todos || ok.indexOf(i.clave) >= 0 ? ' checked' : '') + '>' + esc(i.nombre) + '</label>';
  }).join('');
}

    h += '<div class="sub">Carpetas de Drive que puede consultar</div>' +
         '<div class="ped-sub">El asistente solo busca adentro de las que tildes. ' +
         'Sin ninguna, no accede a Drive.</div><div class="chks">' +
         '<label class="chk"><input type="checkbox" onclick="marcarTodo(this, \'cd\')">Todas</label></div>' +
         '<div class="chks">' + casillas(USU.carpetas, p.carpetas, 'cd') + '</div>';
  }
  h += '<div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
       '<button class="btn" id="bGuardar" onclick="guardarUsuario()">Guardar</button></div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
}
function marcarTodo(c, clase) {
  var l = document.getElementsByClassName(clase);
  for (var i = 0; i < l.length; i++) l[i].checked = c.checked;
}
function marcadas(clase) {
  var l = document.getElementsByClassName(clase), out = [];
  for (var i = 0; i < l.length; i++) if (l[i].checked) out.push(l[i].value);
  return out;
}
function guardarUsuario() {
  var b = $('bGuardar');
  b.disabled = true; b.textContent = 'Guardando…';
  var inf = marcadas('ci'), aut = marcadas('ca'), car = marcadas('cd'), tab = marcadas('ct');
  api('guardar_usuario', {
    email: EDIT.email || $('uMail').value,
    nombre: $('uNombre').value,
    rol: $('uAdmin').checked ? 'admin' : 'usuario',
    activo: $('uActivo').checked,
    preguntar: $('uPreg').checked,
    actualizar: $('uAct').checked,
    informes: inf.length === USU.catalogo.length ? '*' : inf,
    automaticos: aut.length === USU.automaticos.length ? '*' : aut,
    carpetas: car.length === (USU.carpetas || []).length && car.length ? '*' : car,
    tableros: tab.length === (USU.tableros || []).length && tab.length ? '*' : tab
  }).then(function (d) {
    USU = d; cerrarHoja(); pintarUsuarios(); toast('Guardado');
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Guardar'; toast(e.message || e);
  });
}

// ---------------------------------------------------------------- actividad (admin)
// Control de lo que pasa: qué pidió cada persona y qué falló. Los datos salen de las dos
// hojas que ya se escriben solas (Pedidos y Auditoría); acá no se registra nada nuevo.
var ACT = null;
var ACT_DIAS = 7;

function cargarActividad() {
  if (ACT && ACT.dias === ACT_DIAS) pintarActividad();
  else $('vActividad').innerHTML = '<div class="vacio">Cargando…</div>';
  api('actividad', { dias: ACT_DIAS }).then(function (d) {
    ACT = d; pintarActividad();
  }).catch(function (e) {
    $('vActividad').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

function verActividad(dias) {
  if (dias === ACT_DIAS) return;
  ACT_DIAS = dias; ACT = null; cargarActividad(); alPrincipio();
}

/** "2 m 14 s" / "48 s". Null cuando el pedido sigue abierto. */
function demoraTxt(s) {
  if (s === null || s === undefined) return '';
  if (s < 60) return s + ' s';
  var m = Math.floor(s / 60);
  return m + ' m' + (s % 60 ? ' ' + (s % 60) + ' s' : '');
}

/** Las acciones de la auditoría, en castellano. */
var NOMBRE_FALLA = {
  rechazado: 'Ingreso rechazado',
  pedido_rechazado: 'Informe no habilitado',
  admin_rechazado: 'Quiso entrar a algo de admin',
  freno_ingreso: 'Ingreso frenado por intentos',
  mail_pedido_error: 'No se pudo mandar el mail'
};

function pintarActividad() {
  var d = ACT;
  if (!d) { $('vActividad').innerHTML = '<div class="vacio">Sin datos.</div>'; return; }
  var c = d.cuenta || {}, h = '';

  // ---- elegir el período
  h += '<div class="filtro-local" style="margin:4px 0 14px">' +
    [[1, 'Hoy'], [7, '7 días'], [30, '30 días']].map(function (o) {
      return '<button class="chip' + (ACT_DIAS === o[0] ? ' act' : '') +
        '" onclick="verActividad(' + o[0] + ')">' + o[1] + '</button>';
    }).join('') + '</div>';

  // ---- el resumen
  h += '<div class="act-res">' +
    cuadroAct('Pedidos', c.total || 0, '') +
    cuadroAct('Listos', c.listo || 0, 'ok') +
    cuadroAct('Con error', c.error || 0, (c.error ? 'mal' : '')) +
    cuadroAct('Esperando', c.pendiente || 0, (c.pendiente ? 'espera' : '')) +
    '</div>';

  // ---- las fallas primero: es lo que hay que mirar
  var fallasPedidos = (d.pedidos || []).filter(function (p) { return p.estado === 'error'; });
  h += '<div class="rubro">Fallas</div>';
  if (!fallasPedidos.length && !(d.fallas || []).length) {
    h += '<div class="pedido"><div class="ped-sub" style="margin:0">Sin fallas en el período. ' +
      'Acá aparecen los pedidos que terminaron con error y los ingresos rechazados.</div></div>';
  } else {
    h += fallasPedidos.map(function (p) {
      return '<div class="pedido"><div class="ped-top">' +
        '<span class="ped-nom">' + esc(p.informe || '(sin nombre)') + '</span>' +
        '<span class="badge b-error">Error</span></div>' +
        '<div class="ped-sub">' + esc(p.nombre || p.email) + ' · ' + esc(fechaCorta(p.creado)) +
        (p.detalle ? ' · ' + esc(p.detalle) : '') + '</div>' +
        (p.mensaje ? '<div class="ped-msg">' + esc(p.mensaje) + '</div>' : '') +
        '</div>';
    }).join('');
    h += (d.fallas || []).map(function (f) {
      return '<div class="pedido"><div class="ped-top">' +
        '<span class="ped-nom">' + esc(NOMBRE_FALLA[f.accion] || f.accion) + '</span>' +
        '<span class="badge b-cancelado">Aviso</span></div>' +
        '<div class="ped-sub">' + esc(f.email || '(sin mail)') + ' · ' + esc(fechaCorta(f.fecha)) + '</div>' +
        (f.detalle ? '<div class="ped-msg">' + esc(f.detalle) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  // ---- lo que hicieron los procesos que corren solos. Nadie los pidió, así que no están
  // en Pedidos: hasta el 26/11/2026 el único rastro era el aviso al celular, que se recorta
  // a 400 caracteres y que desde el 12/11 rebotaba siempre. Ahora el texto queda entero acá.
  h += '<div class="rubro">Procesos automáticos</div>';
  if (!(d.automaticos || []).length) {
    h += '<div class="pedido"><div class="ped-sub" style="margin:0">Sin resultados en el período. ' +
      'Acá quedan completos la conciliación de las 7, las cajas, las ventas de las 00, ' +
      'el mayorista y los bancos, aunque el aviso al celular no salga.</div></div>';
  } else {
    h += d.automaticos.map(function (a, i) {
      return '<div class="pedido"><div class="ped-top">' +
        '<span class="ped-nom">' + esc(a.titulo || 'Robot 3C') + '</span>' +
        '<span class="badge b-listo">Listo</span></div>' +
        '<div class="ped-sub">' + esc(fechaCorta(a.fecha)) + '</div>' +
        '<details' + (i === 0 ? ' open' : '') + '>' +
        '<summary class="act-auto-sum">Ver el detalle</summary>' +
        '<div class="act-auto">' + esc(a.texto || '') + '</div></details></div>';
    }).join('');
  }

  // ---- quién pidió cuánto
  if ((d.gente || []).length) {
    h += '<div class="rubro">Por persona</div><div class="pedido" style="padding:6px 15px">' +
      d.gente.map(function (g) {
        return '<div class="act-per"><span class="nom">' + esc(g.nombre || g.email) + '</span>' +
          (g.error ? '<span class="badge b-error">' + g.error + ' con error</span>' : '') +
          '<b>' + g.total + '</b></div>';
      }).join('') + '</div>';
  }

  // ---- el detalle, lo más nuevo arriba
  h += '<div class="rubro">Pedidos — del más nuevo al más viejo</div>';
  if (!(d.pedidos || []).length) {
    h += '<div class="vacio">Nadie pidió nada en el período.</div>';
  } else {
    h += d.pedidos.map(function (p) {
      var dem = demoraTxt(p.demora);
      return '<div class="pedido"><div class="ped-top">' +
        '<span class="ped-nom">' + esc(p.informe || '(sin nombre)') + '</span>' +
        '<span class="badge b-' + esc(p.estado || 'pendiente') + '">' +
        esc((p.estado || 'pendiente').charAt(0).toUpperCase() + (p.estado || 'pendiente').slice(1)) +
        '</span></div>' +
        '<div class="ped-sub">' + esc(p.nombre || p.email) + ' · ' + esc(fechaCorta(p.creado)) +
        (dem ? ' · tardó ' + esc(dem) : '') +
        (p.detalle ? ' · ' + esc(p.detalle) : '') + '</div>' +
        (p.estado === 'error' && p.mensaje ? '<div class="ped-msg">' + esc(p.mensaje) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  $('vActividad').innerHTML = h;
}

function cuadroAct(lab, n, clase) {
  return '<div class="act-caja ' + (clase ? 'act-' + clase : '') + '">' +
    '<span class="n">' + n + '</span><span class="l">' + lab + '</span></div>';
}

// ---------------------------------------------------------------- archivos
function bajar(id, indice, boton) {
  var txt = boton.textContent;
  boton.disabled = true; boton.textContent = 'Abriendo…';
  api('archivo', { id: id, indice: indice }).then(guardarArchivo)
    .catch(function (e) { toast(e.message || 'No pude abrir el archivo.'); })
    .then(function () { boton.disabled = false; boton.textContent = txt; });
}

function guardarArchivo(a) {
  var bin = atob(a.base64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], { type: a.tipo || 'application/octet-stream' }));
  var link = document.createElement('a');
  link.href = url; link.download = a.nombre; link.rel = 'noopener';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

// ---------------------------------------------------------------- pedir
function abrir(clave) {
  var i = DATA.informes.filter(function (x) { return x.clave === clave; })[0];
  if (!i) return;
  ACTUAL = i; ELEGIDOS = []; confirmando = false;
  var hoy = new Date(), ayer = new Date(Date.now() - 86400000), ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var h = '<h2>' + esc(i.dibujo || '') + ' ' + esc(i.nombre) + '</h2><p class="desc">' + esc(i.desc) + '</p>';
  if (critico(i)) {
    h += '<div class="peligro-box">⚠️ ' + (i.confirmar
      ? 'Esta acción <b>escribe en el sistema 3C</b>. Solo vos podés ejecutarla y queda registrada.'
      : 'Esta acción actúa sobre el robot y queda registrada.') + '</div>';
  }
  var e = i.entrada || 'nada';
  if (e === 'cliente' || e === 'cliente_fechas') {
    h += '<label>Clientes</label><input id="fCli" placeholder="Nombre o número; podés sumar varios" ' +
         'autocomplete="off" oninput="buscarCli()"><div class="lista-cli" id="lCli"></div>' +
         '<div class="chips" id="eCli"></div>';
  }
  if (e === 'fechas' || e === 'cliente_fechas') {
    var d0 = e === 'fechas' ? ayer : ini, d1 = e === 'fechas' ? ayer : hoy;
    h += '<div class="fila2"><div><label>Desde</label><input type="date" id="fDesde" value="' + iso(d0) + '"></div>' +
         '<div><label>Hasta</label><input type="date" id="fHasta" value="' + iso(d1) + '"></div></div>' +
         '<div class="chips"><span class="chip" onclick="rango(\'hoy\')">Hoy</span>' +
         '<span class="chip" onclick="rango(\'ayer\')">Ayer</span>' +
         '<span class="chip" onclick="rango(\'mes\')">Este mes</span><span class="chip" onclick="rango(\'mesant\')">Mes anterior</span>' +
         '<span class="chip" onclick="rango(\'anio\')">Este año</span></div>';
  }
  if (e === 'texto' || e === 'texto_opcional') {
    h += '<label>' + esc(i.etiqueta || 'Detalle') + (e === 'texto_opcional' ? ' (opcional)' : '') + '</label>' +
         '<textarea id="fTxt" placeholder="' + esc(i.ayuda || '') + '"></textarea>';
  }
  if (i.confirmar) {
    h += '<label>Escribí ' + esc(i.confirmar) + ' para confirmar</label>' +
         '<input id="fConf" autocomplete="off" autocapitalize="characters" placeholder="' + esc(i.confirmar) + '">';
  }
  h += '<div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
       '<button class="btn' + (critico(i) ? ' peligro' : '') + '" id="bPedir" onclick="enviar()">' +
       (critico(i) ? 'Ejecutar' : 'Pedir') + '</button></div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
  if (e === 'cliente' || e === 'cliente_fechas') cargarClientes();
}
function cerrarHoja() { $('hoja').className = 'hoja'; $('velo').style.display = 'none'; confirmando = false; }

function rango(q) {
  var h = new Date(), a, b;
  if (q === 'hoy') { a = b = h; }
  if (q === 'ayer') { a = b = new Date(Date.now() - 86400000); }
  if (q === 'mes') { a = new Date(h.getFullYear(), h.getMonth(), 1); b = h; }
  if (q === 'mesant') { a = new Date(h.getFullYear(), h.getMonth() - 1, 1); b = new Date(h.getFullYear(), h.getMonth(), 0); }
  if (q === 'anio') { a = new Date(h.getFullYear(), 0, 1); b = h; }
  $('fDesde').value = iso(a); $('fHasta').value = iso(b);
}

function cargarClientes() {
  if (CLIENTES) return;
  api('clientes').then(function (d) { CLIENTES = d.clientes; buscarCli(); }).catch(function () { CLIENTES = []; });
}
function buscarCli() {
  var inp = $('fCli'), l = $('lCli'); if (!inp || !l) return;
  var q = norm(inp.value).trim();
  if (!q) { l.style.display = 'none'; return; }
  if (!CLIENTES) { l.innerHTML = '<div><small>Cargando clientes…</small></div>'; l.style.display = 'block'; return; }
  var pal = q.split(/\s+/);
  var r = CLIENTES.filter(function (c) {
    if (/^\d+$/.test(q)) return c[0] === q;
    var n = norm(c[1]); return pal.every(function (p) { return n.indexOf(p) >= 0; });
  }).slice(0, 30);
  l.innerHTML = r.length ? r.map(function (c) {
    var ya = ELEGIDOS.some(function (x) { return x[0] === c[0]; });
    return '<div onclick="elegirCli(\'' + esc(c[0]) + '\')">' + (ya ? '✓ ' : '') + esc(c[1]) +
      ' <small>N° ' + esc(c[0]) + '</small></div>';
  }).join('') : '<div><small>No encontré clientes con eso.</small></div>';
  l.style.display = 'block';
}
function elegirCli(cod) {
  var c = CLIENTES.filter(function (x) { return x[0] === cod; })[0]; if (!c) return;
  if (!ELEGIDOS.some(function (x) { return x[0] === cod; })) ELEGIDOS.push(c);
  $('fCli').value = ''; $('lCli').style.display = 'none'; $('fCli').focus();
  pintarElegidos();
}
function sacarCli(cod) {
  ELEGIDOS = ELEGIDOS.filter(function (x) { return x[0] !== cod; });
  pintarElegidos();
}
function pintarElegidos() {
  $('eCli').innerHTML = ELEGIDOS.map(function (c) {
    return '<span class="chip" onclick="sacarCli(\'' + esc(c[0]) + '\')">' + esc(c[1]) +
      ' <span style="color:var(--muted)">✕</span></span>';
  }).join('');
}

function datosDe(i) {
  var e = i.entrada || 'nada', partes = [];
  if (e === 'cliente' || e === 'cliente_fechas') {
    if (!ELEGIDOS.length) throw new Error('Elegí al menos un cliente de la lista.');
    partes.push(ELEGIDOS.map(function (c) { return c[0]; }).join(','));
  }
  if (e === 'fechas' || e === 'cliente_fechas') {
    var a = $('fDesde').value, b = $('fHasta').value;
    if (!a || !b) throw new Error('Completá las fechas.');
    if (a > b) throw new Error('La fecha "desde" es posterior a "hasta".');
    partes.push(deIso(a), deIso(b));
  }
  if (e === 'texto' || e === 'texto_opcional') {
    var t = $('fTxt').value.trim();
    if (e === 'texto' && !t) throw new Error('Completá ' + (i.etiqueta || 'el detalle').toLowerCase() + '.');
    if (t) partes.push(t);
  }
  return partes.join(' ');
}
function etiquetaDatos(i, datos) {
  if (ELEGIDOS.length && (i.entrada === 'cliente' || i.entrada === 'cliente_fechas')) {
    var nombres = ELEGIDOS.length <= 3
      ? ELEGIDOS.map(function (c) { return c[1]; }).join(', ')
      : ELEGIDOS.length + ' clientes';
    return datos.replace(ELEGIDOS.map(function (c) { return c[0]; }).join(','), nombres);
  }
  return datos;
}

function enviar() {
  var i = ACTUAL, datos, conf = '';
  try { datos = datosDe(i); } catch (e) { toast(e.message); return; }
  var b = $('bPedir');
  if (i.confirmar) {
    conf = ($('fConf').value || '').trim().toUpperCase();
    if (conf !== i.confirmar) { toast('Escribí ' + i.confirmar + ' para confirmar.'); return; }
  }
  if (critico(i) && !confirmando) {           // segunda confirmación: hay que tocar dos veces
    confirmando = true;
    b.textContent = 'Tocá de nuevo para ejecutar';
    setTimeout(function () { if (confirmando) { confirmando = false; b.textContent = 'Ejecutar'; } }, 8000);
    return;
  }
  b.disabled = true; b.textContent = 'Enviando…';
  api('pedir', { clave: i.clave, datos: datos, detalle: etiquetaDatos(i, datos), confirmacion: conf }).then(function (d) {
    DATA.robot = d.robot; DATA.pedidos = d.pedidos;
    cerrarHoja(); pintarEstado(); pintarPedidos(); ver('mios'); programar();
    toast(DATA.robot.en_linea ? 'Pedido enviado' : 'Pedido anotado: sale cuando vuelva la notebook');
  }).catch(function (e) {
    b.disabled = false; b.textContent = critico(i) ? 'Ejecutar' : 'Pedir'; confirmando = false;
    toast(e.message || e);
  });
}

function cancelar(id) {
  api('cancelar', { id: id }).then(function (d) { DATA.pedidos = d.pedidos; pintarPedidos(); })
    .catch(function (e) { toast(e.message || e); });
}
function repetir(id) {
  var p = DATA.pedidos.filter(function (x) { return x.id === id; })[0]; if (!p) return;
  var i = DATA.informes.filter(function (x) { return x.nombre === p.informe; })[0];
  if (!i) { toast('Ese informe ya no está disponible.'); return; }
  abrir(i.clave);
}

if ('serviceWorker' in navigator) {
  // Si la página arrancó SIN service worker (primera vez que se abre la app, o la primera
  // después de publicar una versión), el que se instala toma el control a los pocos segundos
  // y dispara controllerchange. Recargar ahí no sirve para nada —la página ya es la última
  // publicada— y en cambio te saca de donde estabas o te borra lo que estabas escribiendo.
  // Solo se recarga cuando ANTES había uno controlando, que es el caso real de versión nueva.
  var habiaControlador = !!navigator.serviceWorker.controller;
  var recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!habiaControlador || recargando) return;
    // Aunque sea una versión nueva de verdad, no se recarga encima de alguien que está
    // escribiendo: se espera a que suelte el campo.
    var f = document.activeElement;
    if (f && /^(TEXTAREA|INPUT)$/.test(f.tagName) && String(f.value || '').trim()) {
      f.addEventListener('blur', function () { location.reload(); }, { once: true });
      return;
    }
    recargando = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    setInterval(buscarVersion, 3600000);        // una vez por hora, por las dudas
  });
}
arrancar();
