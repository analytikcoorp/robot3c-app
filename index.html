<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Informes JC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Informes JC">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
  :root {
    /* mismos valores que estilo_informes.py (el estándar de los informes) */
    --bg: #eef3f9; --card: #ffffff; --card-2: #e4edf6;
    --ink: #182430; --muted: #51667a; --tenue: #8ea0b3;
    --line: rgba(24,36,48,.10); --line-fuerte: rgba(24,36,48,.18);
    --brand: #1f3d5c; --brand-ink: #f3f8fd; --brand-label: #a9c4e0;
    --accent: #33587e; --accent-claro: #5b93c9;
    --ok: #0a7d0a; --ok-bg: #e3f4e0;
    --bad: #c23a3a; --bad-bg: #fbe4e1;
    --warn: #5b7699; --warn-bg: #dde7f0;
    --run: #33587e; --run-bg: #e4edf6;
    --shadow: 0 1px 2px rgba(24,36,48,.06), 0 1px 3px rgba(24,36,48,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1620; --card: #16222f; --card-2: #1d2d3f;
      --ink: #e7eef6; --muted: #9fb2c6; --tenue: #7d91a6;
      --line: rgba(233,240,247,.10); --line-fuerte: rgba(233,240,247,.20);
      --brand: #16293d; --brand-ink: #f3f8fd; --brand-label: #a9c4e0;
      --accent: #8fc6dc; --accent-claro: #5b93c9;
      --ok: #7ec47e; --ok-bg: #143018;
      --bad: #e8938d; --bad-bg: #3a1a18;
      --warn: #a9c4e0; --warn-bg: #1f3148;
      --run: #8fc6dc; --run-bg: #1d2d3f;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* overflow-x: clip y no hidden: hidden convierte al body en contenedor de scroll.
     El encabezado va con position:fixed y no sticky (03/11/2026): sticky depende de que
     ningún ancestro tenga overflow y en el Safari del celular no quedaba fijo. */
  html, body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip;
    font: 15px/1.45 "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 6; background: var(--brand); color: var(--brand-ink);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; }
  header .marca { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; overflow: hidden; }
  header .marca > div { min-width: 0; }
  header .logo { height: 26px; width: auto; display: block; flex: none; }
  .fecha { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--brand-label); line-height: 1.3;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hola { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em;
    color: var(--brand-ink); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .estado { font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 5px 11px; max-width: 45%;
    border-radius: 100px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; flex: none; }
  .punto { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-label); }
  .recargar { flex: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    color: var(--brand-ink); font-size: 17px; line-height: 1; padding: 0; }
  .recargar:active { background: rgba(255,255,255,.22); }
  .recargar.girando { animation: giro .9s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .estado.on .punto { background: #8fe08f; box-shadow: 0 0 0 3px rgba(143,224,143,.22); }
  .estado.off .punto { background: #f0a0a0; }
  #estadoTxt { overflow: hidden; text-overflow: ellipsis; }
  /* el alto real del encabezado lo mide medirCabecera() y lo deja en --alto-cab */
  main { padding: calc(var(--alto-cab, 76px) + 14px) 16px calc(84px + env(safe-area-inset-bottom));
    max-width: 760px; margin: 0 auto; }
  .aviso { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 12px;
    font-size: 13.5px; margin-bottom: 12px; display: none; }
  .rubro { margin: 20px 2px 9px; font-size: 11.5px; font-weight: 800; color: var(--accent-claro);
    text-transform: uppercase; letter-spacing: .08em; }
  .rubro:first-child { margin-top: 4px; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .inf { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    text-align: left; cursor: pointer; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: flex-start;
    min-height: 58px; transition: transform .08s; }
  .inf:active { transform: scale(.98); }
  .inf .ico { font-size: 20px; line-height: 1.2; }
  .inf .nom { font-weight: 600; font-size: 14px; }
  .inf.critico { border-left: 3px solid var(--bad); }
  .pedido { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
    margin-bottom: 8px; box-shadow: var(--shadow); }
  .ped-top { display: flex; gap: 8px; align-items: baseline; }
  .ped-nom { font-weight: 600; flex: 1; }
  .ped-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .badge { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; border-radius: 100px;
    padding: 4px 10px; white-space: nowrap; border: 1px solid var(--line-fuerte); }
  .b-pendiente { background: var(--warn-bg); color: var(--warn); }
  .b-generando { background: var(--run-bg); color: var(--run); }
  .b-listo { background: var(--ok-bg); color: var(--ok); }
  .b-error, .b-cancelado { background: var(--bad-bg); color: var(--bad); }
  .hoy { border-radius: 14px; padding: 11px 14px; margin-bottom: 12px; display: flex;
    flex-direction: column; gap: 2px; border: 1px solid var(--line-fuerte); }
  .hoy-t { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
  .hoy-d { font-size: 12.5px; opacity: .9; }
  .hoy-bien { background: var(--ok-bg); color: var(--ok); }
  .hoy-espera { background: var(--warn-bg); color: var(--warn); }
  .hoy-mal { background: var(--bad-bg); color: var(--bad); }
  .ped-msg { font-size: 13.5px; margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ped-acc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; letter-spacing: .01em; cursor: pointer;
    background: var(--accent); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.sec { background: var(--card); color: var(--accent); border: 1px solid var(--line-fuerte); }
  .btn.peligro { background: var(--bad); color: #fff; }
  .btn.arch { width: 100%; margin-top: 6px; gap: 10px; text-align: left;
    justify-content: space-between; align-items: baseline; }
  .arch-nom { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
  .arch-fecha { flex: none; font-size: 12px; font-weight: 500; color: var(--tenue);
    font-variant-numeric: tabular-nums; }
  .btn:disabled { opacity: .5; }
  .vacio { text-align: center; color: var(--muted); padding: 40px 10px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1 1 0; min-width: 0; border: 0; background: none; padding: 10px 2px 12px;
    color: var(--muted); font-size: 11.5px; line-height: 1.2; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; position: relative; }
  nav button .t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav button .i { font-size: 20px; }
  nav button.act { color: var(--accent); font-weight: 700; }
  nav button span.i { opacity: .85; }
  nav button.act span.i { opacity: 1; }
  .cont { position: absolute; top: 4px; left: calc(50% + 8px); background: var(--bad); color: #fff; font-size: 10.5px;
    border-radius: 99px; padding: 1px 6px; display: none; }
  .velo { position: fixed; inset: 0; background: rgba(10,15,25,.45); z-index: 9; display: none; }
  .hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card);
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow: auto; transform: translateY(105%); transition: transform .2s ease;
    max-width: 760px; margin: 0 auto; }
  .hoja.abierta { transform: none; }
  .hoja h2 { margin: 0 0 4px; font-size: 18px; }
  .hoja .desc { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
  .peligro-box { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 12px;
    font-size: 13.5px; margin: 0 0 12px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 10px 0 5px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; }
  textarea { min-height: 76px; resize: vertical; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* ---- tablero de ventas ---- */
  .cual-tab { display: flex; gap: 6px; margin: 0 0 12px; }
  .cual-tab button { flex: 1; border: 1px solid var(--line-fuerte); background: var(--card);
    color: var(--muted); border-radius: 10px; padding: 9px 6px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; }
  .cual-tab button.act { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .hero { background: var(--brand); color: var(--brand-ink); border-radius: 14px; padding: 16px 18px; }
  .hero .r { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    color: var(--brand-label); }
  .hero .v { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin-top: 4px;
    font-variant-numeric: tabular-nums; }
  .hero .d { font-size: 13.5px; font-weight: 700; margin-top: 4px; }
  .hero .d.sube { color: #8fe08f; } .hero .d.baja { color: #f0a0a0; }
  .hero .d span { color: var(--brand-label); font-weight: 500; }
  .hero .partes { display: flex; gap: 22px; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.18); }
  .hero .partes div { min-width: 0; }
  .hero .partes .pr { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    color: var(--brand-label); }
  .hero .partes .pv { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .mezcla { display: flex; height: 22px; border-radius: 7px; overflow: hidden;
    border: 1px solid var(--line-fuerte); margin-top: 8px; }
  .mezcla div { height: 100%; }
  .mez-lista { margin-top: 10px; }
  .mez-lista .f { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 3px 0; }
  .mez-lista i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .mez-lista .n { flex: 1; color: var(--muted); }
  .mez-lista b { font-variant-numeric: tabular-nums; }
  .mez-lista .p { color: var(--tenue); font-size: 11.5px; width: 40px; text-align: right; }
  .total-linea { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--line-fuerte);
    font-size: 13px; font-weight: 700; }
  .total-linea b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .tit-tablero { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 10px;
    letter-spacing: -.2px; }
  .meses { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 2px 0 10px;
    scrollbar-width: none; }
  .meses::-webkit-scrollbar { display: none; }
  .mes-chip { flex: 0 0 auto; border: 1px solid var(--line-fuerte); background: var(--card);
    color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700;
    white-space: nowrap; cursor: pointer; }
  .mes-chip.act { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--card); border-radius: 12px; padding: 10px; box-shadow: var(--shadow);
    min-width: 0; }
  .kpi .r { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px;
    font-weight: 800; }
  .kpi .v { font-size: 15.5px; font-weight: 800; margin-top: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .kpi .d { font-size: 12px; font-weight: 700; margin-top: 1px; }
  .sube { color: var(--ok); } .baja { color: var(--bad); }
  .graf { background: var(--card); border-radius: 14px; padding: 12px; margin-top: 10px;
    box-shadow: var(--shadow); }
  .graf h4 { margin: 0 0 2px; font-size: 13.5px; }
  .graf svg { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
  .leyenda { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 5px; vertical-align: -1px; }
  .filtro-local { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .filtro-local .chip { font-size: 13px; font-weight: 700; }
  .filtro-local .chip.act { background: var(--ok-bg); color: var(--ok); border-color: var(--ok);
    font-weight: 800; }
  .proy { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px;
    color: var(--muted); }
  .proy b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
  .proy button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line-fuerte);
    background: var(--card); color: var(--accent); font-size: 17px; font-weight: 800; line-height: 1;
    cursor: pointer; }
  .tdias { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
  /* la tabla es larga: los títulos quedan pegados abajo del encabezado al bajar */
  .tdias th { text-align: right; color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    padding: 6px 0; border-bottom: 1px solid var(--line-fuerte); font-weight: 800;
    position: sticky; top: var(--alto-cab, 76px); background: var(--card); z-index: 2; }
  .tdias th:first-child, .tdias td:first-child { text-align: left; }
  .tdias td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .tdias td + td, .tdias th + th { padding-left: 7px; }   /* que no se toquen las columnas */
  .tdias .num { font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 1px solid var(--line-fuerte); background: var(--card-2); color: var(--accent);
    border-radius: 100px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .lista-cli { border: 1px solid var(--line-fuerte); background: var(--card); border-radius: 10px;
    margin-top: 6px; max-height: 220px; overflow: auto; display: none; }
  .lista-cli div { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .lista-cli div:last-child { border-bottom: 0; }
  .lista-cli small { color: var(--muted); }
  .elegido { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--ok); display: none; }
  .preg-caja { display: flex; gap: 8px; align-items: flex-end; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
  .preg-caja textarea { min-height: 44px; border: 0; background: none; padding: 8px 6px; resize: none; }
  .preg-caja textarea:focus { outline: none; }
  .preg-caja .btn { flex: none; }
  .preg-resp { margin-top: 10px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .preg-resp.pensando { color: var(--muted); font-style: italic; border-top: 0; }
  .preg-resp.error { color: var(--bad); }
  .chks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; margin-top: 4px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 14px; font-weight: 400;
    color: var(--ink); margin: 0; cursor: pointer; }
  .chk input { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .sub { font-size: 11.5px; color: var(--accent-claro); margin: 16px 0 2px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .08em; }
  .acciones { display: flex; gap: 10px; margin-top: 18px; }
  .acciones .btn { flex: 1; justify-content: center; padding: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--brand); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20;
    display: none; max-width: calc(100% - 32px); }
  @media (max-width: 400px) {
    header { gap: 6px; padding-inline: 12px; }
    header .logo { height: 22px; }
    .fecha { font-size: 10.5px; letter-spacing: .04em; }
    .hola { font-size: 13.5px; }
    .recargar { width: 30px; height: 30px; font-size: 15px; }
    main { padding-inline: 12px; }
    nav button { font-size: 10.5px; }
    nav button .i { font-size: 18px; }
  }
  @media (max-width: 365px) {
    .estado { padding: 6px; }
    #estadoTxt { display: none; }
    nav button { font-size: 9.8px; letter-spacing: -.01em; }
  }
  /* ingreso */
  #login { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #login .logo { width: 92px; height: 92px; border-radius: 22px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  #login .logo img { width: 52px; height: auto; display: block; }
  #login h2 { margin: 10px 0 0; font-size: 13px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--accent-claro); }
  #login p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; }
  #login .err { color: var(--bad); font-size: 14px; max-width: 340px; min-height: 20px; }
</style>
</head>
<body>

<div id="login">
  <div class="logo"><img src="logo-jc-blanco.png" alt="JC"></div>
  <h2>Informes</h2>
  <p>Entrá con la cuenta de Google de la empresa.</p>
  <div id="botonGoogle"></div>
  <div class="err" id="loginErr"></div>
  <p style="font-size:12.5px">Para tenerlo como app: menú del navegador › <b>Agregar a pantalla de inicio</b>.</p>
</div>

<header hidden id="cab">
  <div class="marca"><img class="logo" src="logo-jc-blanco.png" alt="JC">
    <div><span class="fecha" id="fecha"></span><span class="hola" id="hola">Cargando…</span></div></div>
  <button class="recargar" id="bRecargar" onclick="actualizar()" title="Actualizar" aria-label="Actualizar">↻</button>
  <div class="estado" id="estado" onclick="menuCuenta()"><span class="punto"></span><span id="estadoTxt">…</span></div>
</header>

<main hidden id="cuerpo">
  <div class="aviso" id="aviso"></div>
  <section id="vPedir"></section>
  <section id="vAuto" hidden></section>
  <section id="vTablero" hidden></section>
  <section id="vPreguntar" hidden></section>
  <section id="vMios" hidden></section>
  <section id="vUsuarios" hidden></section>
</main>

<nav hidden id="barra">
  <button id="tPedir" class="act" onclick="ver('pedir')"><span class="i">📋</span><span class="t">Pedir</span></button>
  <button id="tAuto" hidden onclick="ver('auto')"><span class="i">🗓️</span><span class="t">Automáticos</span></button>
  <button id="tTablero" hidden onclick="ver('tablero')"><span class="i">📈</span><span class="t">Tablero</span></button>
  <button id="tPreguntar" hidden onclick="ver('preguntar')"><span class="i">💬</span><span class="t">Preguntar</span></button>
  <button id="tMios" onclick="ver('mios')"><span class="i">📥</span><span class="t">Mis informes</span><span class="cont" id="cont"></span></button>
  <button id="tUsuarios" hidden onclick="ver('usuarios')"><span class="i">👤</span><span class="t">Usuarios</span></button>
</nav>

<div class="velo" id="velo" onclick="cerrarHoja()"></div>
<div class="hoja" id="hoja"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var SESION = null;
var DATA = { informes: [], pedidos: [], robot: {}, usuario: {} };
var CLIENTES = null, ACTUAL = null, ELEGIDOS = [], timer = null, confirmando = false;
var VERSION_APP = '2026-11-04 · 1';   // se muestra en la pantalla de la cuenta
var AUTOS = null, USU = null, EDIT = null, PREGS = [], timerPreg = null;

// El encabezado es position:fixed, así que el contenido necesita saber cuánto mide para
// no quedar tapado. Se mide de verdad (cambia con la muesca del celular y con la fuente).
function medirCabecera() {
  var c = $('cab');
  if (!c || c.hidden) return;
  var alto = c.offsetHeight;
  if (alto) document.documentElement.style.setProperty('--alto-cab', alto + 'px');
}
window.addEventListener('resize', medirCabecera);
window.addEventListener('orientationchange', function () { setTimeout(medirCabecera, 250); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(medirCabecera);

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block';
  clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, 3600); }
function pintarFecha() {
  var d = new Date();
  $('fecha').textContent =
    d.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: 'short' })
     .replace('.', '') + ' · ' +
    d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
pintarFecha();
setInterval(pintarFecha, 20000);

function hora(ms) { if (!ms) return ''; var d = new Date(ms), h = new Date();
  var hm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === h.toDateString() ? hm : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' ' + hm; }
function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function deIso(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
// informes que piden confirmación: conciliar cheques y las órdenes al robot (clave __)
function critico(i) { return !!i.confirmar || String(i.clave).indexOf('__') === 0; }

// ---------------------------------------------------------------- servidor
function api(accion, extra) {
  var cuerpo = { accion: accion, sesion: SESION };
  for (var k in (extra || {})) cuerpo[k] = extra[k];
  // sin headers propios: así el pedido no necesita permiso previo del navegador
  return fetch(CONFIG.servidor, { method: 'POST', redirect: 'follow', body: JSON.stringify(cuerpo) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.error) {
        if (d.error === 'sesion_invalida') { salir('Tu sesión venció. Entrá de nuevo.'); }
        throw new Error(d.error);
      }
      return d;
    });
}

// ---------------------------------------------------------------- ingreso
function iniciarGoogle() {
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(iniciarGoogle, 300); return; }
  google.accounts.id.initialize({ client_id: CONFIG.client_id, callback: conCredencial, auto_select: true });
  google.accounts.id.renderButton($('botonGoogle'), { theme: 'filled_blue', size: 'large', text: 'signin_with',
                                                      shape: 'pill', locale: 'es' });
}
function conCredencial(resp) {
  $('loginErr').textContent = '';
  fetch(CONFIG.servidor, { method: 'POST', redirect: 'follow',
                           body: JSON.stringify({ accion: 'entrar', id_token: resp.credential }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) { $('loginErr').textContent = d.error; return; }
      SESION = d.sesion;
      try { localStorage.setItem('sesion', SESION); } catch (e) {}
      entrarApp(d);
    })
    .catch(function () { $('loginErr').textContent = 'No pude conectarme. Revisá internet y probá de nuevo.'; });
}
function salir(msg) {
  SESION = null; clearTimeout(timer);
  try { localStorage.removeItem('sesion'); } catch (e) {}
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  $('login').style.display = 'flex';
  $('cab').hidden = $('cuerpo').hidden = $('barra').hidden = true;
  $('loginErr').textContent = msg || '';
}
function menuCuenta() {
  var h = '<h2>' + esc(DATA.usuario.nombre || '') + '</h2>' +
          '<div class="ped-sub">' + esc(DATA.usuario.email || '') + '</div>' +
          '<div class="sub">Avisos en este teléfono</div>' +
          '<div class="ped-msg" id="avEstado">' + esc(textoAvisos()) + '</div>' +
          '<div class="ped-sub" id="avDatos">' + esc(datosAvisos()) + '</div>' +
          '<div class="acciones">' +
          '<button class="btn" onclick="pedirAvisos()">' +
          (puedeActivarAvisos() ? 'Activar avisos' : 'Revincular este teléfono') + '</button>' +
          '<button class="btn sec" onclick="probarAviso(this)">Probar aviso</button></div>' +
          '<div class="acciones" style="margin-top:18px">' +
          '<button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
          '<button class="btn sec" onclick="cerrarHoja();salir()">Cerrar sesión</button></div>' +
          '<div class="ped-sub" style="margin-top:14px">Versión ' + esc(VERSION_APP) + '</div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
}

/** Por qué los avisos andan o no, en castellano. Sirve para no adivinar. */
function textoAvisos() {
  if (!DATA.push) return 'El servidor todavía no tiene cargado el App ID de OneSignal. ' +
                         'Se carga en la planilla: Robot 3C › Cargar las notificaciones.';
  if (!('serviceWorker' in navigator) || !('Notification' in window))
    return 'Este navegador no admite avisos. En iPhone hay que abrir la app desde el ícono ' +
           'de la pantalla de inicio, no desde Safari.';
  if (!window.OneSignal || !OneSignal.Notifications)
    return 'El servicio de avisos no terminó de cargar. Cerrá la app y volvé a abrirla; ' +
           'si sigue igual, puede estar bloqueado el acceso a onesignal.com.';
  if (Notification.permission === 'denied')
    return 'Bloqueaste los avisos para este sitio. Hay que habilitarlos a mano en los ' +
           'ajustes del navegador o del teléfono y volver a entrar.';
  if (!OneSignal.Notifications.permission) return 'Todavía no activaste los avisos en este teléfono.';
  return 'Activados. Si no llega ninguno, probá con el botón de acá abajo.';
}
/** Lo que el teléfono tiene registrado. Si falta el mail, el servidor no sabe a quién mandarle. */
function datosAvisos() {
  try {
    if (!window.OneSignal || !OneSignal.User) return '';
    var sub = OneSignal.User.PushSubscription || {};
    return 'Suscripción: ' + (sub.id ? String(sub.id).slice(0, 8) : 'sin registrar') +
           ' · mail vinculado: ' + (OneSignal.User.externalId ? 'sí' : 'NO') +
           ' · activa: ' + (sub.optedIn ? 'sí' : 'no');
  } catch (e) { return ''; }
}
function puedeActivarAvisos() {
  if (!DATA.push || !window.OneSignal || !OneSignal.Notifications) return false;
  if (!('Notification' in window) || Notification.permission === 'denied') return false;
  return !OneSignal.Notifications.permission;
}
function probarAviso(b) {
  b.disabled = true; b.textContent = 'Mandando…';
  var poner = function (t) { if ($('avEstado')) $('avEstado').textContent = t; };
  poner('Mandando…');
  api('probar_aviso').then(function (d) {
    poner(d.ok ? 'Mandado a ' + (d.destinatarios != null ? d.destinatarios : 1) +
                 ' teléfono(s). Si no llega, revisá que la app tenga permiso de notificaciones ' +
                 'en los ajustes del teléfono.'
               : (d.error || 'No se pudo mandar.'));
  }).catch(function (e) { poner('Error del servidor: ' + (e.message || e)); })
    .then(function () { b.disabled = false; b.textContent = 'Probar aviso'; });
}

function entrarApp(d) {
  DATA = d;
  $('login').style.display = 'none';
  $('cab').hidden = $('cuerpo').hidden = $('barra').hidden = false;
  medirCabecera();
  $('hola').textContent = 'Hola, ' + d.usuario.nombre;
  $('tAuto').hidden = !d.hay_automaticos;
  $('tTablero').hidden = !d.hay_tablero;
  $('tPreguntar').hidden = !d.puede_preguntar;
  $('tUsuarios').hidden = d.usuario.rol !== 'admin';
  pintarEstado(); pintarInformes(); pintarPedidos(); programar();
  prepararAvisos(d.push, d.usuario.email);
}

/**
 * Notificaciones al celular. El App ID lo manda el servidor, así que si todavía no
 * está cargado en la planilla esto no hace nada y la app funciona igual.
 * El service worker de OneSignal vive en push/ para no chocar con el nuestro.
 */
var AVISOS_LISTO = false;
function prepararAvisos(appId, email) {
  if (!appId || AVISOS_LISTO || !('serviceWorker' in navigator)) return;
  AVISOS_LISTO = true;
  var s = document.createElement('script');
  s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  s.defer = true;
  document.head.appendChild(s);
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(function (OneSignal) {
    OneSignal.init({ appId: appId,
                     serviceWorkerPath: 'push/OneSignalSDKWorker.js',
                     serviceWorkerParam: { scope: location.pathname.replace(/[^/]*$/, '') + 'push/' } })
      .then(function () { return OneSignal.login(String(email).toLowerCase()); })
      .catch(function () { /* sin avisos, la app anda igual */ });
  });
}

/** Pide permiso para los avisos. Se llama desde el menú de la cuenta. */
function pedirAvisos() {
  if (!window.OneSignal || !OneSignal.Notifications) {
    if ($('avEstado')) $('avEstado').textContent = 'El servicio de avisos no cargó todavía.';
    return;
  }
  if ($('avEstado')) $('avEstado').textContent = 'Pidiendo permiso…';
  OneSignal.Notifications.requestPermission()
    .then(function () {
      if (!OneSignal.Notifications.permission) { toast('Avisos rechazados'); return null; }
      return OneSignal.User.PushSubscription.optIn()
        .then(function () { return OneSignal.login(String(DATA.usuario.email).toLowerCase()); });
    })
    .then(function () {
      if ($('avEstado')) $('avEstado').textContent = textoAvisos();
      if ($('avDatos')) $('avDatos').textContent = datosAvisos();
    })
    .catch(function (e) {
      if ($('avEstado')) $('avEstado').textContent =
        'No pude activar los avisos: ' + (e && e.message ? e.message : e);
    });
}

function arrancar() {
  try { SESION = localStorage.getItem('sesion'); } catch (e) {}
  iniciarGoogle();
  if (!SESION) return;
  api('inicio').then(entrarApp).catch(function (e) {
    if (String(e.message) !== 'sesion_invalida') $('loginErr').textContent = e.message || '';
  });
}

// ---------------------------------------------------------------- refresco
function programar() {
  clearTimeout(timer);
  if (!SESION) return;
  var activos = DATA.pedidos.some(function (p) { return p.estado === 'pendiente' || p.estado === 'generando'; });
  timer = setTimeout(refrescar, document.hidden ? 60000 : (activos ? 6000 : 25000));
}
function refrescar() {
  if (!SESION) return;
  api('refrescar').then(function (d) {
    var antes = {}; DATA.pedidos.forEach(function (p) { antes[p.id] = p.estado; });
    DATA.robot = d.robot; DATA.pedidos = d.pedidos;
    d.pedidos.forEach(function (p) {
      if (antes[p.id] && antes[p.id] !== p.estado && (p.estado === 'listo' || p.estado === 'error'))
        toast((p.estado === 'listo' ? '✅ Listo: ' : '⚠️ Falló: ') + p.informe);
    });
    pintarEstado(); pintarPedidos();
  }).catch(function () {}).then(programar);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });

function actualizar() {
  var b = $('bRecargar');
  b.classList.add('girando');
  buscarVersion();                              // ¿hay una versión nueva publicada?
  var tareas = [api('refrescar').then(function (d) {
    DATA.robot = d.robot; DATA.pedidos = d.pedidos; pintarEstado(); pintarPedidos(); programar();
  })];
  if (!$('vAuto').hidden) { tareas.push(api('automaticos', { fresco: 1 }).then(function (d) {
    AUTOS = d.informes; pintarAutomaticos();
    try { localStorage.setItem(claveAutos(), JSON.stringify(AUTOS)); } catch (e) { /* no es grave */ }
  })); }
  if (!$('vPreguntar').hidden) tareas.push(api('preguntas').then(function (d) {
    PREGS = d.preguntas; pintarPreguntas();
  }));
  if (!$('vUsuarios').hidden) tareas.push(api('usuarios').then(function (d) { USU = d; pintarUsuarios(); }));
  if (!$('vPedir').hidden) tareas.push(api('inicio').then(function (d) {
    DATA.informes = d.informes; $('tAuto').hidden = !d.hay_automaticos;
    $('tTablero').hidden = !d.hay_tablero;
    $('tPreguntar').hidden = !d.puede_preguntar; pintarInformes();
  }));
  CLIENTES = null;                              // la lista de clientes se vuelve a pedir
  Promise.all(tareas).then(function () { toast('Actualizado'); })
    .catch(function (e) { toast(e.message || 'No pude actualizar.'); })
    .then(function () { setTimeout(function () { b.classList.remove('girando'); }, 400); });
}

function buscarVersion() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistration) return;
  navigator.serviceWorker.getRegistration().then(function (reg) { if (reg) reg.update(); })
    .catch(function () {});
}

// ---------------------------------------------------------------- pintar
function pintarEstado() {
  var r = DATA.robot || {}, e = $('estado'), t = $('estadoTxt'), av = $('aviso');
  e.className = 'estado ' + (r.en_linea ? 'on' : 'off');
  if (r.en_linea) {
    t.textContent = r.ocupado ? 'Trabajando' : 'Conectado';
    av.style.display = 'none';
  } else {
    t.textContent = 'Sin conexión';
    av.innerHTML = '⚠️ La notebook no responde' + (r.ultimo ? ' desde ' + esc(hora(r.ultimo)) : '') +
      '. Podés dejar el pedido igual: se genera cuando vuelva.';
    av.style.display = 'block';
  }
}

function pintarInformes() {
  var porRubro = {}, orden = [];
  DATA.informes.forEach(function (i) {
    var r = i.rubro || 'Otros';
    if (!porRubro[r]) { porRubro[r] = []; orden.push(r); }
    porRubro[r].push(i);
  });
  if (!orden.length) { $('vPedir').innerHTML = '<div class="vacio">Todavía no hay informes habilitados para vos.</div>'; return; }
  $('vPedir').innerHTML = orden.map(function (r) {
    return '<div class="rubro">' + esc(r) + '</div><div class="grilla">' + porRubro[r].map(function (i) {
      return '<button class="inf' + (critico(i) ? ' critico' : '') + '" onclick="abrir(\'' + esc(i.clave) + '\')">' +
        '<span class="ico">' + esc(i.dibujo || '📄') + '</span><span class="nom">' + esc(i.nombre) + '</span></button>';
    }).join('') + '</div>';
  }).join('');
}

function pintarPedidos() {
  var p = DATA.pedidos, activos = p.filter(function (x) { return x.estado === 'pendiente' || x.estado === 'generando'; }).length;
  var c = $('cont'); c.textContent = activos; c.style.display = activos ? 'block' : 'none';
  if (!p.length) { $('vMios').innerHTML = '<div class="vacio">Acá aparecen los informes que pidas.</div>'; return; }
  var nombres = { pendiente: 'En cola', generando: 'Generando…', listo: 'Listo', error: 'Error', cancelado: 'Cancelado' };
  $('vMios').innerHTML = p.map(function (x) {
    var acc = x.archivos.map(function (a, n) {
      var xl = /\.xlsx?$/i.test(a.nombre);
      return '<button class="btn" onclick="bajar(\'' + esc(x.id) + '\',' + n + ',this)">' +
        (xl ? '📊 Abrir Excel' : '📄 Abrir PDF') + '</button>';
    }).join('');
    if (x.estado === 'pendiente') acc += '<button class="btn sec" onclick="cancelar(\'' + esc(x.id) + '\')">Cancelar</button>';
    if (x.estado === 'listo' || x.estado === 'error') acc += '<button class="btn sec" onclick="repetir(\'' + esc(x.id) + '\')">↻ Repetir</button>';
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' + esc(x.informe) + '</span>' +
      '<span class="badge b-' + esc(x.estado) + '">' + (nombres[x.estado] || esc(x.estado)) + '</span></div>' +
      '<div class="ped-sub">' + esc(hora(x.creado)) + (x.detalle ? ' · ' + esc(x.detalle) : '') + '</div>' +
      (x.mensaje ? '<div class="ped-msg">' + esc(x.mensaje) + '</div>' : '') +
      (acc ? '<div class="ped-acc">' + acc + '</div>' : '') + '</div>';
  }).join('');
}

var VISTAS = { pedir: ['vPedir', 'tPedir'], auto: ['vAuto', 'tAuto'], tablero: ['vTablero', 'tTablero'],
               preguntar: ['vPreguntar', 'tPreguntar'],
               mios: ['vMios', 'tMios'], usuarios: ['vUsuarios', 'tUsuarios'] };
function ver(v) {
  for (var k in VISTAS) {
    $(VISTAS[k][0]).hidden = k !== v;
    $(VISTAS[k][1]).className = k === v ? 'act' : '';
  }
  if (v === 'auto') cargarAutomaticos();
  if (v === 'tablero') cargarTablero();
  if (v === 'preguntar') { pintarPreguntas(); cargarPreguntas(); }
  if (v === 'usuarios') cargarUsuarios();
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- automáticos
function fechaCorta(ms) {
  var d = new Date(ms);
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) + ' · ' +
         d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function claveAutos() {
  return 'autos_' + ((DATA.usuario && DATA.usuario.email) || '');
}
function cargarAutomaticos() {
  // Pedirle la lista al servidor tarda (recorre las carpetas de Drive). Mientras tanto se
  // muestra lo último que se vio, guardado en el celular, y cuando llega lo nuevo se
  // repinta. Así la pantalla abre al toque en vez de quedar en blanco. (03/11/2026)
  if (!AUTOS) {
    try {
      var g = localStorage.getItem(claveAutos());
      if (g) AUTOS = JSON.parse(g);
    } catch (e) { /* sin guardado: se espera al servidor */ }
  }
  if (AUTOS && AUTOS.length) pintarAutomaticos(true);
  else $('vAuto').innerHTML = '<div class="vacio">Buscando lo último…</div>';
  api('automaticos').then(function (d) {
    AUTOS = d.informes;
    try { localStorage.setItem(claveAutos(), JSON.stringify(AUTOS)); } catch (e) { /* no es grave */ }
    pintarAutomaticos();
  }).catch(function (e) {
    if (!(AUTOS && AUTOS.length)) {
      $('vAuto').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>';
    }
  });
}
// ---------------------------------------------------------------- tablero de ventas
// Los números salen de tablero_ventas.json, que el servidor rearma todas las noches del
// libro "Vtas diarias por local por mes". Acá no se pide nada a 3C: solo se dibuja.
var TAB = null, TAB_MES = -1, TAB_LOCAL = -1;   // -1 en local = todos los locales juntos
var PANEL = null, TAB_VISTA = 'dia';           // 'dia' = el informe de ayer, 'proy' = la proyección

function guita(n) {
  var s = Math.round(Math.abs(n)).toString();
  var o = '';
  for (var i = 0; i < s.length; i++) {
    o += s.charAt(i);
    var faltan = s.length - 1 - i;
    if (faltan > 0 && faltan % 3 === 0) o += '.';
  }
  return (n < 0 ? '-$' : '$') + o;
}
function corta(n) {                      // $12,3 M — para que entre en el celular
  var a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(1).replace('.', ',') + ' M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + ' k';
  return guita(n);
}
function porc(a, b) { return b ? (a / b - 1) * 100 : 0; }
function signo(p) { return (p >= 0 ? '+' : '') + p.toFixed(1).replace('.', ',') + '%'; }
// Si el año anterior es 0 (un local que todavía no existía, o que estuvo cerrado todo el
// período) no hay nada contra qué comparar: un "+0,0%" verde ahí miente.
function dif(a, b) { return b ? signo(porc(a, b)) : (a ? 'nuevo' : '—'); }
function claseDif(a, b) { return !b ? '' : (a >= b ? 'sube' : 'baja'); }

function verVista(v) { TAB_VISTA = v; cargarTablero(); window.scrollTo(0, 0); }

function tabsVista() {
  return '<div class="cual-tab">' +
    '<button class="' + (TAB_VISTA === 'dia' ? 'act' : '') + '" onclick="verVista(\'dia\')">Del día</button>' +
    '<button class="' + (TAB_VISTA === 'proy' ? 'act' : '') + '" onclick="verVista(\'proy\')">Proyección</button>' +
    '</div>';
}

function cargarPanel() {
  if (!PANEL) {
    try {
      var g = localStorage.getItem('panel_' + ((DATA.usuario && DATA.usuario.email) || ''));
      if (g) PANEL = JSON.parse(g);
    } catch (e) { /* sin guardado */ }
  }
  if (PANEL) pintarPanel(true);
  else $('vTablero').innerHTML = tabsVista() + '<div class="vacio">Buscando el informe…</div>';
  api('panel').then(function (d) {
    if (!d.panel) {
      if (!PANEL) $('vTablero').innerHTML = tabsVista() + '<div class="vacio">El panel todavía no se armó. ' +
        'En la planilla: Robot 3C › Rearmar el panel del informe diario.</div>';
      return;
    }
    PANEL = d.panel;
    try { localStorage.setItem('panel_' + ((DATA.usuario && DATA.usuario.email) || ''),
                               JSON.stringify(PANEL)); } catch (e) { /* no es grave */ }
    if (TAB_VISTA === 'dia') pintarPanel();
  }).catch(function (e) {
    if (!PANEL) $('vTablero').innerHTML = tabsVista() + '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

/** La primera hoja del informe diario: lo mismo que el PDF, pero vivo. */
function pintarPanel(guardado) {
  var p = PANEL;
  if (!p) { $('vTablero').innerHTML = tabsVista() + '<div class="vacio">Sin datos.</div>'; return; }
  var dg = claseDif(p.general.a, p.general.b);

  var hero = '<div class="hero"><div class="r">Total general acumulado</div>' +
    '<div class="v">' + guita(p.general.a) + '</div>' +
    '<div class="d ' + dg + '">' + dif(p.general.a, p.general.b) +
      ' <span>vs ' + guita(p.general.b) + '</span></div>' +
    '<div class="partes">' +
      '<div><div class="pr">Minorista</div><div class="pv">' + corta(p.minorista.a) + '</div></div>' +
      '<div><div class="pr">Mayorista</div><div class="pv">' + corta(p.mayorista.a) + '</div></div>' +
    '</div></div>';

  var ayerMay = (p.ayer.general || 0) - (p.ayer.minorista || 0);
  var kpis = '<div class="kpis" style="margin-top:10px">' +
    '<div class="kpi"><div class="r">Minorista mes</div><div class="v">' + corta(p.minorista.a) + '</div>' +
      '<div class="d ' + claseDif(p.minorista.a, p.minorista.b) + '">' +
      dif(p.minorista.a, p.minorista.b) + '</div></div>' +
    '<div class="kpi"><div class="r">Mayorista mes</div><div class="v">' + corta(p.mayorista.a) + '</div>' +
      '<div class="d ' + claseDif(p.mayorista.a, p.mayorista.b) + '">' +
      dif(p.mayorista.a, p.mayorista.b) + '</div></div>' +
    '<div class="kpi"><div class="r">Ayer minorista</div><div class="v">' +
      corta(p.ayer.minorista || 0) + '</div>' +
      '<div class="d" style="color:var(--muted)">mayorista ' + corta(ayerMay) + '</div></div>' +
    '</div>';

  $('vTablero').innerHTML = tabsVista() +
    '<div class="tit-tablero">Ventas del ' + esc(p.fecha || '') + '</div>' +
    '<div class="ped-sub" style="margin:-6px 0 10px">Acumulado ' + esc(p.periodo) +
      ' contra ' + esc(p.periodoAnt) + ' · Excel al ' + esc(p.al || '') +
      (guardado ? ' · buscando novedades…' : '') + '</div>' +
    hero + kpis + sucursalesPanel(p) + canalesPanel(p) + cobrosPanel(p) + ayerPanel(p);
}

function sucursalesPanel(p) {
  var tope = 0;
  p.sucursales.forEach(function (s) { tope = Math.max(tope, s.a, s.b); });
  if (!tope) return '';
  var filas = p.sucursales.slice().sort(function (x, y) { return y.a - x.a; });
  var ALTO = 30, ancho = 360;
  var s = '<svg viewBox="0 0 ' + ancho + ' ' + (filas.length * ALTO) + '" role="img" aria-label="Ventas por sucursal">';
  filas.forEach(function (f, i) {
    var y = i * ALTO, cl = claseDif(f.a, f.b);
    s += '<text x="0" y="' + (y + 10) + '" font-size="11.5" font-weight="700" fill="var(--ink)">' +
         esc(f.n) + '</text>';
    s += '<text x="212" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" font-weight="700" ' +
         'fill="var(--ink)">' + corta(f.a) + '</text>';
    s += '<text x="292" y="' + (y + 10) + '" text-anchor="end" font-size="11" fill="var(--muted)">' +
         (f.b ? corta(f.b) : '—') + '</text>';
    s += '<text x="' + ancho + '" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" ' +
         'font-weight="800" fill="' + (cl === 'sube' ? 'var(--ok)' : cl === 'baja' ? 'var(--bad)' :
         'var(--muted)') + '">' + dif(f.a, f.b) + '</text>';
    s += '<rect x="0" y="' + (y + 15) + '" width="' + Math.max(ancho * (f.a / tope), 1) +
         '" height="6" rx="3" fill="var(--accent)"/>';
    s += '<rect x="0" y="' + (y + 23) + '" width="' + Math.max(ancho * (f.b / tope), 1) +
         '" height="3" rx="1.5" fill="var(--line-fuerte)"/>';
  });
  s += '</svg>';
  return '<div class="graf"><h4>Por sucursal · acumulado del mes</h4>' +
    '<div class="ped-sub">Este año · año anterior · diferencia.</div>' + s +
    '<div class="leyenda"><span><i style="background:var(--accent)"></i>Este año</span>' +
    '<span><i style="background:var(--line-fuerte)"></i>Año anterior</span></div></div>';
}

function canalesPanel(p) {
  if (!p.canales.length) return '';
  var f = p.canales.map(function (c) {
    return '<tr><td>' + esc(c.n) + '</td><td class="num">' + guita(c.a) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(c.b) + '</td>' +
      '<td class="num ' + claseDif(c.a, c.b) + '">' + dif(c.a, c.b) + '</td></tr>';
  }).join('');
  f += '<tr style="font-weight:800"><td>Total mayorista</td><td class="num">' + guita(p.mayorista.a) +
       '</td><td class="num">' + guita(p.mayorista.b) + '</td><td class="num ' +
       claseDif(p.mayorista.a, p.mayorista.b) + '">' + dif(p.mayorista.a, p.mayorista.b) + '</td></tr>';
  f += '<tr><td style="color:var(--muted)">Cobrado mayorista</td><td class="num">' +
       guita(p.mayorista.cobrado || 0) + '</td><td colspan="2" class="num ' +
       ((p.mayorista.dif || 0) < 0 ? 'baja' : 'sube') + '">' +
       guita(p.mayorista.dif || 0) + ' vs facturado</td></tr>';
  return '<div class="graf"><h4>Mayorista por canal</h4>' +
    '<table class="tdias"><tr><th>Canal</th><th>Este año</th><th>Año ant.</th><th>Dif.</th></tr>' +
    f + '</table></div>';
}

function cobrosPanel(p) {
  var c = p.cobros || {};
  if (!c.total) return '';
  var COLORES = ['var(--accent)', 'var(--brand)', 'var(--accent-claro)', 'var(--tenue)', 'var(--warn)'];
  function bloque(titulo, lista) {
    if (!lista || !lista.length) return '';
    var tot = lista.reduce(function (s, x) { return s + x.v; }, 0);
    if (!tot) return '';
    var barra = '<div class="mezcla">' + lista.map(function (x, i) {
      return '<div style="width:' + (100 * x.v / tot).toFixed(1) + '%;background:' +
             COLORES[i % COLORES.length] + '"></div>';
    }).join('') + '</div>';
    var det = '<div class="mez-lista">' + lista.map(function (x, i) {
      return '<div class="f"><i style="background:' + COLORES[i % COLORES.length] + '"></i>' +
        '<span class="n">' + esc(x.n) + '</span><b>' + guita(x.v) + '</b>' +
        '<span class="p">' + (100 * x.v / tot).toFixed(0) + '%</span></div>';
    }).join('') + '</div>';
    return '<div class="sub" style="margin-top:14px">' + titulo + '</div>' + barra + det;
  }
  return '<div class="graf"><h4>Cobros del día</h4>' +
    bloque('Minorista', c.minorista) + bloque('Mayorista', c.mayorista) +
    '<div class="total-linea"><span>Total cobrado</span><b>' + guita(c.total) + '</b></div></div>';
}

function ayerPanel(p) {
  if (!p.ayer.sucursales || !p.ayer.sucursales.length) return '';
  var f = p.ayer.sucursales.slice().sort(function (x, y) { return y.v - x.v; }).map(function (s) {
    var caja = s.caja === undefined || s.caja === 0 ? '<span style="color:var(--tenue)">—</span>'
      : '<span class="' + (s.caja > 0 ? 'sube' : 'baja') + '">' +
        (s.caja > 0 ? 'Sobra ' : 'Falta ') + guita(s.caja) + '</span>';
    return '<tr><td>' + esc(s.n) + '</td><td class="num">' + guita(s.v) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + s.art + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(s.ticket) + '</td>' +
      '<td class="num">' + caja + '</td></tr>';
  }).join('');
  f += '<tr style="font-weight:800"><td>Total minorista</td><td class="num">' +
       guita(p.ayer.minorista || 0) + '</td><td colspan="3"></td></tr>';
  return '<div class="graf"><h4>Ventas de ayer por sucursal</h4>' +
    '<div class="ped-sub">Artículos acumulados del mes y ticket promedio del día.</div>' +
    '<table class="tdias"><tr><th>Sucursal</th><th>Venta</th><th>Art.</th><th>Ticket</th>' +
    '<th>Caja</th></tr>' + f + '</table></div>';
}

function cargarTablero() {
  if (TAB_VISTA === 'dia') return cargarPanel();
  if (!TAB) {
    try {
      var g = localStorage.getItem('tablero_' + ((DATA.usuario && DATA.usuario.email) || ''));
      if (g) TAB = JSON.parse(g);
    } catch (e) { /* sin guardado */ }
  }
  if (TAB) pintarTablero(true);
  else $('vTablero').innerHTML = '<div class="vacio">Buscando los números…</div>';
  api('tablero').then(function (d) {
    if (!d.tablero) {
      if (!TAB) $('vTablero').innerHTML = '<div class="vacio">El tablero todavía no se armó. ' +
        'En la planilla: Robot 3C › Rearmar el tablero de ventas.</div>';
      return;
    }
    TAB = d.tablero; TAB_MES = -1;
    try { localStorage.setItem('tablero_' + ((DATA.usuario && DATA.usuario.email) || ''),
                               JSON.stringify(TAB)); } catch (e) { /* no es grave */ }
    pintarTablero();
  }).catch(function (e) {
    if (!TAB) $('vTablero').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>';
  });
}

/** Suma de un día: todos los locales, o el elegido. Devuelve null si ese día no corrió. */
function diaTotal(dia, cual, campo) {
  var v = dia[campo];
  if (!v) return null;
  if (cual >= 0) return v[cual];
  var s = 0;
  for (var i = 0; i < v.length; i++) s += v[i];
  return s;
}

function mesTablero() {
  if (!TAB || !TAB.meses.length) return null;
  if (TAB_MES < 0 || TAB_MES >= TAB.meses.length) {
    TAB_MES = 0;                                   // el último mes con datos cargados
    for (var i = TAB.meses.length - 1; i >= 0; i--) {
      var m = TAB.meses[i], hay = false;
      for (var j = 0; j < m.dias.length; j++) if (m.dias[j].a) hay = true;
      if (hay) { TAB_MES = i; break; }
    }
  }
  return TAB.meses[TAB_MES];
}

function verMes(i) { TAB_MES = i; pintarTablero(); window.scrollTo(0, 0); }
function verLocal(i) { TAB_LOCAL = i; pintarTablero(); }

function pintarTablero(guardado) {
  var m = mesTablero();
  if (!m) { $('vTablero').innerHTML = '<div class="vacio">No hay datos todavía.</div>'; return; }
  var loc = TAB.locales, cual = TAB_LOCAL;

  // ---- acumulados: solo los días que ya corrieron, para comparar peras con peras
  var actual = 0, base = 0, baseMes = 0, dias = 0, corridos = [];
  for (var i = 0; i < m.dias.length; i++) {
    var d = m.dias[i];
    baseMes += diaTotal(d, cual, 'b') || 0;
    if (d.a) {
      actual += diaTotal(d, cual, 'a'); base += diaTotal(d, cual, 'b') || 0;
      dias++; corridos.push(d);
    }
  }
  var proy = base * (1 + TAB.pct);
  var proyMes = baseMes * (1 + TAB.pct);

  var titulo = '<div class="tit-tablero">Ventas Minoristas · Proyección</div>';
  var chips = '<div class="meses">' + TAB.meses.map(function (x, i) {
    return '<button class="mes-chip' + (i === TAB_MES ? ' act' : '') + '" onclick="verMes(' + i + ')">' +
           esc(x.titulo.charAt(0).toUpperCase() + x.titulo.slice(1)) + '</button>';
  }).join('') + '</div>';

  var filtro = '<div class="filtro-local">' +
    '<button class="chip' + (cual < 0 ? ' act' : '') + '" onclick="verLocal(-1)">Todos</button>' +
    loc.map(function (n, i) {
      return '<button class="chip' + (i === cual ? ' act' : '') + '" onclick="verLocal(' + i + ')">' +
             esc(n) + '</button>';
    }).join('') + '</div>';

  var kpis = '<div class="kpis" style="margin-top:10px">' +
    '<div class="kpi"><div class="r">Venta</div><div class="v">' + corta(actual) + '</div>' +
      '<div class="d" style="color:var(--muted)">' + dias + (dias === 1 ? ' día' : ' días') + '</div></div>' +
    '<div class="kpi"><div class="r">Año anterior</div><div class="v">' + corta(base) + '</div>' +
      '<div class="d ' + claseDif(actual, base) + '">' + dif(actual, base) + '</div></div>' +
    '<div class="kpi"><div class="r">Proyectado</div><div class="v">' + corta(proy) + '</div>' +
      '<div class="d ' + claseDif(actual, proy) + '">' + dif(actual, proy) + '</div></div>' +
    '</div>';

  var cerrado = dias >= m.dias.length;
  var pie = '<div class="ped-sub" style="margin:0 0 10px">' +
    (cerrado ? 'Mes completo.' : 'Van ' + dias + ' de ' + m.dias.length + ' días. ' +
      'Si sigue así, el mes cierra cerca de ' + corta(baseMes * (base ? actual / base : 1)) +
      ' (proyectado ' + corta(proyMes) + ').') +
    ' · Libro al ' + esc(TAB.al) + (guardado ? ' · buscando novedades…' : '') + '</div>';

  $('vTablero').innerHTML = tabsVista() + titulo + chips + filtro + pie + mandoPct() +
    grafLocales(m) + kpis + tablaDias(m, corridos);
  // el mes elegido suele ser el último: centrarlo en la tira, sin tocar el scroll de la página
  var tira = $('vTablero').querySelector('.meses');
  var elegido = tira && tira.querySelector('.mes-chip.act');
  if (tira && elegido) {   // con rectángulos: offsetLeft se mide contra otro contenedor
    var rt = tira.getBoundingClientRect(), re = elegido.getBoundingClientRect();
    tira.scrollLeft += (re.left - rt.left) - (rt.width - re.width) / 2;
  }
}

/** El % de incremento con el que se proyecta la venta. Lo cambian los administradores. */
function mandoPct() {
  var pct = (TAB.pct * 100).toFixed(1).replace('.', ',').replace(',0', '');
  var admin = DATA.usuario && DATA.usuario.rol === 'admin';
  if (!admin) return '<div class="proy">Proyección: <b>+' + pct + '%</b> sobre el año anterior</div>';
  return '<div class="proy">Proyección sobre el año anterior:' +
    '<button onclick="cambiarPct(-1)" aria-label="Bajar">−</button>' +
    '<b>+' + pct + '%</b>' +
    '<button onclick="cambiarPct(1)" aria-label="Subir">+</button></div>';
}
var timerPct = null;
function cambiarPct(d) {
  var n = Math.round(TAB.pct * 100) + d;
  if (n < 0 || n > 200) return;
  TAB.pct = n / 100;
  pintarTablero();
  clearTimeout(timerPct);
  timerPct = setTimeout(function () {          // se guarda una sola vez, al dejar de tocar
    api('pct_tablero', { pct: TAB.pct }).then(function () {
      try { localStorage.setItem('tablero_' + ((DATA.usuario && DATA.usuario.email) || ''),
                                 JSON.stringify(TAB)); } catch (e) { /* no es grave */ }
      toast('Proyección guardada');
    }).catch(function (e) { toast(e.message || e); });
  }, 900);
}

/** Barras horizontales: cada local, lo que vendió contra el mismo período del año anterior. */
function grafLocales(m) {
  var loc = TAB.locales, filas = [], tope = 0;
  for (var i = 0; i < loc.length; i++) {
    var a = 0, b = 0;
    for (var j = 0; j < m.dias.length; j++) {
      if (!m.dias[j].a) continue;
      a += m.dias[j].a[i]; b += m.dias[j].b[i];
    }
    filas.push({ n: loc[i], a: a, b: b });
    tope = Math.max(tope, a, b);
  }
  if (!tope) return '';
  filas.sort(function (x, y) { return y.a - x.a; });
  var ALTO = 30, ancho = 360, xBar = 0, anchoBar = 360;
  var s = '<svg viewBox="0 0 ' + ancho + ' ' + (filas.length * ALTO) + '" role="img" aria-label="Venta por local">';
  filas.forEach(function (f, i) {
    var y = i * ALTO;
    var cl = claseDif(f.a, f.b);
    // primero se lee: nombre - importe - porcentaje; la barra va abajo, fina
    s += '<text x="0" y="' + (y + 10) + '" font-size="11.5" font-weight="700" fill="var(--ink)">' +
         esc(f.n) + '</text>';
    s += '<text x="212" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" font-weight="700" ' +
         'fill="var(--ink)">' + corta(f.a) + '</text>';
    s += '<text x="292" y="' + (y + 10) + '" text-anchor="end" font-size="11" ' +
         'fill="var(--muted)">' + (f.b ? corta(f.b) : '—') + '</text>';
    s += '<text x="' + ancho + '" y="' + (y + 10) + '" text-anchor="end" font-size="11.5" ' +
         'font-weight="800" fill="' + (cl === 'sube' ? 'var(--ok)' : cl === 'baja' ? 'var(--bad)' :
         'var(--muted)') + '">' + dif(f.a, f.b) + '</text>';
    var la = anchoBar * (f.a / tope), lb = anchoBar * (f.b / tope);
    s += '<rect x="' + xBar + '" y="' + (y + 15) + '" width="' + Math.max(la, 1) +
         '" height="6" rx="3" fill="var(--accent)"/>';
    s += '<rect x="' + xBar + '" y="' + (y + 23) + '" width="' + Math.max(lb, 1) +
         '" height="3" rx="1.5" fill="var(--line-fuerte)"/>';
  });
  s += '</svg>';
  return '<div class="graf"><h4>Por local</h4>' +
    '<div class="ped-sub">Este año · año anterior · diferencia. Mismos días del año anterior.</div>' + s +
    '<div class="leyenda"><span><i style="background:var(--accent)"></i>Este año</span>' +
    '<span><i style="background:var(--line-fuerte)"></i>Año anterior</span></div></div>';
}

function tablaDias(m, corridos) {
  if (!corridos.length) return '';
  var cual = TAB_LOCAL;
  var f = corridos.slice().reverse().map(function (d) {
    var a = diaTotal(d, cual, 'a');
    var b = diaTotal(d, cual, 'b') || 0;
    var pr = b * (1 + TAB.pct);
    return '<tr><td>' + d.d + '</td>' +
      '<td class="num">' + guita(a) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(pr) + '</td>' +
      '<td class="num" style="color:var(--muted)">' + guita(b) + '</td>' +
      '<td class="num ' + claseDif(a, pr) + '">' + dif(a, pr) + '</td></tr>';
  }).join('');
  return '<div class="graf"><h4>Día por día</h4>' +
    '<div class="ped-sub">El porcentaje compara la venta contra lo proyectado.</div>' +
    '<table class="tdias"><tr><th>Día</th><th>Venta</th><th>Proyect.</th>' +
    '<th>Año ant.</th><th>Dif.</th></tr>' + f + '</table></div>';
}

var ETIQUETA_ESTADO = { ok: ['b-listo', 'Llegó hoy'], esperando: ['b-pendiente', 'Pendiente'],
                        falta: ['b-error', 'No llegó'] };

/** Resumen de arriba: qué informes de hoy llegaron y cuáles no. */
function resumenHoy() {
  var faltan = [], esperando = [], llegaron = 0, control = 0;
  AUTOS.forEach(function (a) {
    if (!a.estado || a.estado === 'na') return;
    control++;
    if (a.estado === 'ok') llegaron++;
    else if (a.estado === 'falta') faltan.push(a.nombre);
    else esperando.push(a.nombre);
  });
  if (!control) return '';
  var clase = faltan.length ? 'hoy-mal' : (esperando.length ? 'hoy-espera' : 'hoy-bien');
  var titulo = faltan.length ? 'Falta el informe de hoy'
             : (esperando.length ? 'Al día, con informes pendientes' : 'Todos los informes de hoy llegaron');
  var detalle = faltan.length ? faltan.join(' · ')
              : (esperando.length ? 'Todavía no corrió: ' + esperando.join(' · ')
                                  : llegaron + ' de ' + control);
  return '<div class="hoy ' + clase + '"><span class="hoy-t">' + esc(titulo) + '</span>' +
         '<span class="hoy-d">' + esc(detalle) + '</span></div>';
}

function pintarAutomaticos(guardado) {
  if (!AUTOS || !AUTOS.length) {
    $('vAuto').innerHTML = '<div class="vacio">No tenés informes automáticos habilitados.</div>'; return;
  }
  var aviso = guardado ? '<div class="ped-sub" style="margin:-4px 0 10px">Mostrando lo último que viste · buscando novedades…</div>' : '';
  $('vAuto').innerHTML = resumenHoy() + aviso + AUTOS.map(function (a) {
    var arch = a.archivos.length ? a.archivos.map(function (f) {
      return '<button class="btn sec arch" onclick="bajarAuto(\'' + esc(a.clave) + '\',\'' +
        esc(f.fid) + '\',this)"><span class="arch-nom">' + esc(f.titulo || f.nombre) + '</span>' +
        '<span class="arch-fecha">' + esc(fechaCorta(f.fecha)) + '</span></button>';
    }).join('') : '<div class="ped-sub">Todavía no llegó ninguno.</div>';
    var e = ETIQUETA_ESTADO[a.estado];
    var marca = e ? '<span class="badge ' + e[0] + '">' + e[1] + '</span>' : '';
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' +
      esc(a.dibujo || '📄') + ' ' + esc(a.nombre) + '</span>' + marca + '</div>' + arch + '</div>';
  }).join('');
}
function bajarAuto(clave, fid, boton) {
  var txt = boton.innerHTML;
  boton.disabled = true; boton.textContent = 'Abriendo…';
  api('archivo_auto', { clave: clave, fid: fid }).then(function (a) { guardarArchivo(a); })
    .catch(function (e) { toast(e.message || 'No pude abrir el archivo.'); })
    .then(function () { boton.disabled = false; boton.innerHTML = txt; });
}

// ---------------------------------------------------------------- preguntar
var EJEMPLOS = ['¿Cuánto me debe Bustorf?', '¿Qué locales vendieron más este mes?',
                '¿Cuánto vendimos ayer?', '¿Qué cheques tengo que ingresar esta semana?'];

function pintarPreguntas() {
  var h = '<div class="preg-caja">' +
    '<textarea id="fPreg" rows="2" placeholder="Preguntá sobre ventas, clientes, saldos o stock…" ' +
    'oninput="autoAlto(this)" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();enviarPregunta();}"></textarea>' +
    '<button class="btn" id="bPreg" onclick="enviarPregunta()">Preguntar</button></div>';
  if (!PREGS.length) {
    h += '<div class="rubro">Para probar</div><div class="chips">' +
      EJEMPLOS.map(function (e) {
        return '<span class="chip" onclick="ponerPregunta(this)">' + esc(e) + '</span>';
      }).join('') + '</div>';
  }
  h += PREGS.map(function (p) {
    var cuerpo;
    if (p.estado === 'listo') cuerpo = '<div class="preg-resp">' + esc(p.respuesta) + '</div>';
    else if (p.estado === 'error') cuerpo = '<div class="preg-resp error">' + esc(p.respuesta ||
      'No pude responder.') + '</div>';
    else cuerpo = '<div class="preg-resp pensando">Pensando…</div>';
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' + esc(p.pregunta) + '</span>' +
      '<span class="arch-fecha">' + esc(fechaCorta(p.creado)) + '</span></div>' + cuerpo + '</div>';
  }).join('');
  $('vPreguntar').innerHTML = h;
}

function autoAlto(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 150) + 'px'; }
function ponerPregunta(c) { $('fPreg').value = c.textContent; $('fPreg').focus(); }

function cargarPreguntas() {
  api('preguntas').then(function (d) {
    PREGS = d.preguntas; pintarPreguntas(); programarPreguntas();
  }).catch(function () {});
}
function programarPreguntas() {
  clearTimeout(timerPreg);
  if ($('vPreguntar').hidden) return;
  var activa = PREGS.some(function (p) { return p.estado === 'pendiente' || p.estado === 'pensando'; });
  timerPreg = setTimeout(cargarPreguntas, activa ? 4000 : 30000);
}
function enviarPregunta() {
  var t = ($('fPreg').value || '').trim();
  if (!t) return;
  var b = $('bPreg');
  b.disabled = true; b.textContent = 'Enviando…';
  api('preguntar', { pregunta: t }).then(function (d) {
    PREGS = d.preguntas; pintarPreguntas(); programarPreguntas();
    // le avisa al servidor que arranque ya; si contesta la notebook, no hace nada
    api('pensar').catch(function () {});
    if (!d.robot.en_linea && !d.nube) toast('La notebook no responde: contesta cuando vuelva.');
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Preguntar'; toast(e.message || e);
  });
}

// ---------------------------------------------------------------- usuarios (admin)
function cargarUsuarios() {
  $('vUsuarios').innerHTML = '<div class="vacio">Cargando…</div>';
  api('usuarios').then(function (d) { USU = d; pintarUsuarios(); })
    .catch(function (e) { $('vUsuarios').innerHTML = '<div class="vacio">' + esc(e.message || e) + '</div>'; });
}
function cuantos(txt, total) {
  if (txt === '*') return 'todos';
  if (!txt) return 'ninguno';
  return txt.split(',').filter(String).length + ' de ' + total;
}
function pintarUsuarios() {
  var h = USU.usuarios.map(function (p, n) {
    return '<div class="pedido"><div class="ped-top"><span class="ped-nom">' + esc(p.nombre || p.email) + '</span>' +
      '<span class="badge ' + (!p.activo ? 'b-error' : (p.rol === 'admin' ? 'b-generando' : 'b-listo')) + '">' +
      (!p.activo ? 'Inactivo' : (p.rol === 'admin' ? 'Administrador' : 'Usuario')) + '</span></div>' +
      '<div class="ped-sub">' + esc(p.email) + '</div>' +
      '<div class="ped-sub">Informes: ' + esc(cuantos(p.informes, USU.catalogo.length)) +
      ' · Automáticos: ' + esc(cuantos(p.automaticos, USU.automaticos.length)) +
      ' · Carpetas: ' + esc(p.carpetas ? cuantos(p.carpetas, (USU.carpetas || []).length) : 'ninguna') +
      '</div>' +
      '<div class="ped-acc"><button class="btn sec" onclick="editarUsuario(' + n + ')">Editar</button></div></div>';
  }).join('');
  h += '<div class="ped-acc" style="margin-top:14px"><button class="btn" onclick="editarUsuario(-1)">+ Agregar persona</button></div>';
  $('vUsuarios').innerHTML = h;
}
function casillas(lista, permitidos, prefijo) {
  var todos = permitidos === '*';
  var ok = todos ? [] : String(permitidos || '').split(',').map(function (x) { return x.trim(); });
  return lista.map(function (i) {
    return '<label class="chk"><input type="checkbox" class="' + prefijo + '" value="' + esc(i.clave) + '"' +
      (todos || ok.indexOf(i.clave) >= 0 ? ' checked' : '') + '>' + esc(i.nombre) + '</label>';
  }).join('');
}
function editarUsuario(n) {
  var p = n < 0 ? { nombre: '', email: '', rol: 'usuario', informes: '', automaticos: '',
                    carpetas: '', activo: true }
                : USU.usuarios[n];
  EDIT = p;
  var porRubro = {}, orden = [];
  USU.catalogo.forEach(function (i) {
    var r = i.rubro || 'Otros';
    if (!porRubro[r]) { porRubro[r] = []; orden.push(r); }
    porRubro[r].push(i);
  });
  var h = '<h2>' + (n < 0 ? 'Agregar persona' : esc(p.nombre || p.email)) + '</h2>';
  h += '<label>Nombre</label><input id="uNombre" value="' + esc(p.nombre) + '" placeholder="Cómo lo ve ella o él">';
  h += '<label>Mail de Google</label><input id="uMail" type="email" autocapitalize="off" value="' + esc(p.email) + '"' +
       (n < 0 ? ' placeholder="persona@gmail.com"' : ' disabled') + '>';
  h += '<div class="chks"><label class="chk"><input type="checkbox" id="uAdmin"' + (p.rol === 'admin' ? ' checked' : '') +
       '>Administrador</label><label class="chk"><input type="checkbox" id="uActivo"' + (p.activo ? ' checked' : '') +
       '>Puede entrar</label></div>';
  h += '<div class="sub">Informes a pedido</div><div class="chks">' +
       '<label class="chk"><input type="checkbox" onclick="marcarTodo(this, \'ci\')">Todos</label></div>';
  orden.forEach(function (r) {
    h += '<div class="sub" style="font-size:11.5px;margin-top:10px">' + esc(r) + '</div><div class="chks">' +
         casillas(porRubro[r], p.informes, 'ci') + '</div>';
  });
  h += '<div class="sub">Informes automáticos</div><div class="chks">' +
       '<label class="chk"><input type="checkbox" onclick="marcarTodo(this, \'ca\')">Todos</label></div>' +
       '<div class="chks">' + casillas(USU.automaticos, p.automaticos, 'ca') + '</div>';
  if ((USU.carpetas || []).length) {
    h += '<div class="sub">Carpetas de Drive que puede consultar</div>' +
         '<div class="ped-sub">El asistente solo busca adentro de las que tildes. ' +
         'Sin ninguna, no accede a Drive.</div><div class="chks">' +
         '<label class="chk"><input type="checkbox" onclick="marcarTodo(this, \'cd\')">Todas</label></div>' +
         '<div class="chks">' + casillas(USU.carpetas, p.carpetas, 'cd') + '</div>';
  }
  h += '<div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
       '<button class="btn" id="bGuardar" onclick="guardarUsuario()">Guardar</button></div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
}
function marcarTodo(c, clase) {
  var l = document.getElementsByClassName(clase);
  for (var i = 0; i < l.length; i++) l[i].checked = c.checked;
}
function marcadas(clase) {
  var l = document.getElementsByClassName(clase), out = [];
  for (var i = 0; i < l.length; i++) if (l[i].checked) out.push(l[i].value);
  return out;
}
function guardarUsuario() {
  var b = $('bGuardar');
  b.disabled = true; b.textContent = 'Guardando…';
  var inf = marcadas('ci'), aut = marcadas('ca'), car = marcadas('cd');
  api('guardar_usuario', {
    email: EDIT.email || $('uMail').value,
    nombre: $('uNombre').value,
    rol: $('uAdmin').checked ? 'admin' : 'usuario',
    activo: $('uActivo').checked,
    informes: inf.length === USU.catalogo.length ? '*' : inf,
    automaticos: aut.length === USU.automaticos.length ? '*' : aut,
    carpetas: car.length === (USU.carpetas || []).length && car.length ? '*' : car
  }).then(function (d) {
    USU = d; cerrarHoja(); pintarUsuarios(); toast('Guardado');
  }).catch(function (e) {
    b.disabled = false; b.textContent = 'Guardar'; toast(e.message || e);
  });
}

// ---------------------------------------------------------------- archivos
function bajar(id, indice, boton) {
  var txt = boton.textContent;
  boton.disabled = true; boton.textContent = 'Abriendo…';
  api('archivo', { id: id, indice: indice }).then(guardarArchivo)
    .catch(function (e) { toast(e.message || 'No pude abrir el archivo.'); })
    .then(function () { boton.disabled = false; boton.textContent = txt; });
}

function guardarArchivo(a) {
  var bin = atob(a.base64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], { type: a.tipo || 'application/octet-stream' }));
  var link = document.createElement('a');
  link.href = url; link.download = a.nombre; link.rel = 'noopener';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}

// ---------------------------------------------------------------- pedir
function abrir(clave) {
  var i = DATA.informes.filter(function (x) { return x.clave === clave; })[0];
  if (!i) return;
  ACTUAL = i; ELEGIDOS = []; confirmando = false;
  var hoy = new Date(), ayer = new Date(Date.now() - 86400000), ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var h = '<h2>' + esc(i.dibujo || '') + ' ' + esc(i.nombre) + '</h2><p class="desc">' + esc(i.desc) + '</p>';
  if (critico(i)) {
    h += '<div class="peligro-box">⚠️ ' + (i.confirmar
      ? 'Esta acción <b>escribe en el sistema 3C</b>. Solo vos podés ejecutarla y queda registrada.'
      : 'Esta acción actúa sobre el robot y queda registrada.') + '</div>';
  }
  var e = i.entrada || 'nada';
  if (e === 'cliente' || e === 'cliente_fechas') {
    h += '<label>Clientes</label><input id="fCli" placeholder="Nombre o número; podés sumar varios" ' +
         'autocomplete="off" oninput="buscarCli()"><div class="lista-cli" id="lCli"></div>' +
         '<div class="chips" id="eCli"></div>';
  }
  if (e === 'fechas' || e === 'cliente_fechas') {
    var d0 = e === 'fechas' ? ayer : ini, d1 = e === 'fechas' ? ayer : hoy;
    h += '<div class="fila2"><div><label>Desde</label><input type="date" id="fDesde" value="' + iso(d0) + '"></div>' +
         '<div><label>Hasta</label><input type="date" id="fHasta" value="' + iso(d1) + '"></div></div>' +
         '<div class="chips"><span class="chip" onclick="rango(\'hoy\')">Hoy</span>' +
         '<span class="chip" onclick="rango(\'ayer\')">Ayer</span>' +
         '<span class="chip" onclick="rango(\'mes\')">Este mes</span><span class="chip" onclick="rango(\'mesant\')">Mes anterior</span>' +
         '<span class="chip" onclick="rango(\'anio\')">Este año</span></div>';
  }
  if (e === 'texto' || e === 'texto_opcional') {
    h += '<label>' + esc(i.etiqueta || 'Detalle') + (e === 'texto_opcional' ? ' (opcional)' : '') + '</label>' +
         '<textarea id="fTxt" placeholder="' + esc(i.ayuda || '') + '"></textarea>';
  }
  if (i.confirmar) {
    h += '<label>Escribí ' + esc(i.confirmar) + ' para confirmar</label>' +
         '<input id="fConf" autocomplete="off" autocapitalize="characters" placeholder="' + esc(i.confirmar) + '">';
  }
  h += '<div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cerrar</button>' +
       '<button class="btn' + (critico(i) ? ' peligro' : '') + '" id="bPedir" onclick="enviar()">' +
       (critico(i) ? 'Ejecutar' : 'Pedir') + '</button></div>';
  $('hoja').innerHTML = h;
  $('velo').style.display = 'block';
  requestAnimationFrame(function () { $('hoja').className = 'hoja abierta'; });
  if (e === 'cliente' || e === 'cliente_fechas') cargarClientes();
}
function cerrarHoja() { $('hoja').className = 'hoja'; $('velo').style.display = 'none'; confirmando = false; }

function rango(q) {
  var h = new Date(), a, b;
  if (q === 'hoy') { a = b = h; }
  if (q === 'ayer') { a = b = new Date(Date.now() - 86400000); }
  if (q === 'mes') { a = new Date(h.getFullYear(), h.getMonth(), 1); b = h; }
  if (q === 'mesant') { a = new Date(h.getFullYear(), h.getMonth() - 1, 1); b = new Date(h.getFullYear(), h.getMonth(), 0); }
  if (q === 'anio') { a = new Date(h.getFullYear(), 0, 1); b = h; }
  $('fDesde').value = iso(a); $('fHasta').value = iso(b);
}

function cargarClientes() {
  if (CLIENTES) return;
  api('clientes').then(function (d) { CLIENTES = d.clientes; buscarCli(); }).catch(function () { CLIENTES = []; });
}
function buscarCli() {
  var inp = $('fCli'), l = $('lCli'); if (!inp || !l) return;
  var q = norm(inp.value).trim();
  if (!q) { l.style.display = 'none'; return; }
  if (!CLIENTES) { l.innerHTML = '<div><small>Cargando clientes…</small></div>'; l.style.display = 'block'; return; }
  var pal = q.split(/\s+/);
  var r = CLIENTES.filter(function (c) {
    if (/^\d+$/.test(q)) return c[0] === q;
    var n = norm(c[1]); return pal.every(function (p) { return n.indexOf(p) >= 0; });
  }).slice(0, 30);
  l.innerHTML = r.length ? r.map(function (c) {
    var ya = ELEGIDOS.some(function (x) { return x[0] === c[0]; });
    return '<div onclick="elegirCli(\'' + esc(c[0]) + '\')">' + (ya ? '✓ ' : '') + esc(c[1]) +
      ' <small>N° ' + esc(c[0]) + '</small></div>';
  }).join('') : '<div><small>No encontré clientes con eso.</small></div>';
  l.style.display = 'block';
}
function elegirCli(cod) {
  var c = CLIENTES.filter(function (x) { return x[0] === cod; })[0]; if (!c) return;
  if (!ELEGIDOS.some(function (x) { return x[0] === cod; })) ELEGIDOS.push(c);
  $('fCli').value = ''; $('lCli').style.display = 'none'; $('fCli').focus();
  pintarElegidos();
}
function sacarCli(cod) {
  ELEGIDOS = ELEGIDOS.filter(function (x) { return x[0] !== cod; });
  pintarElegidos();
}
function pintarElegidos() {
  $('eCli').innerHTML = ELEGIDOS.map(function (c) {
    return '<span class="chip" onclick="sacarCli(\'' + esc(c[0]) + '\')">' + esc(c[1]) +
      ' <span style="color:var(--muted)">✕</span></span>';
  }).join('');
}

function datosDe(i) {
  var e = i.entrada || 'nada', partes = [];
  if (e === 'cliente' || e === 'cliente_fechas') {
    if (!ELEGIDOS.length) throw new Error('Elegí al menos un cliente de la lista.');
    partes.push(ELEGIDOS.map(function (c) { return c[0]; }).join(','));
  }
  if (e === 'fechas' || e === 'cliente_fechas') {
    var a = $('fDesde').value, b = $('fHasta').value;
    if (!a || !b) throw new Error('Completá las fechas.');
    if (a > b) throw new Error('La fecha "desde" es posterior a "hasta".');
    partes.push(deIso(a), deIso(b));
  }
  if (e === 'texto' || e === 'texto_opcional') {
    var t = $('fTxt').value.trim();
    if (e === 'texto' && !t) throw new Error('Completá ' + (i.etiqueta || 'el detalle').toLowerCase() + '.');
    if (t) partes.push(t);
  }
  return partes.join(' ');
}
function etiquetaDatos(i, datos) {
  if (ELEGIDOS.length && (i.entrada === 'cliente' || i.entrada === 'cliente_fechas')) {
    var nombres = ELEGIDOS.length <= 3
      ? ELEGIDOS.map(function (c) { return c[1]; }).join(', ')
      : ELEGIDOS.length + ' clientes';
    return datos.replace(ELEGIDOS.map(function (c) { return c[0]; }).join(','), nombres);
  }
  return datos;
}

function enviar() {
  var i = ACTUAL, datos, conf = '';
  try { datos = datosDe(i); } catch (e) { toast(e.message); return; }
  var b = $('bPedir');
  if (i.confirmar) {
    conf = ($('fConf').value || '').trim().toUpperCase();
    if (conf !== i.confirmar) { toast('Escribí ' + i.confirmar + ' para confirmar.'); return; }
  }
  if (critico(i) && !confirmando) {           // segunda confirmación: hay que tocar dos veces
    confirmando = true;
    b.textContent = 'Tocá de nuevo para ejecutar';
    setTimeout(function () { if (confirmando) { confirmando = false; b.textContent = 'Ejecutar'; } }, 8000);
    return;
  }
  b.disabled = true; b.textContent = 'Enviando…';
  api('pedir', { clave: i.clave, datos: datos, detalle: etiquetaDatos(i, datos), confirmacion: conf }).then(function (d) {
    DATA.robot = d.robot; DATA.pedidos = d.pedidos;
    cerrarHoja(); pintarEstado(); pintarPedidos(); ver('mios'); programar();
    toast(DATA.robot.en_linea ? 'Pedido enviado' : 'Pedido anotado: sale cuando vuelva la notebook');
  }).catch(function (e) {
    b.disabled = false; b.textContent = critico(i) ? 'Ejecutar' : 'Pedir'; confirmando = false;
    toast(e.message || e);
  });
}

function cancelar(id) {
  api('cancelar', { id: id }).then(function (d) { DATA.pedidos = d.pedidos; pintarPedidos(); })
    .catch(function (e) { toast(e.message || e); });
}
function repetir(id) {
  var p = DATA.pedidos.filter(function (x) { return x.id === id; })[0]; if (!p) return;
  var i = DATA.informes.filter(function (x) { return x.nombre === p.informe; })[0];
  if (!i) { toast('Ese informe ya no está disponible.'); return; }
  abrir(i.clave);
}

if ('serviceWorker' in navigator) {
  var recargando = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (recargando) return;                     // versión nueva lista: se carga sola
    recargando = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    setInterval(buscarVersion, 3600000);        // una vez por hora, por las dudas
  });
}
arrancar();
